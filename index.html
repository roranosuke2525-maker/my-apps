<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Apps</title>
  <meta name="theme-color" content="#111827">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" href="./icons/icon-180.png">
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --card: #ffffff; --sub: #64748b; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #f8fafc; --card: #1e293b; --sub: #94a3b8; } }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
    }
    h1 { font-size: 1.5rem; margin: 8px 0 16px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a {
      display: flex; align-items: center; gap: 14px; padding: 14px;
      background: var(--card); color: inherit; text-decoration: none;
      border-radius: 16px; min-height: 72px;
    }
    a img { width: 48px; height: 48px; border-radius: 12px; }
    .name { font-weight: 700; }
    .desc { color: var(--sub); font-size: 0.875rem; }
    p.note { color: var(--sub); font-size: 0.8125rem; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>My Apps</h1>
  <!-- 新しいアプリを apps/ に追加したら、ここにも1行足す -->
  <ul>
    <li>
      <a href="./apps/hello/">
        <img src="./apps/hello/icons/icon-180.png" alt="">
        <div>
          <div class="name">Hello</div>
          <div class="desc">タップで数字が増える動作確認用アプリ</div>
        </div>
      </a>
    </li>
  </ul>
  <p class="note">各アプリを開いて Safari の共有ボタン →「ホーム画面に追加」でアプリとして使えます。</p>
</body>
</html>
