<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>習慣チェック</title>
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="習慣チェック">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="day-nav">
      <button type="button" id="prev" class="icon-btn" aria-label="前の日">‹</button>
      <h1 id="date-label">—</h1>
      <button type="button" id="next" class="icon-btn" aria-label="次の日">›</button>
    </div>
    <div class="status" id="status" hidden>
      <div class="lv"><span class="lv-num" id="lv">Lv—</span><span class="rest" id="rest"></span></div>
      <div class="progress">
        <div class="bar"><div class="fill" id="fill"></div></div>
        <span id="count">0 / 0</span>
      </div>
      <div class="must" id="must"></div>
    </div>
  </header>

  <main id="main">
    <section id="login" class="card" hidden>
      <h2>合言葉を入れてください</h2>
      <p class="sub">Worker に設定した APP_KEY です。この端末にだけ保存されます。</p>
      <form id="login-form">
        <input id="key" type="password" autocomplete="current-password" required minlength="16" placeholder="合言葉">
        <button type="submit" class="primary">はじめる</button>
      </form>
    </section>

    <section id="empty" class="card" hidden>
      <h2>この日の行がまだありません</h2>
      <p class="sub">Notion の DB_習慣チェック に、この日の行を作ってからチェックします。</p>
      <button type="button" id="create" class="primary">行を作る</button>
    </section>

    <div id="groups"></div>

    <section id="note-box" class="card" hidden>
      <label for="note" class="note-label">ひとこと <span class="sub">その他のできたこと（書くと +5EXP）</span></label>
      <textarea id="note" rows="2" maxlength="2000"></textarea>
      <button type="button" id="save-note" class="primary" disabled>保存</button>
    </section>

    <p class="foot">
      <a id="open-notion" href="#" target="_blank" rel="noopener" hidden>Notionで開く</a>
      <button type="button" id="refresh" class="link">更新</button>
      <button type="button" id="logout" class="link">合言葉を消す</button>
    </p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
