<title>今どこ工場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=DotGothic16&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* 工場の生産ライン。上：時計と構内放送、中：ライン（工程＝今どこ、箱＝タスク）、下：選んだ工程のアンドン（作業指示）。タブで 生産管理（診断）・受注（目標とPJ）・倉庫（すべてのDB） */
:root {
  --bg: #eceae6;
  --surface: #ffffff;
  --ink: #1b2330;
  --sub: #5d6878;
  --rule: #d4dae2;
  --accent: #1d5fae;
  --board: #15181e;
  --board-2: #222831;
  --led: #ffb21a;
  --led-2: #86e27c;
  --led-3: #ff6a55;
  --led-dim: #6c5a33;
  --l-main: #f2b705;
  --l-today: #e8930c;
  --l-plan: #2f6db5;
  --l-next: #d9482b;
  --l-inbox: #75808b;
  --l-wait: #9a7d4a;
  --l-proj: #7a5bb0;
  --l-ai: #17998a;
  --l-done: #2e9b57;
  --belt: #3a3f47;
  --floor: #e4e2dd;
  --floor-line: #d3d0c9;
  --crate: #c79a5b;
  --crate-edge: #8a6435;
  --hazard: #f2b705;
  --good: #0f9a55;
  --warn: #d98a00;
  --bad: #d7262b;
  --f-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --f-led: "DotGothic16", "Osaka-Mono", ui-monospace, monospace;
  --f-code: "Barlow Condensed", "Arial Narrow", "Zen Kaku Gothic New", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --surface: #1c2026; --ink: #e6ebf1; --sub: #95a1b0; --rule: #2a3542; --accent: #6aa8f0;
    --board: #07090c; --board-2: #12161c; --led-dim: #4d4024;
    --l-main: #f5c431; --l-today: #ffae3d; --l-plan: #5a9be8; --l-next: #ff6e4f; --l-inbox: #9aa5b0; --l-wait: #c4a46e; --l-proj: #a888dc; --l-ai: #3cc7b5; --l-done: #4cc27a; --belt: #0b0d10; --floor: #1b1f24; --floor-line: #262b32; --crate: #b98c50; --crate-edge: #6e4f28; --hazard: #f5c431;
    --good: #3ccb7f; --warn: #ffb02e; --bad: #ff5a5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1c2026; --ink: #e6ebf1; --sub: #95a1b0; --rule: #2a3542; --accent: #6aa8f0;
  --board: #07090c; --board-2: #12161c; --led-dim: #4d4024;
  --l-main: #f5c431; --l-today: #ffae3d; --l-plan: #5a9be8; --l-next: #ff6e4f; --l-inbox: #9aa5b0; --l-wait: #c4a46e; --l-proj: #a888dc; --l-ai: #3cc7b5; --l-done: #4cc27a; --belt: #0b0d10; --floor: #1b1f24; --floor-line: #262b32; --crate: #b98c50; --crate-edge: #6e4f28; --hazard: #f5c431;
  --good: #3ccb7f; --warn: #ffb02e; --bad: #ff5a5e;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-weight: 500; font-size: 12px; line-height: 1.35; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: var(--ink); }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.code { font-family: var(--f-code); font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums; }

#app { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; max-width: 720px; margin: 0 auto; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
@media (min-width: 420px) { #app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

/* 上：ロゴ・時計・ボタン */
header { display: flex; align-items: center; gap: 8px; padding-block: 6px 4px; }
.logo { width: 28px; height: 28px; border-radius: 6px; border: 4px solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, repeating-linear-gradient(45deg, var(--hazard) 0 5px, #1b1b1b 5px 10px) border-box; display: grid; place-items: center; font-weight: 900; font-size: 11px; background: var(--surface); flex: none; }
.ttl { font-weight: 900; font-size: 15px; letter-spacing: .04em; white-space: nowrap; }
.ttl small { display: block; font-family: var(--f-code); font-size: 9px; color: var(--sub); letter-spacing: .14em; font-weight: 600; line-height: 1; }
.clock { margin-left: auto; font-family: var(--f-code); font-weight: 700; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.clock .c { animation: colon 1s steps(1) infinite; }
.clock small { font-size: 12px; color: var(--sub); margin-left: 1px; }
@keyframes colon { 50% { opacity: .15; } }
.hb { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--rule); background: var(--surface); display: grid; place-items: center; font-size: 14px; flex: none; }
.hb.pen { border-color: var(--accent); color: var(--accent); }
.loading #reload span { display: inline-block; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 構内放送の電光掲示 */
.ticker { background: var(--board); color: var(--led); font-family: var(--f-led); font-size: 12px; height: 22px; overflow: hidden; border-radius: 4px; position: relative; display: flex; align-items: center; }
.ticker b { flex: none; background: var(--hazard); color: #1b1b1b; font-family: var(--f-ui); font-weight: 900; font-size: 10px; padding: 0 6px; height: 100%; display: grid; place-items: center; z-index: 1; }
.ticker .tr { display: flex; white-space: nowrap; animation: marquee var(--dur, 30s) linear infinite; padding-left: 12px; }
.ticker .tr span { padding-right: 48px; }
@keyframes marquee { to { transform: translateX(-50%); } }

main { min-height: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; animation: viewin .35s ease-out; }
@keyframes viewin { from { opacity: 0; transform: translateY(6px); } }

/* ライン（工場の床） */
.map { flex: none; border-radius: 10px; border: 1px solid var(--rule); position: relative; overflow: hidden; background-color: var(--floor);
  background-image: linear-gradient(var(--floor-line) 1px, transparent 1px), linear-gradient(90deg, var(--floor-line) 1px, transparent 1px); background-size: 24px 24px; }
.map svg { display: block; width: 100%; height: 100%; }
.map .ln { fill: none; stroke: var(--belt); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.1s ease-out forwards; }
.map.still .ln { animation: none; stroke-dashoffset: 0; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.map .beltmv { fill: none; stroke: rgba(255, 255, 255, .35); stroke-width: 2; stroke-dasharray: 4 6; animation: beltmove .55s linear infinite; }
.map .beltmv.stop { animation: none; stroke: rgba(255, 255, 255, .15); }
@keyframes beltmove { to { stroke-dashoffset: -10; } }
.map .st { cursor: pointer; }
.map .mc { stroke: rgba(0, 0, 0, .25); stroke-width: 1; }
.map .st.sel .mc { stroke: var(--ink); stroke-width: 2.5; }
.map .hz { fill: url(#hz); }
.map .st text { font-family: var(--f-ui); font-weight: 900; }
.map .st .nm { fill: #fff; font-size: 10px; }
.map .st .cnt { fill: #fff; font-family: var(--f-code); font-size: 13px; }
.map .st .sub { fill: var(--sub); font-size: 8.5px; font-weight: 700; }
.map .st .cd { font-family: var(--f-code); font-size: 7.5px; letter-spacing: .05em; }
.map .crate { fill: var(--crate); stroke: var(--crate-edge); stroke-width: .8; }
.map .crate.bad { fill: var(--bad); stroke: #7a1515; }
.map .gear { fill: rgba(255, 255, 255, .85); transform-box: view-box; animation: spin 2.6s linear infinite; }
.map .gear.slow { animation-duration: 9s; } .map .gear.stop { animation: none; opacity: .6; }
.map .gear .hub { fill: rgba(0, 0, 0, .35); }
.map .lamp { fill: var(--good); stroke: rgba(0, 0, 0, .3); }
.map .lamp.on { fill: var(--bad); animation: colon .7s steps(1) infinite; }
.map .arm { fill: var(--l-ai); transform-box: view-box; animation: armswing 2.6s ease-in-out infinite alternate; }
.map .arm2 { transform-box: view-box; animation: armswing2 1.7s ease-in-out infinite alternate; }
@keyframes armswing { from { transform: rotate(-28deg); } to { transform: rotate(22deg); } }
@keyframes armswing2 { from { transform: rotate(-20deg); } to { transform: rotate(35deg); } }
.map .pulse { fill: none; stroke-width: 2; animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.6); } }
.map .delay { font-family: var(--f-ui); font-size: 8.5px; font-weight: 900; fill: #fff; }
.map .bump { animation: bump .55s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes bump { 40% { transform: scale(1.18); } }
.map .floor-label { font-family: var(--f-code); font-size: 9px; fill: var(--sub); letter-spacing: .12em; font-weight: 700; }

/* アンドン（作業指示の電光板） */
.board { flex: 1; min-height: 0; background: var(--board); border-radius: 8px; color: var(--led); font-family: var(--f-led); display: flex; flex-direction: column; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.board .bh { display: flex; align-items: center; gap: 6px; padding: 5px 8px 4px; background: var(--board-2); font-family: var(--f-ui); color: #fff; }
.board .bh .sta { display: flex; align-items: center; gap: 5px; font-weight: 900; font-size: 13px; white-space: nowrap; }
.board .bh .sta i { width: 16px; height: 16px; border-radius: 50%; border: 3.5px solid var(--c); background: #fff; display: inline-block; }
.board .bh .sta .code { font-size: 10px; color: #aab; }
.board .bh .note { flex: 1; min-width: 0; font-size: 9.5px; color: #aab3c0; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.board .cols { display: grid; grid-template-columns: 40px 1fr 62px 30px; gap: 6px; padding: 2px 8px; font-family: var(--f-ui); font-size: 8.5px; color: #8790a0; border-bottom: 1px solid #2b313b; }
.board .rows { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; will-change: transform; }
.brow { display: grid; grid-template-columns: 40px 1fr 62px 30px; gap: 6px; align-items: center; height: 30px; flex: none; padding: 0 8px; text-align: left; width: 100%; border-bottom: 1px solid #1f242c; color: var(--led); font-family: var(--f-led); font-size: 13px; animation: flap .38s both; animation-delay: calc(var(--i, 0) * 45ms); transform-origin: center top; }
@keyframes flap { from { transform: rotateX(-90deg); opacity: 0; } 60% { transform: rotateX(12deg); opacity: 1; } }
.brow:active { background: #232a33; }
.brow .kind { font-size: 11px; text-align: center; border-radius: 2px; padding: 1px 0; color: var(--board); background: var(--k, var(--led)); font-family: var(--f-ui); font-weight: 900; white-space: nowrap; overflow: hidden; }
.brow .dest { min-width: 0; overflow: hidden; white-space: nowrap; position: relative; }
.brow .dest span { display: inline-block; }
.brow .dest.run span { animation: run var(--d, 8s) linear 1.2s infinite; }
@keyframes run { 0%, 12% { transform: translateX(0); } 88%, 100% { transform: translateX(var(--x)); } }
.brow .time { text-align: right; font-size: 12px; white-space: nowrap; }
.brow .time.late { color: var(--led-3); }
.brow .time.ok { color: var(--led-2); }
.brow .plat { text-align: center; font-size: 11px; color: #c9d0da; }
.brow .chk { width: 22px; height: 22px; border: 1.5px solid var(--led-2); border-radius: 3px; color: var(--led-2); font-size: 13px; display: grid; place-items: center; }
.board .dots { display: flex; justify-content: center; gap: 5px; padding: 4px 0 5px; flex: none; }
.board .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--led-dim); }
.board .dots i.on { background: var(--led); width: 14px; border-radius: 3px; }
.board .empty { flex: 1; display: grid; place-items: center; color: #8a7a52; font-size: 13px; text-align: center; padding: 10px; }
.in-l { animation: slidel .32s ease-out; } .in-r { animation: slider .32s ease-out; }
@keyframes slidel { from { transform: translateX(40%); opacity: 0; } }
@keyframes slider { from { transform: translateX(-40%); opacity: 0; } }

/* 生産管理 */
.status { flex: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; display: grid; gap: 4px; border-left: 6px solid var(--sc); text-align: left; }
.status .top { display: flex; align-items: center; gap: 8px; }
.status .pill { font-weight: 900; font-size: 11px; color: #fff; background: var(--sc); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.status .pill::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #fff; margin-right: 5px; vertical-align: 1px; animation: colon 1.2s steps(1) infinite; }
.status h3 { margin: 0; font-size: 13px; font-weight: 900; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status p { margin: 0; font-size: 11px; color: var(--sub); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.status p b { color: var(--ink); }
.gauges { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.gauge { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 6px 4px 5px; display: grid; justify-items: center; gap: 1px; }
.gauge svg { width: 54px; height: 32px; overflow: visible; }
.gauge .trk { fill: none; stroke: var(--rule); stroke-width: 6; stroke-linecap: round; }
.gauge .val { fill: none; stroke: var(--gc); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(.2, .8, .2, 1); }
.gauge b { font-family: var(--f-code); font-size: 18px; line-height: 1; margin-top: -10px; }
.gauge span { font-size: 9px; color: var(--sub); white-space: nowrap; }
.panel { flex: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
.panel h4 { margin: 0; font-size: 11px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
.panel h4 small { font-weight: 500; color: var(--sub); font-size: 9px; margin-left: auto; white-space: nowrap; }
.chart svg { display: block; width: 100%; height: 112px; }
.chart .bar { transform-box: fill-box; transform-origin: bottom; animation: grow .8s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 90ms); }
@keyframes grow { from { transform: scaleY(0); } }
.chart .rate { fill: none; stroke: var(--l-today); stroke-width: 2.5; stroke-dasharray: 600; stroke-dashoffset: 600; animation: dash 1.4s .4s ease-out forwards; }
@keyframes dash { to { stroke-dashoffset: 0; } }
.chart text { font-family: var(--f-code); font-size: 9px; fill: var(--sub); }

/* 受注（目標とPJ） */
.goal-row { height: 36px; display: flex; align-items: center; gap: 7px; flex: none; text-align: left; width: 100%; animation: flap .38s both; animation-delay: calc(var(--i, 0) * 45ms); }
.goal-row .term { width: 26px; height: 26px; border-radius: 4px; background: var(--hazard); color: #1b1b1b; display: grid; place-items: center; font-weight: 900; font-size: 11px; flex: none; }
.goal-row .gn { font-weight: 900; font-size: 12.5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.goal-row .gm { font-size: 9.5px; color: var(--sub); white-space: nowrap; }
.pj-row { height: 36px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px; flex: none; padding-left: 12px; text-align: left; width: 100%; position: relative; animation: flap .38s both; animation-delay: calc(var(--i, 0) * 45ms); }
.pj-row::before { content: ""; position: absolute; left: 12px; top: 0; bottom: 0; border-left: 2px dotted var(--rule); }
.pj-row .trackwrap { position: relative; height: 34px; margin-left: 8px; min-width: 0; }
.pj-row .pn { position: absolute; left: 0; top: 1px; font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pj-row .track { position: absolute; left: 0; right: 0; bottom: 7px; height: 6px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--belt) 0 6px, color-mix(in srgb, var(--belt) 70%, #fff) 6px 8px); background-size: 8px 100%; animation: beltx .6s linear infinite; }
@keyframes beltx { to { background-position: 8px 0; } }
.pj-row .stop { position: absolute; bottom: 4px; width: 4px; height: 12px; margin-left: -2px; border-radius: 1px; background: var(--rule); }
.pj-row .stop.done { background: var(--pc); }
.pj-row .train { position: absolute; bottom: 5px; left: 0; width: 12px; height: 12px; margin-left: -6px; border-radius: 2px; background: var(--crate); border: 1.5px solid var(--crate-edge); transition: left 1.4s cubic-bezier(.2, .8, .2, 1); }
.pj-row .pp { font-family: var(--f-code); font-size: 12px; color: var(--sub); }
.stack { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.pager-dots { display: flex; justify-content: center; gap: 5px; flex: none; padding: 2px 0; min-height: 9px; }
.pager-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--rule); }
.pager-dots i.on { background: var(--accent); width: 14px; border-radius: 3px; }

/* 倉庫（ラック） */
.net-row { height: 40px; display: grid; grid-template-columns: 26px 92px 1fr 24px; align-items: center; gap: 7px; flex: none; text-align: left; width: 100%; animation: flap .38s both; animation-delay: calc(var(--i, 0) * 40ms); }
.lb { width: 24px; height: 24px; border-radius: 5px; border: 4px solid var(--lc); background: var(--surface); display: grid; place-items: center; font-family: var(--f-code); font-weight: 700; font-size: 12px; flex: none; }
.net-row .nm { font-weight: 900; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.net-row .rail { position: relative; height: 18px; }
.net-row .rail::before { content: ""; position: absolute; left: 0; right: 0; top: 15px; height: 3px; background: var(--sub); }
.net-row .rail i { position: absolute; top: 4px; width: 11px; height: 11px; margin-left: -5px; border-radius: 2px; background: color-mix(in srgb, var(--lc) 70%, var(--surface)); border: 1px solid var(--lc); }
.net-row .rail .tr { position: absolute; top: 18px; width: 18px; height: 7px; margin-left: -9px; border-radius: 2px; background: var(--hazard); box-shadow: inset 4px 0 0 var(--ink); animation: shuttle var(--d, 7s) ease-in-out infinite alternate; }
@keyframes shuttle { from { left: 4%; } to { left: 96%; } }
.net-row .n { font-family: var(--f-code); font-size: 13px; color: var(--sub); text-align: right; }
.strip { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; position: relative; padding-left: 4px; touch-action: pan-y; }
.strip::before { content: ""; position: absolute; left: 13px; top: 6px; bottom: 6px; width: 11px; background: repeating-linear-gradient(to bottom, var(--lc) 0 4px, transparent 4px 40px), linear-gradient(to right, var(--sub) 0 2px, transparent 2px 9px, var(--sub) 9px 11px); }
.sta-row { height: 40px; display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; flex: none; text-align: left; width: 100%; position: relative; animation: flap .38s both; animation-delay: calc(var(--i, 0) * 45ms); }
.sta-row i { width: 22px; height: 18px; border-radius: 3px; background: var(--crate); border: 2px solid var(--crate-edge); z-index: 1; box-shadow: inset 0 -5px 0 var(--lc); }
.sta-row b { font-weight: 900; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sta-row .code { font-size: 12px; color: var(--sub); }
.crumb { display: flex; align-items: center; gap: 8px; flex: none; }
.crumb button { font-size: 11px; color: var(--accent); white-space: nowrap; font-weight: 700; }
.crumb h2 { margin: 0; font-size: 14px; font-weight: 900; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb h2 span { font-weight: 500; font-size: 10.5px; color: var(--sub); }
.crumb input { flex: 1; min-width: 0; font-size: 11px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); }

/* 下のタブ */
nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding-block: 5px 6px; }
nav button { display: grid; justify-items: center; gap: 2px; padding: 4px 0; border-radius: 9px; font-size: 10px; font-weight: 700; color: var(--sub); }
nav button i { width: 18px; height: 18px; border-radius: 4px; border: 3.5px solid var(--nc); background: var(--surface); transition: transform .2s; }

  // ================= ライン =================

    const A = STATIONS[from], B = STATIONS[to];
    const cx = (A.x + B.x) / 2, cy = Math.min(A.y, B.y) - 50;
    const box = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    box.setAttribute("width", "11"); box.setAttribute("height", "11"); box.setAttribute("rx", "1.5"); box.setAttribute("class", "mover");
    svg.append(box);
    return new Promise((res) => {
      const t0 = performance.now(), dur = 800;
      const step = (now) => {
        const k = Math.min(1, (now - t0) / dur); const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        const x = (1 - e) ** 2 * A.x + 2 * (1 - e) * e * cx + e * e * B.x, y = (1 - e) ** 2 * (A.y - 20) + 2 * (1 - e) * e * cy + e * e * (B.y - 20);

  // ベルトの上を流れる箱
  const trains = (() => {
    let list = [], raf = 0, last = 0;
    function mount() {

      for (const p of document.querySelectorAll("#map [data-belt]")) {
        const L = LINES.find((l) => l.id === p.dataset.belt); const len = p.getTotalLength();
        for (let i = 0; i < L.n; i++) {
          const el = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          el.setAttribute("x", "-4"); el.setAttribute("y", "-4"); el.setAttribute("width", "8"); el.setAttribute("height", "8"); el.setAttribute("rx", "1"); el.setAttribute("class", "crate");
          g.append(el);
          list.push({ p, len, el, s: (i / L.n) * len, v: L.v });
        }
      }
      last = performance.now(); raf = requestAnimationFrame(tick);
    }
    function tick(now) {
      raf = 0;
      if (!list.length || !list[0].el.isConnected) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      for (const t of list) {
        t.s = (t.s + t.v * dt) % t.len;
        const a = t.p.getPointAtLength(t.s), b = t.p.getPointAtLength(Math.min(t.len, t.s + 1));

      }
      if (!document.hidden) raf = requestAnimationFrame(tick);
    }
    function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; list = []; }
    document.addEventListener("visibilitychange", () => { if (!document.hidden && list.length && !raf) { last = performance.now(); raf = requestAnimationFrame(tick); } });
    return { mount, stop };
  })();

      cols = ["品種", "品名", "状況", "出荷"];
      draw = (t, i) => brow(t, i, { time: t.date < today ? `遅れ${diffDays(t.date, today)}日` : "本日", cls: t.date < today ? "late" : "ok", check: true });
    } else if (k === "plan") {
      items = at("plan").sort((a, b) => a.date.localeCompare(b.date));
      note = items[0] ? `次の着手 ${md(items[0].date)}（${WD[dow(items[0].date)]}）` : "";
      draw = (t, i) => brow(t, i, { time: `${md(t.date)}${WD[dow(t.date)]}` });
    } else if (k === "next") {
      items = at("next").sort((a, b) => (a.edited || "").localeCompare(b.edited || ""));
      note = "長く滞留している順";
      cols = ["品種", "品名", "滞留", "ライン"];
      draw = (t, i) => { const d = ageOf(t); return brow(t, i, { time: `${d}日`, cls: d > 14 ? "late" : "" }); };
    } else if (k === "inbox") {
      items = at("inbox").sort((a, b) => (b.edited || "").localeCompare(a.edited || ""));
      note = `INBOX・日付なし${S.inboxMore ? "　最近の100件" : ""}`;
      cols = ["品種", "品名", "入荷", "分類"];
      draw = (t, i) => brow(t, i, { time: t.edited ? md(jst(Date.parse(t.edited))) : "", plat: (t.tag || "").slice(0, 4) });
    } else if (k === "wait") {
      items = at("wait").sort((a, b) => (a.edited || "").localeCompare(b.edited || ""));
      note = "部品・返事待ちで保留中";
      cols = ["品種", "品名", "保留", "ライン"];
      draw = (t, i) => brow(t, i, { time: `${ageOf(t)}日`, cls: "late" });
    } else if (k === "ai") {
      const order = { "💭": 0, "🔍✅": 1, "💬": 2, "🔍": 3, "🔬": 4 };
      items = at("ai").sort((a, b) => (order[a.ai] ?? 9) - (order[b.ai] ?? 9));
      note = `自分の番 ${mineCount()}（💭回答待ち・🔍✅判定待ち）`;
      cols = ["品種", "品名", "印", "ライン"];
      draw = (t, i) => brow(t, i, { time: t.ai || "・", cls: t.ai === "💭" || t.ai === "🔍✅" ? "late" : "" });
    } else if (k === "done") {
      items = S.doneToday;
      note = "本日の出荷";
      cols = ["品種", "品名", "", ""];
      draw = (t, i) => `<div class="brow" style="--i:${i}">${kindCell(t.weight)}<span class="dest"><span>${esc(t.name)}</span></span><span class="time ok">出荷済</span><span class="plat">${esc(WAKU[t.waku] || "")}</span></div>`;
    } else if (k === "proj") {
      items = S.projects.filter((p) => !p.status.includes("完了")).sort((a, b) => (a.status.includes("進行中") ? 0 : 1) - (b.status.includes("進行中") ? 0 : 1) || (b.edited || "").localeCompare(a.edited || ""));
      note = "受注タブでロットごとに見られます";
      cols = ["状態", "ロット", "完成", "残り"];
      draw = (p, i) => { const st = projStats(p); return `<div class="brow" role="button" tabindex="0" data-proj-open="${p.id}" style="--i:${i}"><span class="kind" style="--k:${p.status.includes("進行中") ? "#ff8a3d" : "#9aa6b2"}">${esc(p.status.split(" ")[1] || "")}</span><span class="dest"><span>${esc(p.name)}</span></span><span class="time">${st.done}/${p.total}</span><span class="plat">${st.open.length}</span></div>`; };
    }
    view.insertAdjacentHTML("beforeend", `<div class="board"><div class="bh"><span class="sta" style="--c:var(${s.c})"><i></i>${s.name}<span class="code">${s.code}</span></span><span class="note">${esc(note)}</span></div>
      <div class="cols">${cols.map((c, i) => `<span style="${i === 2 ? "text-align:right" : i === 3 ? "text-align:center" : ""}">${c}</span>`).join("")}</div>
      <div class="rows"></div><div class="dots"></div></div>`);
    const box = $(".board .rows", view);
    if (!items.length) { box.outerHTML = `<div class="empty">${k === "done" ? "本日の出荷はまだありません" : "この工程に仕掛かり中の品はありません"}</div>`; return; }
    fill(box, `st:${k}`, items, 30, draw, $(".board .dots", view));
  }

  // ================= 描画 =================
  const main = $("#main");
  function render() {
    for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-pressed", String(b.dataset.tab === S.tab));
    document.body.classList.toggle("loading", S.mode === "loading");
    renderTicker();
    const keep = S.tab === main.dataset.tab; // 同じタブの描き直しでは、入ってくる動きを付けない
    main.dataset.tab = S.tab;
    main.innerHTML = `<div class="view" style="${keep ? "animation:none" : ""}"></div>`;
    const view = $(".view", main);
    if (S.error) view.insertAdjacentHTML("beforeend", `<div class="banner err">${esc(S.error)}</div>`);
    if (S.mode === "demo") view.insertAdjacentHTML("beforeend", `<div class="banner">見本です（Notion につながっていません）。claude.ai で開くと自分のデータが出ます</div>`);
    ({ map: renderMap, ops: renderOps, goal: renderGoal, net: renderNet })[S.tab](view, keep);
    S.slide = null;
    if (S.tab === "map") trains.mount(); else trains.stop();
  }
  function renderMap(view, keep) {
    const h = Math.min(250, Math.max(190, Math.round(main.clientWidth * 262 / 360)));
    view.insertAdjacentHTML("beforeend", `<div class="map${keep ? " still" : ""}" id="map" style="height:${h}px">${mapSvg()}</div>`);
    if (S.mode === "loading" && !S.tasks.length) { view.insertAdjacentHTML("beforeend", `<div class="board"><div class="empty">Notion から生産計画を読み込んでいます…</div></div>`); return; }
    stationBoard(view);
  }

  // 構内放送（上の電光掲示）
  function renderTicker() {
    const late = lateCount();
    const d = S.diag.at(-1);
    const waits = at("wait").map(ageOf);
    const mine = mineCount();
    const parts = [];
    if (S.mode === "loading" && !S.tasks.length) parts.push("ただいま生産計画を読み込んでいます");
    else {
      parts.push(late ? `加工ラインで ${late}件 の遅れが出ています` : "加工ラインは予定どおり稼働中です");
      parts.push(`本日の出荷 ${S.doneToday.length}件／加工待ち ${at("today").length}件／受入 ${at("inbox").length}件`);
      if (waits.length) parts.push(`保留棚は最長 ${Math.max(...waits)}日 止まっています`);
      if (mine) parts.push(`AIロボ：あなたの回答・判定待ちが ${mine}件 あります`);
      if (d) parts.push(`第${d.no}回 診断「${d.verdict}」　改善：${d.next}`);
      const lg = S.logs[0]; if (lg) parts.push(`最新の作業日報　${lg.event}：${lg.name}`);
    }
    const s = parts.join("　◆　");
    const el = $("#ticker");
    if (el.dataset.s === s) return;
    el.dataset.s = s;
    el.innerHTML = `<span>${esc(s)}</span><span aria-hidden="true">${esc(s)}</span>`;
    el.style.setProperty("--dur", `${Math.max(18, s.length * 0.28)}s`);
  }

  // ================= 生産管理（診断・作業日報） =================
  function gauge(label, value, max, color, unit) {
    const frac = Math.max(0, Math.min(1, max ? value / max : 0));
    const L = Math.PI * 22;
    return `<div class="gauge" style="--gc:var(${color})"><svg viewBox="-27 -27 54 32" aria-hidden="true"><path class="trk" d="M-22 0 A22 22 0 0 1 22 0"></path><path class="val" d="M-22 0 A22 22 0 0 1 22 0" stroke-dasharray="${L}" stroke-dashoffset="${L}" data-to="${L * (1 - frac)}"></path></svg>
      <b data-count="${value}">0</b><span>${label}（${unit}）</span></div>`;
  }
  function renderOps(view) {
    const d = S.diag.at(-1);
    const ok = d && /壊れない/.test(d.verdict);
    const late = lateCount();
    const total = at("today").length + S.doneToday.length;
    const pct = total ? Math.round((S.doneToday.length / total) * 100) : 0;
    const waits = at("wait").map(ageOf);
    const mine = mineCount();
    view.insertAdjacentHTML("beforeend", d
      ? `<button type="button" class="status" style="--sc:var(${ok ? "--good" : "--warn"})" data-diag="${d.id}"><span class="top"><span class="pill">${ok ? "正常稼働" : "要改善"}</span><h3>第${d.no}回 診断「${esc(d.verdict)}」</h3></span>
        <p>${d.from ? `${md(d.from)}〜${md(d.to || d.from)}　` : ""}出荷 ${d.done}／入荷 ${d.inflow}　今日やる完了率 ${Math.round(d.rate * 100)}%</p><p><b>改善</b>　${esc(d.next)}</p></button>`
      : `<div class="status" style="--sc:var(--sub)"><div class="top"><span class="pill">情報なし</span><h3>診断レポートがまだ読めていません</h3></div><p>${esc(S.extraErr.diag || "DB_診断レポート から読み込みます")}</p></div>`);
    view.insertAdjacentHTML("beforeend", `<div class="gauges">${gauge("出荷率", pct, 100, pct >= 50 ? "--good" : "--l-today", "%")}${gauge("遅れ", late, Math.max(5, late), late ? "--bad" : "--good", "件")}${gauge("在庫", at("inbox").length, Math.max(30, at("inbox").length), "--l-inbox", "件")}${gauge("自分の番", mine, Math.max(5, mine), "--l-ai", "件")}</div>`);
    // 診断の推移：完了・流入の棒と、今日やる完了率の線
    const ds = S.diag.slice(-8);
    if (ds.length) {
      const W = 340, H = 112, pad = 22, bw = Math.min(24, (W - pad * 2) / ds.length / 2.6);
      const max = Math.max(10, ...ds.map((x) => Math.max(x.done, x.inflow)));
      const xs = ds.map((_, i) => pad + ((i + 0.5) * (W - pad * 2)) / ds.length);
      const yv = (v) => H - 16 - (v / max) * (H - 32);
      const yr = (r) => H - 16 - r * (H - 32);
      const bars = ds.map((x, i) => `<rect class="bar" style="--i:${i}" x="${xs[i] - bw - 1}" y="${yv(x.inflow)}" width="${bw}" height="${H - 16 - yv(x.inflow)}" rx="2" fill="var(--rule)"></rect>
        <rect class="bar" style="--i:${i}" x="${xs[i] + 1}" y="${yv(x.done)}" width="${bw}" height="${H - 16 - yv(x.done)}" rx="2" fill="var(--l-plan)"></rect><text x="${xs[i]}" y="${H - 4}" text-anchor="middle">第${x.no}回</text>`).join("");
      const line = ds.map((x, i) => `${i ? "L" : "M"}${xs[i].toFixed(1)} ${yr(x.rate).toFixed(1)}`).join(" ");
      const pts = ds.map((x, i) => `<circle cx="${xs[i]}" cy="${yr(x.rate)}" r="3" fill="var(--surface)" stroke="var(--l-today)" stroke-width="2"></circle><text x="${xs[i]}" y="${yr(x.rate) - 6}" text-anchor="middle" fill="var(--l-today)">${Math.round(x.rate * 100)}%</text>`).join("");
      view.insertAdjacentHTML("beforeend", `<div class="panel chart"><h4>生産の推移（診断）<small><span>■入荷</span>　<span style="color:var(--l-plan)">■出荷</span>　<span style="color:var(--l-today)">●今日やる完了率</span></small></h4>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="診断の推移"><line x1="${pad}" x2="${W - pad}" y1="${H - 16}" y2="${H - 16}" stroke="var(--rule)"></line>${bars}<path class="rate" d="${line}"></path>${pts}</svg></div>`);
    }
    // 作業日報（DB_運用ログ）
    view.insertAdjacentHTML("beforeend", `<div class="board log"><div class="bh"><span class="sta" style="--c:var(--l-today)"><i></i>作業日報<span class="code">LOG</span></span><span class="note">DB_運用ログ　新しい順</span></div><div class="rows"></div><div class="dots"></div></div>`);
    const box = $(".log .rows", view);
    if (!S.logs.length) box.outerHTML = `<div class="empty">${esc(S.extraErr.log || "作業日報はまだありません")}</div>`;
    else {
      const evColor = { "定期実行": "#86e27c", "仕組み変更": "#ff6a55", "ステータス": "#ffb21a", "NEXT": "#ffb21a", "作成": "#74b3ff", "AI依頼": "#86e27c", "習慣チェック": "#c79bff", "実行日": "#74b3ff" };
      const today = TODAY();
      fill(box, "log", S.logs, 30, (l, i) => `<div class="brow" role="button" tabindex="0" data-log="${l.id}" style="--i:${i};grid-template-columns:58px 1fr 40px"><span class="kind" style="--k:${evColor[l.event] || "#9aa6b2"};font-size:9.5px">${esc(l.event || "記録")}</span>
        <span class="dest"><span>${esc(l.name)}${l.body ? `　${esc(l.body)}` : ""}</span></span><span class="time">${l.at ? (jst(Date.parse(l.at)) === today ? jstTime(Date.parse(l.at)) : md(jst(Date.parse(l.at)))) : ""}</span></div>`, $(".log .dots", view));
    }
    // ゲージ・数字を動かす
    requestAnimationFrame(() => requestAnimationFrame(() => {
      for (const p of view.querySelectorAll(".gauge .val")) p.style.strokeDashoffset = p.dataset.to;
      for (const b of view.querySelectorAll("[data-count]")) countUp(b, +b.dataset.count);
    }));
  }
  function countUp(el, to) {
    if (reduce || !to) { el.textContent = String(to); return; }
    const t0 = performance.now();
    const step = (now) => { const k = Math.min(1, (now - t0) / 900); el.textContent = String(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  // ================= 受注（目標とプロジェクト） =================
  function projStats(p) {
    const open = S.tasks.filter((t) => t.projects.includes(p.id) && t.status !== ST.done && t.status !== ST.ref);
    const done = Math.max(0, p.total - open.length);
    return { open, done, pct: p.total ? Math.round((done / p.total) * 100) : 0 };
  }
  const PJ_COLORS = ["--l-proj", "--l-plan", "--l-today", "--l-ai", "--l-done", "--l-next", "--l-wait"];
  function renderGoal(view) {
    const order = (s) => (/挑戦中/.test(s) ? 0 : /種/.test(s) ? 2 : 1);
    const goals = S.goals.filter((g) => !/達成|完了|手放/.test(g.status)).sort((a, b) => order(a.status) - order(b.status));
    const used = new Set(); const flat = [];
    for (const g of goals) {
      flat.push({ k: "g", g });
      g.projects.forEach((pid, j) => { const p = S.projects.find((x) => x.id === pid); if (p && !p.status.includes("完了")) { flat.push({ k: "p", p, c: PJ_COLORS[j % PJ_COLORS.length] }); used.add(p.id); } });
    }
    const rest = S.projects.filter((p) => !used.has(p.id) && !p.status.includes("完了"));
    if (rest.length) { flat.push({ k: "g", g: { name: "受注先（目標）がまだないロット", status: "", area: "", id: "" } }); rest.forEach((p, j) => flat.push({ k: "p", p, c: PJ_COLORS[j % PJ_COLORS.length] })); }
    const live = goals.filter((g) => /挑戦中/.test(g.status)).length;
    view.insertAdjacentHTML("beforeend", `<div class="crumb"><h2>受注　<span>目標＝受注、プロジェクト＝製造ロット（箱の位置＝完成度）　挑戦中 ${live}</span></h2></div><div class="stack" id="goalstack"></div><div class="pager-dots" id="goaldots"></div>`);
    const box = $("#goalstack", view);
    if (!flat.length) { box.outerHTML = `<div class="empty">${esc(S.extraErr.goal || "目標・プロジェクトはまだありません")}</div>`; return; }
    fill(box, "goal", flat, 36, (x, i) => {
      if (x.k === "g") {
        const g = x.g;
        return `<button type="button" class="goal-row" style="--i:${i}" ${g.id ? `data-goal="${g.id}"` : "disabled"}><span class="term">${/挑戦中/.test(g.status) ? "🔥" : g.id ? "受" : "？"}</span><span class="gn">${esc(g.name)}</span><span class="gm">${esc([g.status, g.area, g.due ? `〜${md(g.due)}` : ""].filter(Boolean).join("・"))}</span></button>`;
      }
      const p = x.p; const st = projStats(p);
      const n = Math.min(p.total, 10);
      const stops = Array.from({ length: n }, (_, j) => { const pos = n === 1 ? 50 : 4 + (j * 92) / (n - 1); const done = (j + 1) / n <= st.done / Math.max(1, p.total); return `<span class="stop${done ? " done" : ""}" style="left:${pos}%"></span>`; }).join("");
      return `<button type="button" class="pj-row" style="--i:${i};--pc:var(${x.c})" data-proj-open="${p.id}"><span class="trackwrap"><span class="pn">${esc(p.name)}<span style="color:var(--sub);font-weight:500;font-size:9.5px">　${esc(p.status)}</span></span><span class="track"></span>${stops}<span class="train" data-left="${Math.max(3, Math.min(97, st.pct))}"></span></span><span class="pp">${st.done}/${p.total}</span></button>`;
    }, $("#goaldots", view));
    requestAnimationFrame(() => requestAnimationFrame(() => { for (const t of box.querySelectorAll(".train")) t.style.left = `${t.dataset.left}%`; }));
  }

  // ================= 倉庫（すべてのDB） =================
  function initDbs() {
    const names = store.get("dbnames") || {};
    S.dbs = SECTIONS.flatMap(([sec, items]) => items.map(([id, name]) => ({ id, name: name || names[id] || "", sec })));
  }
  function netLines() {
    const secs = [...new Set(S.dbs.map((d) => d.sec))];
    return secs.map((sec, i) => ({ sec, code: LINE_CODES[i] || String(i + 1), c: LINE_COLORS[i % LINE_COLORS.length], dbs: S.dbs.filter((d) => d.sec === sec) }));
  }
  async function refreshDbList() {
    try {
      const res = await call("fetch", { id: DB_PAGE });
      const body = String(res.text || "");
      const out = []; let sec = "その他";
      const re = /<h2[^>]*>\s*([^<]+?)\s*<\/h2>|^##\s+(.+)$|<database url="[^"]+"(?: data-source-url="collection:\/\/([0-9a-f-]+)")?[^>]*>([\s\S]*?)<\/database>/gm;
      for (const m of body.matchAll(re)) {
        if (m[1] || m[2]) { sec = (m[1] || m[2]).trim(); continue; }
        if (!m[3]) continue;
        const prev = S.dbs.find((d) => d.id === m[3]);
        out.push({ id: m[3], name: text(m[4]) || prev?.name || "", sec });
      }
      if (out.length >= 5) S.dbs = out;
    } catch { /* 控えの一覧のまま */ }
    if (S.tab === "net" && !S.dbOpen && !S.leaf) render();
    fillDbNames();
  }
  // 名前のないDBは1つずつ読んで名前を出す（3本ずつ・覚えておく）
  async function fillDbNames() {
    const names = store.get("dbnames") || {};
    const todo = S.dbs.filter((d) => !d.name);
    let timer;
    const later = () => { clearTimeout(timer); timer = setTimeout(() => { if (S.tab === "net" && S.netLine && !S.dbOpen && !S.leaf) render(); }, 300); };
    const worker = async () => {
      for (let d; (d = todo.shift());) {
        try {
          const res = await call("fetch", { id: `collection://${d.id}` });
          const m = String(res.text || "").match(/The title of this Data Source is:\s*(.+)/);
          d.name = (m ? m[1] : res.title || "").trim() || "（名前なし）";
          names[d.id] = d.name; store.set("dbnames", names);
        } catch { d.name = d.name || "（読めないDB）"; }
        later();
      }
    };
    await Promise.all([worker(), worker(), worker()]);
  }
  function renderNet(view) {
    if (S.dbOpen) return renderDb(view);
    const lines = netLines();
    const L = S.netLine && lines.find((l) => l.sec === S.netLine);
    if (!L) {
      view.insertAdjacentHTML("beforeend", `<div class="crumb"><h2>倉庫　<span>🗄 データベース ページの ${S.dbs.length} 品目・${lines.length} 棚</span></h2></div><div class="stack" id="netstack"></div><div class="pager-dots" id="netdots"></div>`);
      fill($("#netstack", view), "net", lines, 40, (l, i) => {
        const n = l.dbs.length;
        const stops = l.dbs.map((_, j) => `<i style="left:${n === 1 ? 50 : 4 + (j * 92) / (n - 1)}%"></i>`).join("");
        return `<button type="button" class="net-row" style="--i:${i};--lc:var(${l.c})" data-line="${esc(l.sec)}"><span class="lb">${l.code}</span><span class="nm">${esc(l.sec.replace(/^\S+\s/, ""))}</span><span class="rail">${stops}<span class="tr" style="--d:${5 + ((i * 1.7) % 5)}s;animation-delay:-${(i * 0.9) % 4}s"></span></span><span class="n">${n}</span></button>`;
      }, $("#netdots", view));
      return;
    }
    view.insertAdjacentHTML("beforeend", `<div class="crumb"><button type="button" data-line="">‹ 倉庫</button><span class="lb" style="--lc:var(${L.c})">${L.code}</span><h2>${esc(L.sec)}</h2></div><div class="strip" id="strip" style="--lc:var(${L.c})"></div><div class="pager-dots" id="stripdots"></div>`);
    fill($("#strip", view), `line:${L.sec}`, L.dbs, 40, (d, i) => `<button type="button" class="sta-row" style="--i:${i}" data-db="${d.id}"><i></i><b>${esc(d.name || "…")}</b><span class="code">${L.code}-${String(L.dbs.indexOf(d) + 1).padStart(2, "0")}</span></button>`, $("#stripdots", view));
  }

  // ================= DB：中身をアンドンで見る =================
  async function openDb(id) {
    const d = S.dbs.find((x) => x.id === id); if (!d) return;
    S.dbOpen = d; S.dbRows = []; S.dbSchema = null; S.dbErr = null; S.dbQuery = ""; S.dbLoading = true; S.page.db = 0;
    render();
    if (S.mode === "demo") { S.dbLoading = false; S.dbErr = "見本では中身を読めません（claude.ai で開くと読めます）"; render(); return; }
    try {
      const res = await call("fetch", { id: `collection://${id}` });
      const t = String(res.text || "");
      const m = t.match(/The title of this Data Source is:\s*(.+)/); if (m && !d.name) d.name = m[1].trim();
      let schema = {};
      try { schema = JSON.parse((t.match(/<data-source-state>\s*([\s\S]*?)\s*<\/data-source-state>/) || [])[1] || "{}").schema || {}; } catch { /* 列の型なしで出す */ }
      S.dbSchema = schema;
      const edited = Object.values(schema).find((p) => p.type === "last_edited_time") || Object.values(schema).find((p) => p.type === "created_time");
      let r;
      try { r = await rows(id, { sort: edited ? [{ property: edited.name, direction: "descending" }] : undefined }); }
      catch { r = await rows(id); }
      S.dbRows = r.results; S.dbMore = r.more;
    } catch (err) { S.dbErr = errText(err); }
    S.dbLoading = false;
    if (S.dbOpen === d) render();
  }
  function dbColumns() {
    const all = Object.values(S.dbSchema || {});
    const title = all.find((p) => p.type === "title")?.name || "名前";
    const extra = [];
    for (const type of ["status", "select", "date", "number", "multi_select", "checkbox", "text"]) for (const p of all) if (p.type === type && p.name !== title && !SECRET.test(p.name) && extra.length < 2) extra.push(p);
    return { title, extra };
  }
  function cell(r, p) {
    const k = p.type === "date" ? `date:${p.name}:start` : /^(url|id)$/i.test(p.name) ? `userDefined:${p.name}` : p.name;
    const v = r[k] ?? r[p.name];
    if (p.type === "checkbox") return v === "__YES__" ? "☑" : "☐";
    if (p.type === "date") return v ? md(String(v).slice(0, 10)) : "";
    const l = list(v);
    if (l) return l.every((x) => /^https?:/.test(x)) ? (l.length ? `${l.length}件` : "") : l.join("・");
    return text(v);
  }
  function renderDb(view) {
    const d = S.dbOpen; const L = netLines().find((l) => l.sec === d.sec) || { code: "?", c: "--accent" };
    view.insertAdjacentHTML("beforeend", `<div class="crumb"><button type="button" data-dbback="1">‹ ${esc(L.code)}棚</button><h2>${esc(d.name || "DB")}</h2></div>`);
    if (S.dbLoading) { view.insertAdjacentHTML("beforeend", `<div class="board"><div class="empty">在庫を読み込んでいます…</div></div>`); return; }
    if (S.dbErr) { view.insertAdjacentHTML("beforeend", `<div class="board"><div class="empty">${esc(S.dbErr)}</div></div>`); return; }
    const { title, extra } = dbColumns();
    const q = S.dbQuery.trim().toLowerCase();
    const items = S.dbRows.filter((r) => !q || Object.values(r).some((v) => typeof v === "string" && !isRef(v) && text(v).toLowerCase().includes(q)));
    view.insertAdjacentHTML("beforeend", `<div class="crumb"><input id="dbq" type="search" placeholder="この棚を探す" value="${esc(S.dbQuery)}" aria-label="絞り込み"></div>
      <div class="board"><div class="bh"><span class="sta" style="--c:var(${L.c})"><i></i>${esc(d.name || "")}</span><span class="note">${items.length}${S.dbMore ? "（最新100件）" : "件"}</span></div><div class="rows"></div><div class="dots"></div></div>`);
    const box = $(".board .rows", view);
    if (!items.length) { box.outerHTML = `<div class="empty">${q ? "当てはまる行はありません" : "行がありません"}</div>`; return; }
    fill(box, "db", items, 30, (r, i) => {
      const n = S.dbRows.indexOf(r);
      const sub = extra.map((p) => cell(r, p)).filter(Boolean);
      return `<div class="brow" role="button" tabindex="0" data-dbrow="${n}" style="--i:${i};grid-template-columns:30px 1fr 70px"><span class="kind" style="--k:#9aa6b2">${n + 1}</span><span class="dest"><span>${esc(text(r[title]) || "（無題）")}</span></span><span class="time">${esc((sub[0] || "").slice(0, 8))}</span></div>`;
    }, $(".board .dots", view));
  }

  // ================= 作業伝票（詳細）：本文・項目・書く =================
  function stationOfTask(t) { return STATIONS[laneOf(t)] || { code: "—", name: "資料室", sub: "REFERENCE", c: "--sub" }; }
  function openTask(id) {
    const t = known.get(id); if (!t) return;
    S.leaf = { kind: "task", id, url: t.url, title: t.name, view: "body", body: null, bodyErr: null, open: new Set(), pg: 0, write: "todo" };
    drawLeaf(); loadBody();
  }
  function openDbRow(i) {
    const r = S.dbRows[i]; if (!r) return;
    const { title } = dbColumns();
    S.leaf = { kind: "row", id: idOf(r.url), url: r.url, row: r, title: text(r[title]) || "（無題）", view: "body", body: null, bodyErr: null, open: new Set(), pg: 0, write: "memo" };
    drawLeaf(); loadBody();
  }
  function openProject(id) {
    const p = S.projects.find((x) => x.id === id); if (!p) return;
    S.leaf = { kind: "proj", id, url: p.url, title: p.name, view: "fields", body: null, bodyErr: null, open: new Set(), pg: 0, write: "memo" };
    drawLeaf(); loadBody();
  }
  // 目標・診断・運用ログなど、読み込んだ行をそのまま開く
  function openPage(kind, id) {
    const src = { goal: S.goals, diag: S.diag, log: S.logs }[kind] || [];
    const x = src.find((r) => r.id === id); if (!x) return;
    const fields = kind === "goal" ? [["ステータス", x.status], ["種別", x.kind], ["領域", x.area], ["期限", x.due ? md(x.due) : ""], ["なぜ", x.why], ["達成の目安", x.goalBy], ["プロジェクト", x.projects.map((pid) => S.projects.find((p) => p.id === pid)?.name).filter(Boolean).join("・")]]
      : kind === "diag" ? [["期間", x.from ? `${md(x.from)}〜${md(x.to || x.from)}` : ""], ["判定", x.verdict], ["今日やる完了率", `${Math.round(x.rate * 100)}%`], ["完了／流入", `${x.done}／${x.inflow}`], ["次の一手", x.next]]
      : [["イベント", x.event], ["日時", x.at ? `${md(jst(Date.parse(x.at)))} ${jstTime(Date.parse(x.at))}` : ""], ["内容", x.body]];
    S.leaf = { kind: "page", sub: kind, id, url: x.url, title: x.name, fields, view: "body", body: null, bodyErr: null, open: new Set(), pg: 0, write: "memo" };
    drawLeaf(); loadBody();
  }
  function closeSheet() { S.leaf = null; const sh = $("#sheet"); sh.hidden = true; sh.innerHTML = ""; delete sh.dataset.id; }

  async function loadBody() {
    const L = S.leaf;
    if (S.mode === "demo") { L.raw = DEMO_BODY; L.body = parseBody(DEMO_BODY); drawLeaf(); return; }
    try {
      const res = await call("fetch", { id: L.id }, { read: true });
      const t = String(res.text || "");
      const a = t.indexOf("<content>"), b = t.lastIndexOf("</content>");
      L.raw = a >= 0 && b > a ? t.slice(a + 9, b) : "";
      L.body = parseBody(L.raw);
    } catch (err) { L.bodyErr = errText(err); }
    if (S.leaf === L) drawLeaf();
  }

  // Notion の本文（Markdown＋タグ）をブロックに分ける
  function parseBody(src) {
    const lines = String(src || "").split("\n");
    const root = []; const stack = [root]; let tog = 0;
    const push = (b) => stack[stack.length - 1].push(b);
    for (let i = 0; i < lines.length; i++) {
      const raw = lines[i]; const t = raw.trim();
      const depth = (raw.match(/^\t*/) || [""])[0].length;
      if (!t || /^<\/?(columns|column|tabs|tab)\b[^>]*>$/.test(t) || /^<table-of-contents|^<empty-block|^<p\s*\/>$/.test(t)) continue;
      let m;
      if ((m = t.match(/^<(toggle|details)\b[^>]*>(.*)$/))) {
        let label = m[2].replace(/<\/?summary>/g, "").trim();
        while (!label && i + 1 < lines.length) { label = lines[++i].trim().replace(/<\/?summary>/g, ""); }
        const b = { k: "tog", text: label, id: `t${tog++}`, kids: [], depth };
        push(b); stack.push(b.kids); continue;
      }
      if (/^<\/(toggle|details)>$/.test(t)) { if (stack.length > 1) stack.pop(); continue; }
      if (/^<callout\b/.test(t)) {
        const parts = []; while (i + 1 < lines.length && !/^\s*<\/callout>/.test(lines[i + 1])) parts.push(lines[++i].trim()); i++;
        push({ k: "callout", text: parts.filter(Boolean).join(" "), depth }); continue;
      }
      if (/^<table\b/.test(t)) {
        let chunk = t; while (i + 1 < lines.length && !/<\/table>/.test(chunk)) chunk += "\n" + lines[++i];
        const trs = [...chunk.matchAll(/<tr[^>]*>([\s\S]*?)<\/tr>/g)].map((r) => [...r[1].matchAll(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/g)].map((c) => text(c[1])));
        push({ k: "tbl", rows: trs, depth }); continue;
      }
      if (/^\|/.test(t)) {
        const trs = []; let j = i;
        for (; j < lines.length && /^\s*\|/.test(lines[j]); j++) { const l = lines[j].trim(); if (/^\|[\s:|-]+\|$/.test(l)) continue; trs.push(l.replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => text(c))); }
        i = j - 1; push({ k: "tbl", rows: trs, depth }); continue;
      }
      if (/^```/.test(t)) {
        const fence = t.match(/^`+/)[0]; const code = [];
        while (i + 1 < lines.length && !lines[i + 1].trim().startsWith(fence)) code.push(lines[++i]); i++;
        push({ k: "code", text: code.join("\n"), depth }); continue;
      }
      if ((m = t.match(/^<h([1-4])\b[^>]*>(.*?)(?:<\/h\1>)?$/))) {
        let label = m[2]; while (!label.trim() && i + 1 < lines.length) label = lines[++i].trim();
        if (i + 1 < lines.length && /^<\/h[1-4]>$/.test(lines[i + 1].trim())) i++;
        push({ k: m[1] <= 2 ? "h" : "h3", text: label.replace(/<\/h[1-4]>$/, ""), depth }); continue;
      }
      if (/^<(embed|image|video|file|pdf|audio|bookmark)\b/.test(t) || /^!\[/.test(t)) { push({ k: "media", text: "［画像・埋め込み］", depth }); continue; }
      if ((m = t.match(/^<(page|database)\b[^>]*>(.*?)<\/\1>$/))) { push({ k: "muted", text: `📄 ${text(m[2]) || "ページ"}`, depth }); continue; }
      if (/^<\/?[a-z-]+[^>]*>$/.test(t)) continue;
      if ((m = t.match(/^(#{1,4})\s+(.*)$/))) { push({ k: m[1].length <= 2 ? "h" : "h3", text: m[2], raw: t, depth }); continue; }
      if ((m = t.match(/^- \[( |x|X)\]\s?(.*)$/))) { push({ k: "todo", done: m[1] !== " ", text: m[2], raw: t, depth }); continue; }
      if ((m = t.match(/^[-*]\s+(.*)$/))) { push({ k: "li", text: m[1], depth }); continue; }
      if ((m = t.match(/^(\d+)\.\s+(.*)$/))) { push({ k: "li", text: `${m[1]}. ${m[2]}`, depth }); continue; }
      if ((m = t.match(/^>\s?(.*)$/))) { push({ k: "quote", text: m[1], depth }); continue; }
      if (/^-{3,}$/.test(t)) { push({ k: "muted", text: "――――", depth }); continue; }
      push({ k: "p", text: t, depth });
    }
    return root;
  }
  function flatten(blocks, open, depth = 0, out = []) {
    for (const b of blocks) {
      out.push({ ...b, d: depth + (b.depth || 0) });
      if (b.k === "tog" && open.has(b.id)) flatten(b.kids, open, depth + 1, out);
    }
    return out;
  }
  function blockHtml(b, i) {
    const pad = b.d ? ` style="padding-left:${Math.min(b.d, 4) * 12}px"` : "";
    switch (b.k) {
      case "h": case "h3": return `<p class="nb ${b.k === "h" ? "h" : "h h3"}"${pad}>${inline(b.text)}</p>`;
      case "todo": return `<button type="button" class="nb todo${b.done ? " done" : ""}" data-check="${i}"${pad}><span class="box">✓</span><span>${inline(b.text)}</span></button>`;
      case "li": return `<p class="nb li"${pad}>${inline(b.text)}</p>`;
      case "quote": return `<p class="nb quote"${pad}>${inline(b.text)}</p>`;
      case "callout": return `<p class="nb callout"${pad}>${inline(b.text)}</p>`;
      case "tog": return `<button type="button" class="nb tog" data-tog="${b.id}"${pad}>${S.leaf.open.has(b.id) ? "▾" : "▸"} ${inline(b.text)}<span style="color:var(--sub);font-size:10px;font-weight:500">（${b.kids.length}）</span></button>`;
      case "tbl": return `<div class="nb tbl"${pad}>${b.rows.slice(0, 12).map((r) => `<span>${esc(r.join("　／　"))}</span>`).join("")}${b.rows.length > 12 ? `<span style="color:var(--sub)">…ほか${b.rows.length - 12}行</span>` : ""}</div>`;
      case "code": return `<pre class="nb code"${pad}>${esc(b.text.slice(0, 600))}</pre>`;
      case "media": case "muted": return `<p class="nb muted"${pad}>${esc(b.text)}</p>`;
      default: return `<p class="nb"${pad}>${inline(b.text)}</p>`;
    }
  }

  function fieldsHtml() {
    const L = S.leaf;
    if (L.kind === "task") {
      const t = known.get(L.id); const s = stationOfTask(t);
      const p = S.projects.find((x) => t.projects.includes(x.id));
      return `<dl class="fields"><dt>工程</dt><dd>${esc(s.name)}（${esc(s.sub)}・${s.code}）　<span style="color:var(--sub)">${esc(t.status)}${t.ai ? ` ${esc(t.ai)}` : ""}</span></dd>
        <dt>次の作業</dt><dd class="big">${esc(t.next || "—")}</dd><dt>日付</dt><dd>${t.date ? `${md(t.date)}(${WD[dow(t.date)]})` : "—"}　ライン ${esc(t.waku || "—")}　品種 ${esc((KIND[t.weight] || ["—"])[0])}（${esc(t.weight || "—")}）　${esc(t.tag || "")}</dd>
        ${p ? `<dt>ロット</dt><dd>${esc(p.name)}</dd>` : ""}${t.link ? `<dt>URL</dt><dd><a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.link.slice(0, 60))}</a></dd>` : ""}</dl>`;
    }
    if (L.kind === "proj") {
      const p = S.projects.find((x) => x.id === L.id); const s = projStats(p);
      const order = [ST.doing, ST.next, ST.wait, ST.ai, ST.some, ST.inbox];
      const kids = s.open.sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status));
      return `<dl class="fields"><dt>ステータス</dt><dd>${esc(p.status)}</dd><dt>進み</dt><dd>${s.done} / ${p.total}（${s.pct}%）</dd><dt>今の状態</dt><dd>${esc(p.now || "—")}</dd><dt>次の一歩</dt><dd class="big">${esc(p.step || "—")}</dd></dl>
        <div class="kidlist">${kids.length ? kids.slice(0, 14).map((t) => `<button type="button" class="kid" data-open="${t.id}" style="--kc:var(${stationOfTask(t).c})"><i></i><span>${esc(t.name)}<span style="color:var(--sub);font-weight:500;font-size:10px">　${esc(stationOfTask(t).name)}</span></span></button>`).join("") : `<div class="empty">残っている子タスクはありません</div>`}</div>`;
    }
    if (L.kind === "page") return `<dl class="fields">${L.fields.filter(([, v]) => v).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
    const r = L.row; const schema = S.dbSchema || {}; const { title } = dbColumns();
    const props = Object.values(schema).filter((p) => p.name !== title && !["button", "formula", "rollup"].includes(p.type));
    const shown = props.map((p) => { const v = cell(r, p); return v ? `<dt>${esc(p.name)}</dt><dd>${SECRET.test(p.name) ? `<span class="secret">••••（伏せています）</span>` : esc(v)}</dd>` : ""; }).join("");
    const formulas = Object.values(schema).filter((p) => p.type === "formula" || p.type === "rollup").length;
    return `<dl class="fields">${shown || "<dt>—</dt><dd>入っている項目はありません</dd>"}</dl>${formulas ? `<div style="font-size:10px;color:var(--sub)">計算式・ロールアップ ${formulas}列は Notion 連携から読めないので出していません</div>` : ""}`;
  }
  // 移動先のボタン（今の工程に合わせて並べる）
  function xferHtml() {
    const L = S.leaf; if (L.kind !== "task") return "";
    const t = known.get(L.id); const lane = laneOf(t);
    const keys = lane === "today" ? ["done", "tomorrow", "weekend", "nodate", "wait", "someday", "ref", "research"]
      : lane === "plan" ? ["today", "done", "nodate", "tomorrow", "wait", "someday", "ref"]
      : lane === "next" ? ["today", "tomorrow", "weekend", "done", "wait", "someday", "ref", "research"]
      : lane === "inbox" ? ["adopt", "today", "tomorrow", "research", "someday", "ref", "done"]
      : lane === "wait" ? ["adopt", "today", "done", "someday", "ref"]
      : ["adopt", "today", "someday", "ref", "research", "done"];
    return `<div class="xfer">${keys.map((k, i) => { const to = ACTIONS[k].to; const c = to ? STATIONS[to].c : "--sub"; return `<button type="button" data-act="${k}" data-id="${t.id}" class="${i === 0 ? "pri" : ""}" style="--xc:var(${c})"><i></i>${ACTIONS[k].label}</button>`; }).join("")}</div>`;
  }
  function drawLeaf(slide = 0) {
    const L = S.leaf; if (!L) return;
    const sh = $("#sheet");
    const t = L.kind === "task" ? known.get(L.id) : null;
    const s = t ? stationOfTask(t) : null;
    const tc = s ? s.c : L.kind === "proj" || L.sub === "goal" ? "--l-proj" : L.sub === "diag" || L.sub === "log" ? "--l-today" : "--l-plan";
    const kicker = t ? `<span class="code">${s.code}</span>作業伝票　工程：${esc(s.name)}（${esc(s.sub)}）` : L.kind === "proj" ? `<span class="code">PJ</span>製造ロット（プロジェクト）` : L.sub === "goal" ? `<span class="code">受</span>受注（目標）` : L.sub === "diag" ? `<span class="code">診</span>生産管理（診断）` : L.sub === "log" ? `<span class="code">LOG</span>作業日報` : `<span class="code">DB</span>${esc(S.dbOpen?.name || "")}`;
    const views = L.kind === "proj" ? [["fields", "子タスク"], ["body", "本文"], ["write", "書く"]] : [["body", "本文"], ["fields", "項目"], ["write", "書く"]];
    const fresh = sh.dataset.id !== L.id;
    sh.dataset.id = L.id;
    sh.innerHTML = `<div class="ticket" style="--tc:var(${tc});${fresh ? "" : "animation:none"}" role="dialog" aria-modal="true" aria-label="${esc(L.title)}">
      <div class="band"><div class="k">${kicker}</div><h3>${esc(L.title)}</h3>${t?.next ? `<div class="nx">${esc(t.next)}</div>` : ""}<button type="button" class="x" data-close="1" aria-label="閉じる">×</button></div>
      <div class="perf"></div>
      <div class="tbody">${xferHtml()}
        <div class="tabs">${views.map(([k, n]) => `<button type="button" data-view="${k}" aria-pressed="${L.view === k}">${n}</button>`).join("")}<a href="${esc(L.url)}" target="_blank" rel="noopener">Notion で開く ↗</a></div>
        <div class="leafbody"></div><div class="tfoot"></div></div></div>`;
    sh.hidden = false;
    if (!fresh) sh.style.animation = "none";
    else sh.style.animation = "";
    L.pages = 0;
    const box = $(".leafbody", sh);
    if (L.view === "fields") { box.innerHTML = fieldsHtml(); return; }
    if (L.view === "write") { box.innerHTML = writeHtml(); return; }
    if (L.bodyErr) { box.innerHTML = `<div class="empty">${esc(L.bodyErr)}</div>`; return; }
    if (!L.body) { box.innerHTML = `<div class="empty">本文を読み込んでいます…</div>`; return; }
    const flat = flatten(L.body, L.open);
    L.flat = flat;
    if (!flat.length) { box.innerHTML = `<div class="empty">本文はまだ白紙です。「書く」から書き足せます</div>`; return; }
    box.innerHTML = `<div class="notebody" data-swipe="leaf"><div class="pg">${flat.map(blockHtml).join("")}</div></div>`;
    // 本文を1頁ずつに割り付ける（入りきらない分は次の頁へ）
    const nb = $(".notebody", box); const pg = $(".pg", nb);
    const els = [...pg.children];
    const pages = [[]]; let top = 0; const h = nb.clientHeight;
    for (const el of els) {
      const y = el.offsetTop, hh = el.offsetHeight;
      if (pages.at(-1).length && y + hh - top > h) { pages.push([]); top = y; }
      pages.at(-1).push(el);
    }
    L.pages = pages.length;
    L.pg = Math.max(0, Math.min(L.pg, pages.length - 1));
    for (const el of els) el.hidden = !pages[L.pg].includes(el);
    nb.dataset.pages = pages.length;
    if (slide) pg.classList.add(slide > 0 ? "in-l" : "in-r");
    $(".tfoot", sh).innerHTML = pages.length > 1 ? `<button type="button" data-leafpg="-1" ${L.pg === 0 ? "disabled" : ""} aria-label="前の頁">‹</button><span>${L.pg + 1} / ${pages.length}　スワイプでめくる</span><button type="button" data-leafpg="1" ${L.pg >= pages.length - 1 ? "disabled" : ""} aria-label="次の頁">›</button>` : "";
  }

  function writeHtml() {
    const L = S.leaf;
    const modes = L.kind === "task" ? [["todo", "やることに足す"], ["memo", "メモを書く"], ["next", "次の作業（NEXT）を書き換える"]] : [["memo", "メモを書く"], ["todo", "チェック項目を足す"]];
    if (!modes.some(([k]) => k === L.write)) L.write = modes[0][0];
    const t = L.kind === "task" ? known.get(L.id) : null;
    const note = { todo: "1行＝1項目。本文の「やること／ToDo」の最後に足します（なければ本文の最後に見出しごと作ります）", memo: "本文のいちばん最後に書き足します", next: "NEXT（次の一手）を書き換えます。自分で書いたNEXTはAIが上書きしません" }[L.write];
    const field = L.write === "next"

  // ================= 書き込み：本文 =================
  async function toggleCheck(i) {
    const L = S.leaf; const b = L.flat?.[i]; if (!b || b.k !== "todo") return;
    const same = L.flat.filter((x) => x.raw === b.raw).length;
    const next = b.done ? b.raw.replace(/^- \[[xX]\]/, "- [ ]") : b.raw.replace(/^- \[ \]/, "- [x]");
    const orig = findBlock(L.body, b);
    if (!orig) return;
    if (same > 1) { toast("同じ文のチェック項目が2つあるので、Notion で直接チェックしてください"); return; }
    orig.done = !orig.done; orig.raw = next; drawLeaf();
    if (S.mode === "demo") { toast("見本なので Notion は変わりません"); return; }
    try {
      await call("update", { page_id: L.id, command: "update_content", content_updates: [{ old_str: b.raw, new_str: next }], allow_async: false }, { read: false });
      L.raw = (L.raw || "").replace(b.raw, next);
      toast(orig.done ? "チェックしました" : "チェックを外しました");
      if (L.kind === "task") { syncNext(L); render(); if (S.leaf === L) drawLeaf(); }
    } catch (err) { orig.done = !orig.done; orig.raw = b.raw; if (S.leaf === L) drawLeaf(); toast(errText(err)); }
  }
  function findBlock(blocks, b) {
    for (const x of blocks) {
      if (x.k === "todo" && x.raw === b.raw && x.text === b.text) return x;
      if (x.kids) { const f = findBlock(x.kids, b); if (f) return f; }
    }

  }
  // AIのNEXT同期と同じ考え方：NEXT が ToDo 由来なら、最初の未チェック項目を手元の表示に写す（Notion側は定時処理が直す）
  function syncNext(L) {
    const t = known.get(L.id); if (!t) return;
    const todos = []; const walk = (bs) => bs.forEach((x) => { if (x.k === "todo") todos.push(x); if (x.kids) walk(x.kids); }); walk(L.body);
    if (!todos.some((x) => text(x.text) === t.next)) return;
    t.next = text((todos.find((x) => !x.done) || {}).text || "");
  }
  async function save() {
    const L = S.leaf; if (!L) return;
    if (L.write === "next") {
      const v = $("#w-next").value.trim();
      const t = known.get(L.id); const before = t.next;
      t.next = v; L.view = "fields"; drawLeaf(); render();
      if (S.mode === "demo") { toast("見本なので Notion は変わりません"); return; }
      try { await call("update", { page_id: L.id, command: "update_properties", properties: { NEXT: v }, allow_async: false }, { read: false }); toast("次の作業を書き換えました"); saveSnap(); }
      catch (err) { t.next = before; render(); if (S.leaf === L) drawLeaf(); toast(errText(err)); }
      return;
    }
    const v = $("#w-text").value.replace(/\r/g, "").trim();
    if (!v) { toast("何も書かれていません"); return; }
    const lines = v.split("\n").map((s) => s.trim()).filter(Boolean);
    let op;
    if (L.write === "todo") {
      const items = lines.map((s) => `- [ ] ${s.replace(/^- \[[ xX]\]\s*|^[-・]\s*/, "")}`).join("\n");
      const anchor = lastTodoOfSection(L.raw || "");
      op = anchor
        ? { command: "update_content", content_updates: [{ old_str: anchor, new_str: `${anchor}\n${items}` }] }
        : { command: "insert_content", position: { type: "end" }, content: L.kind === "task" && !/^#{1,3}\s*(?:☑️\s*)?(?:ToDo|やること)/m.test(L.raw || "") ? `## やること\n${items}` : items };
    } else {
      op = { command: "insert_content", position: { type: "end" }, content: v.split("\n").map((s) => s.trimEnd()).join("\n\n").replace(/\n{3,}/g, "\n\n") };
    }
    if (S.mode === "demo") { L.raw = op.content_updates ? L.raw.replace(op.content_updates[0].old_str, op.content_updates[0].new_str) : `${L.raw}\n${op.content}`; L.body = parseBody(L.raw); L.view = "body"; drawLeaf(); toast("見本なので Notion は変わりません"); return; }
    const btn = $("[data-save]"); if (btn) { btn.disabled = true; btn.textContent = "書き込み中…"; }
    try {
      await call("update", { page_id: L.id, ...op, allow_async: false }, { read: false });
      toast(L.write === "todo" ? "やることに足しました" : "本文に書き足しました");
      L.view = "body"; L.body = null; L.pg = 9999; drawLeaf(); await loadBody();
    } catch (err) {

  // 「## やること／ToDo」の見出しの下で、いちばん最後のチェック項目の行（その下に足す）
  function lastTodoOfSection(raw) {
    const lines = raw.split("\n"); let inSec = false, last = null, level = 0;
    for (const l of lines) {
      const t = l.trim(); const h = t.match(/^(#{1,4})\s/);
      if (TODO_HEAD.test(t)) { inSec = true; level = h ? h[1].length : 2; last = null; continue; }
      if (inSec && h && h[1].length <= level) break;
      if (inSec && /^- \[[ xX]\]/.test(t) && !/^\t/.test(l)) last = t;
    }
    if (!last) return null;
    return raw.split(last).length === 2 ? last : null; // 同じ行が2つあると場所を決められない
  }

  // ================= スワイプ =================
  // アンドン・一覧・本文を指で左右に動かし、離したら次（前）の頁へ
  const swipe = (() => {
    let g = null, suppress = false;
    const cur = (k) => (k === "leaf" ? S.leaf?.pg || 0 : S.page[k] || 0);
    const target = (G) => (G.key === "leaf" ? G.el.firstElementChild : G.el);
    function down(e) {
      const el = e.target.closest("[data-swipe]");
      if (!el || e.button > 0 || e.target.closest("input, textarea")) return;
      g = { el, key: el.dataset.swipe, pages: +el.dataset.pages || 1, x: e.clientX, y: e.clientY, t: performance.now(), on: false, id: e.pointerId };
    }
    function move(e) {
      if (!g || e.pointerId !== g.id) return;
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (!g.on) { if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { g = null; return; } if (Math.abs(dx) < 10) return; g.on = true; }
      const p = cur(g.key); const can = dx < 0 ? p < g.pages - 1 : p > 0;
      const el = target(g); if (!el) return;
      el.style.transition = "none";
      el.style.transform = `translateX(${dx * (can ? 0.6 : 0.15)}px)`;
      el.style.opacity = String(1 - Math.min(0.5, Math.abs(dx) / 500));
    }
    function up(e) {
      if (!g || e.pointerId !== g.id) return;
      const G = g; g = null;
      if (!G.on) return;
      suppress = true; setTimeout(() => { suppress = false; }, 300);
      const dx = e.clientX - G.x; const p = cur(G.key); const dir = dx < 0 ? 1 : -1;
      const fast = Math.abs(dx) / Math.max(1, performance.now() - G.t) > 0.4;
      if ((Math.abs(dx) > 50 || (fast && Math.abs(dx) > 20)) && p + dir >= 0 && p + dir < G.pages) return go(G.key, dir);
      const el = target(G); if (!el) return;
      el.style.transition = "transform .25s, opacity .25s"; el.style.transform = ""; el.style.opacity = "";
    }
    function go(key, dir) {
      if (key === "leaf") { S.leaf.pg += dir; drawLeaf(dir); return; }
      S.page[key] = (S.page[key] || 0) + dir; S.slide = { key, dir }; render();
    }
    return { down, move, up, go, get suppress() { return suppress; } };
  })();

    ];
    S.loadedAt = Date.now(); render();
  }

  initDbs();
  const snap = store.get("snap");
  if (snap?.tasks?.length) {
    Object.assign(S, { tasks: snap.tasks, projects: snap.projects || [], doneToday: Array.isArray(snap.doneToday) ? snap.doneToday : [], inboxMore: !!snap.inboxMore, diag: snap.diag || [], logs: snap.logs || [], goals: snap.goals || [], loadedAt: snap.at });
    for (const t of S.tasks) known.set(t.id, t);
    if (jst(snap.at) !== TODAY()) S.doneToday = [];
  }
  try { const h = location.hash.slice(1); if (["map", "ops", "goal", "net"].includes(h)) S.tab = h; } catch { /* なし */ }

  load();
  window.__imadoko = { parseBody, laneOf, lastTodoOfSection }; // 確認用
