<title>今どこダイアリー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
/* 恋愛ADV風。パステルの背景、白い角丸のカード、会話ウィンドウ。ヒロイン・背景はSVGで描く（キャラの色は昼夜とも同じ） */
:root {
  --bg1: #fff0f6;
  --bg2: #eef0ff;
  --card: #ffffff;
  --card2: #fff6fa;
  --ink: #4b3a50;
  --dim: #9b8aa3;
  --pink: #ff6f9f;
  --pink2: #ffc2d6;
  --line: #f4d6e4;
  --hi: #ff4f8b;
  --warn: #ff6a4a;
  --good: #31b884;
  --blue: #5d9cf0;
  --dlg: rgba(255, 255, 255, .93);
  --shadow: 0 4px 16px rgba(255, 111, 159, .16);
  --bgfilter: none;
  --f: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #251a30; --bg2: #191a33; --card: #2f2542; --card2: #372b4c; --ink: #f7ebf4; --dim: #b8a6c2; --pink: #ff82ad; --pink2: #6d3a5a; --line: #4a3a5e; --hi: #ff8fb7; --warn: #ff8a6a; --good: #5ad6a2; --blue: #8ab8ff;
    --dlg: rgba(47, 37, 66, .93); --shadow: 0 4px 16px rgba(0, 0, 0, .35); --bgfilter: brightness(.62) saturate(.9); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg1: #251a30; --bg2: #191a33; --card: #2f2542; --card2: #372b4c; --ink: #f7ebf4; --dim: #b8a6c2; --pink: #ff82ad; --pink2: #6d3a5a; --line: #4a3a5e; --hi: #ff8fb7; --warn: #ff8a6a; --good: #5ad6a2; --blue: #8ab8ff;
  --dlg: rgba(47, 37, 66, .93); --shadow: 0 4px 16px rgba(0, 0, 0, .35); --bgfilter: brightness(.62) saturate(.9); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: linear-gradient(160deg, var(--bg1), var(--bg2)); color: var(--ink); font-family: var(--f); font-size: 13.5px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
input, textarea { font: inherit; color: var(--ink); }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
.dim { color: var(--dim); }
.hi { color: var(--hi); }
.danger { color: var(--warn); }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; gap: 8px; max-width: 640px; margin: 0 auto; padding: 8px max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px)); }
@media (min-width: 420px) { #app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

/* 上：タイトルと今日の好感度 */
.top { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.logo { font-weight: 800; color: var(--hi); letter-spacing: .02em; white-space: nowrap; }
.logo i { font-style: normal; display: inline-block; animation: beat 1.4s ease-in-out infinite; }
@keyframes beat { 0%, 60%, 100% { transform: scale(1); } 30% { transform: scale(1.25); } }
#lv { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.loading .clock::after { content: " …"; }

main { min-height: 0; min-width: 0; display: flex; flex-direction: column; position: relative; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 9px; }
.view.fade { animation: fadein .3s ease-out; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
.panel { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 8px 12px; position: relative; }
.more { position: absolute; right: 12px; bottom: 4px; font-size: 10.5px; color: var(--pink); }

/* ヒロインの絵 */
.girl { display: block; overflow: visible; }
.girl .eyes { transform-origin: 100px 114px; animation: blinkeye 5s infinite; }
@keyframes blinkeye { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
.girl .tail { animation: tail 3.2s ease-in-out infinite; }
.girl .tail.r { animation-delay: -1.6s; }
.girl .tail.l { transform-origin: 62px 80px; } .girl .tail.r { transform-origin: 138px 80px; }
@keyframes tail { 50% { transform: rotate(3deg); } }
.girl .fx { animation: fx 1.6s ease-in-out infinite; }
@keyframes fx { 50% { transform: translateY(-3px); } }

/* みんな（ホーム） */
.notice { display: flex; gap: 10px; align-items: center; min-height: 74px; }
.ava { flex: none; width: 54px; height: 54px; border-radius: 50%; overflow: hidden; background: var(--card2); border: 2px solid var(--c, var(--pink)); }
.ava svg { width: 100%; height: 100%; }
.notice b { font-size: 12px; color: var(--c, var(--pink)); }
.notice p { margin: 0; white-space: pre-wrap; font-size: 12.5px; }
.grid6 { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 8px; }
.gcard { position: relative; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; padding: 0 4px 8px; animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(var(--i) * 60ms); }
@keyframes pop { from { opacity: 0; transform: scale(.85); } }
.gcard::before { content: ""; position: absolute; inset: 0 0 46% 0; background: linear-gradient(var(--c), transparent); opacity: .22; }
.gcard .face { position: relative; flex: 1; min-height: 0; width: 100%; display: grid; place-items: end center; }
.gcard .face svg { height: 100%; max-width: 100%; }
.gcard .face::after { content: ""; position: absolute; left: -4px; right: -4px; bottom: 0; height: 34%; background: linear-gradient(transparent, var(--card) 80%); }
.gcard b { position: relative; font-size: 14px; font-weight: 800; color: var(--c); line-height: 1.2; }
.gcard small { position: relative; font-size: 10.5px; color: var(--dim); }
.gcard .cnt { position: absolute; top: 6px; right: 7px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--c); color: #fff; font-weight: 800; font-size: 13px; display: grid; place-items: center; }
.gcard .love { position: absolute; top: 8px; left: 8px; font-size: 10px; color: var(--hi); font-weight: 700; }
.gcard .badge { position: absolute; top: 34px; right: 6px; font-size: 10px; background: var(--warn); color: #fff; border-radius: 8px; padding: 0 5px; }
.gcard:active { transform: scale(.97); }

/* デート（会話シーン） */
.scene { position: relative; flex: 0 0 54%; min-height: 230px; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); border: 1.5px solid var(--line); animation: scenein .4s ease-out; }
@keyframes scenein { from { opacity: 0; transform: scale(1.03); } }
.scene .bg { position: absolute; inset: 0; width: 100%; height: 100%; filter: var(--bgfilter); }
.girlwrap { position: absolute; left: 50%; bottom: 0; height: 100%; transform: translateX(-50%); animation: comein .5s ease-out; }
@keyframes comein { from { opacity: 0; transform: translate(-46%, 8px); } }
.girlwrap svg { height: 100%; width: auto; animation: breathe 4s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes breathe { 50% { transform: translateY(2px) scaleY(.995); } }
.girlwrap.hop svg { animation: hop .5s ease-out 2; }
@keyframes hop { 40% { transform: translateY(-14px); } }
.dlg { position: absolute; left: 8px; right: 8px; bottom: 8px; min-height: 82px; background: var(--dlg); border: 2px solid var(--c); border-radius: 14px; padding: 14px 12px 8px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.dlg p { margin: 0; white-space: pre-wrap; font-size: 13px; line-height: 1.55; }
.dlg p::after { content: "▼"; font-size: 9px; color: var(--c); margin-left: 4px; animation: nudge .9s ease-in-out infinite; display: inline-block; }
@keyframes nudge { 50% { transform: translateY(2px); } }
.plate { position: absolute; top: -13px; left: 12px; background: var(--c); color: #fff; font-weight: 800; padding: 1px 12px; border-radius: 12px; font-size: 13px; box-shadow: 0 2px 6px rgba(0, 0, 0, .15); }
.plate small { font-weight: 400; font-size: 10px; margin-left: 6px; opacity: .9; }
.back { position: absolute; top: -12px; right: 10px; background: var(--card); color: var(--ink); border: 1.5px solid var(--c); border-radius: 12px; padding: 0 9px; font-size: 11px; }
.hearts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.hearts span { position: absolute; bottom: 30%; color: var(--hi); font-size: var(--s, 18px); animation: rise 1.4s ease-out forwards; text-shadow: 0 0 6px #fff; }
@keyframes rise { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--dx, 0), -170px) scale(1.1); opacity: 0; } }
.hearts .gain { left: 50%; top: 22%; bottom: auto; font-weight: 800; font-size: 22px; transform: translateX(-50%); animation: gain 1.3s ease-out forwards; }
@keyframes gain { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 25% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -30px); } }
.petals i { position: absolute; top: -10px; width: 7px; height: 5px; border-radius: 60% 0; background: #ffc6da; animation: fall linear infinite; opacity: .9; }
@keyframes fall { to { transform: translate(-40px, 330px) rotate(300deg); } }
.choices { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px 10px; }
.list { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.opt { display: flex; align-items: center; gap: 8px; width: 100%; height: 38px; flex: none; padding: 0 12px; border-radius: 19px; background: var(--card2); border: 1.5px solid var(--line); white-space: nowrap; animation: optin .3s ease-out both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes optin { from { opacity: 0; transform: translateX(10px); } }
.opt:hover, .opt:focus-visible { border-color: var(--c, var(--pink)); }
.opt .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.opt .r { font-size: 11px; color: var(--dim); }
.opt .r.danger { color: var(--warn); font-weight: 700; }
.opt .r.hi { color: var(--hi); font-weight: 700; }
.opt::before { content: "♡"; color: var(--c, var(--pink)); font-size: 12px; }
.opt.main { background: var(--c, var(--pink)); color: #fff; border-color: transparent; font-weight: 700; }
.opt.main::before { content: "♥"; color: #fff; }
.opt.ghost { background: none; color: var(--dim); }
.opt.ghost::before { content: ""; }
.acts { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; overflow: hidden; }
.acts .opt { height: 36px; font-size: 12.5px; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; display: block; line-height: 33px; }
.acts .opt::before { margin-right: 4px; }
.in-l { animation: slidel .25s ease-out; } .in-r { animation: slider .25s ease-out; }
@keyframes slidel { from { transform: translateX(24%); opacity: 0; } }
@keyframes slider { from { transform: translateX(-24%); opacity: 0; } }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--dim); padding: 10px; white-space: pre-wrap; }

/* 思い出（診断・目標・運用ログ） */
.row2 { display: flex; gap: 9px; }
.row2 > * { min-width: 0; }
.heartcard { flex: 0 0 44%; display: flex; align-items: center; gap: 8px; }
.heartcard svg { width: 52px; flex: none; }
.heartcard b { display: block; font-size: 24px; font-weight: 800; color: var(--hi); line-height: 1.1; }
.heartcard small { white-space: nowrap; font-size: 10px; color: var(--dim); }
.stat { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; font-size: 12px; margin: 0; }
.stat dt { color: var(--dim); }
.stat dd { margin: 0; text-align: right; font-weight: 700; }
.letter { display: flex; gap: 10px; align-items: center; width: 100%; background: linear-gradient(135deg, var(--card), var(--card2)); }
.letter .seal { font-size: 26px; animation: fx 2s ease-in-out infinite; }
.letter b { font-size: 12px; color: var(--hi); }
.letter p { margin: 0; font-size: 12px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.seg { display: flex; gap: 4px; background: var(--card2); border-radius: 16px; padding: 3px; border: 1.5px solid var(--line); }
.seg button { flex: 1; text-align: center; border-radius: 13px; padding: 4px 0; font-size: 11.5px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--pink); color: #fff; font-weight: 700; }
.memo { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.chart { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.chart svg { flex: 1; min-height: 0; width: 100%; }
.chart text { font-family: var(--f); font-size: 9px; fill: var(--dim); }
.chart text.pct { fill: var(--hi); font-weight: 700; }
.legend { font-size: 10.5px; color: var(--dim); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin: 0 3px 0 8px; vertical-align: -1px; }
.row { display: flex; align-items: center; gap: 8px; height: 34px; flex: none; width: 100%; border-bottom: 1px dashed var(--line); animation: optin .3s ease-out both; animation-delay: calc(var(--i, 0) * 40ms); }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { font-size: 11px; color: var(--dim); white-space: nowrap; }
.row .r.hi { color: var(--hi); font-weight: 700; }
.row.sub { padding-left: 14px; height: 30px; font-size: 12.5px; }
.row.head { color: var(--dim); font-size: 11px; height: 26px; border: 0; }

/* スマホ（すべてのDB） */
.phone { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; background: var(--card); border: 1.5px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); padding: 8px 12px 10px; }
.pbar { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim); padding: 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 11px; padding: 2px 9px; border-radius: 12px; background: var(--card2); border: 1.5px solid var(--line); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 700; }
.apps { flex: 1; min-height: 0; display: grid; align-content: start; gap: 10px 4px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.app { display: flex; flex-direction: column; align-items: center; gap: 3px; height: 78px; animation: pop .4s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(var(--i) * 30ms); }
.app .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 19px; color: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .15); }
.app .an { font-size: 10px; width: 72px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dots { display: flex; justify-content: center; gap: 5px; min-height: 8px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--pink); }
.apphead { display: flex; align-items: center; gap: 8px; }
.apphead b { font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.apphead button { font-size: 20px; color: var(--pink); width: 28px; }
.search { width: 100%; background: var(--card2); border: 1.5px solid var(--line); border-radius: 14px; padding: 5px 12px; font-size: 13px; }
.status { font-size: 12px; color: var(--dim); }

/* 下のメニュー */
nav { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 5px 4px; margin-bottom: env(safe-area-inset-bottom, 0px); }
nav button { display: flex; flex-direction: column; align-items: center; gap: 0; font-size: 10.5px; padding: 3px 0; border-radius: 14px; white-space: nowrap; color: var(--dim); }
nav button .e { font-size: 18px; line-height: 1.2; filter: grayscale(.5); }
nav button[aria-pressed="true"] { color: var(--hi); font-weight: 700; background: var(--card2); }
nav button[aria-pressed="true"] .e { filter: none; animation: beat 1.6s ease-in-out infinite; }

/* 中身（詳細） */
#sheet { position: fixed; inset: 0; z-index: 30; background: rgba(60, 30, 60, .38); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: calc(10px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.leaf { width: 100%; max-width: 600px; height: 100%; max-height: 780px; display: flex; flex-direction: column; gap: 8px; animation: sheetin .3s cubic-bezier(.2, 1.2, .4, 1); }
@keyframes sheetin { from { transform: translateY(20px) scale(.97); opacity: 0; } }
.leaf .head { display: flex; gap: 10px; align-items: center; padding-right: 36px; }
.leaf h3 { margin: 0; font-size: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.leaf .where { font-size: 11px; color: var(--dim); }
.leaf .x { position: absolute; right: 10px; top: 8px; width: 28px; height: 28px; border-radius: 50%; background: var(--card2); text-align: center; font-size: 15px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tabs button { font-size: 12px; padding: 3px 11px; border-radius: 13px; background: var(--card2); border: 1.5px solid var(--line); }
.tabs button[aria-pressed="true"], .tabs button.on { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 700; }
.tabs a { margin-left: auto; font-size: 11px; color: var(--blue); }
.sheetacts { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.sheetacts .opt { height: 32px; font-size: 12px; padding: 0 10px; display: block; line-height: 29px; overflow: hidden; text-overflow: ellipsis; }
.leafbody { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.fields { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; margin: 0; }
.fields dt { color: var(--dim); white-space: nowrap; }
.fields dd { margin: 0; overflow-wrap: anywhere; }
.fields a, .notebody a { color: var(--blue); }
.notebody { flex: 1; min-height: 0; overflow: hidden; font-size: 13px; line-height: 1.7; text-align: left; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.nb { display: block; margin: 0 0 3px; overflow-wrap: anywhere; text-align: left; }
.nb.h { color: var(--hi); font-weight: 800; margin-top: 6px; }
.nb.h::before { content: "♡ "; }
.nb.h3 { color: var(--hi); font-weight: 700; }
.nb.todo { display: grid; grid-template-columns: 1.7em 1fr; width: 100%; }
.nb.todo .box { font-size: 0; }
.nb.todo .box::before { content: "♡"; font-size: 14px; color: var(--pink); }
.nb.todo.done .box::before { content: "♥"; }
.nb.todo.done span:last-child { color: var(--dim); text-decoration: line-through; }
.nb.li { padding-left: 1em; text-indent: -1em; }
.nb.li::before { content: "・"; }
.nb.quote { color: var(--dim); padding-left: 8px; border-left: 3px solid var(--pink2); }
.nb.callout { background: var(--card2); border-radius: 10px; padding: 4px 8px; }
.nb.tog { width: 100%; color: var(--blue); }
.nb.tbl { font-size: 11.5px; line-height: 1.55; border-left: 3px solid var(--pink2); padding-left: 7px; }
.nb.tbl span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nb.code { font-size: 11px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
.nb.media, .nb.muted { color: var(--dim); font-size: 11px; }
.write { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.write textarea, .write input { background: var(--card2); border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 10px; font-size: 13.5px; }
.write textarea { flex: 1; min-height: 80px; resize: none; }
.write label, .write .note { font-size: 11px; color: var(--dim); }
.tfoot { display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 11.5px; color: var(--dim); min-height: 20px; }
.tfoot button { color: var(--pink); font-size: 14px; }
.tfoot button:disabled { opacity: .3; }
.secret { color: var(--dim); }

#say { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100% - 24px)); z-index: 60; background: var(--dlg); border: 2px solid var(--pink); border-radius: 14px; padding: 9px 12px; box-shadow: var(--shadow); animation: fadein .25s ease-out; }
#say p { white-space: pre-wrap; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  // ================= みんな（ホーム） =================
  // ヒロインごとの今の様子（件数・遅れ・古さ・自分の番）
  function situation(k) {
    const items = sceneItems(k); const today = TODAY();
    const x = { n: items.length, late: 0, old: 0, mine: 0, soon: "", longest: 0 };
    if (k === "today") x.late = items.filter((t) => t.date < today).length;
    if (k === "next") x.old = items.filter((t) => ageOf(t) > 14).length;
    if (k === "ai") x.mine = items.filter((t) => t.ai === "💭" || t.ai === "🔍✅").length;
    if (k === "plan" && items[0]) x.soon = `${md(items[0].date)}（${WD[dow(items[0].date)]}）の「${short(items[0].name, 10)}」`;
    if (k === "wait") x.longest = Math.max(0, ...items.map(ageOf));
    x.mood = GIRLS[k].mood(x.n, x);
    return x;
  }
  function sceneItems(k) {
    const items = at(k); const today = TODAY();
    if (k === "today") return items.sort((a, b) => (b.date < today) - (a.date < today) || WAKU_ORDER.indexOf(a.waku) - WAKU_ORDER.indexOf(b.waku));
    if (k === "plan") return items.sort((a, b) => a.date.localeCompare(b.date));
    if (k === "ai") { const o = { "💭": 0, "🔍✅": 1, "💬": 2, "🔍": 3, "🔬": 4 }; return items.sort((a, b) => (o[a.ai] ?? 9) - (o[b.ai] ?? 9)); }
    if (k === "inbox") return items.sort((a, b) => (b.edited || "").localeCompare(a.edited || ""));
    return items.sort((a, b) => (a.edited || "").localeCompare(b.edited || ""));
  }
  function renderHome(view) {

  // 選んだ答えに、ヒロインが反応してから Notion を書き換える
  async function choose(key) {

      if (!reduce) {

      const used = new Set();
      for (const g of live) { items.push({ k: "g", g }); for (const pid of g.projects) { const pj = S.projects.find((x) => x.id === pid); if (pj && !pj.status.includes("完了")) { items.push({ k: "p", p: pj }); used.add(pj.id); } } }
      const rest = S.projects.filter((x) => !used.has(x.id) && !x.status.includes("完了"));

      fill(list, "promise", items, 33, (x, i) => x.k === "g" ? `<button type="button" class="row" data-goal="${x.g.id}" style="--i:${i}"><span class="nm">${/挑戦中/.test(x.g.status) ? "💍" : "💭"} ${esc(x.g.name)}</span><span class="r">${esc(x.g.area || "")}</span></button>`

        : (() => { const st = projStats(x.p); const f = Math.round((st.pct / 100) * 5); return `<button type="button" class="row sub" data-proj-open="${x.p.id}" style="--i:${i}"><span class="nm">${esc(x.p.name)}</span><span class="r hi">${"♥".repeat(f)}${"♡".repeat(5 - f)} ${st.done}/${x.p.total}</span></button>`; })());

  }
  function projStats(p) {
    const open = S.tasks.filter((t) => t.projects.includes(p.id) && t.status !== ST.done && t.status !== ST.ref);
    const done = Math.max(0, p.total - open.length);
    return { open, done, pct: p.total ? Math.round((done / p.total) * 100) : 0 };
  }

  // ================= スマホ（すべてのDB） =================
  function initDbs() {
    const names = store.get("dbnames") || {};

  }
  const phoneIdle = () => S.tab === "phone" && !S.dbOpen && !S.leaf;
  async function refreshDbList() {
    try {
      const res = await call("fetch", { id: DB_PAGE });
      const body = String(res.text || "");
      const out = []; let sec = "その他";
      const re = /<h2[^>]*>\s*([^<]+?)\s*<\/h2>|^##\s+(.+)$|<database url="[^"]+"(?: data-source-url="collection:\/\/([0-9a-f-]+)")?[^>]*>([\s\S]*?)<\/database>/gm;
      for (const m of body.matchAll(re)) {
        if (m[1] || m[2]) { sec = (m[1] || m[2]).trim(); continue; }
        if (!m[3]) continue;
        const prev = S.dbs.find((d) => d.id === m[3]);
        out.push({ id: m[3], name: text(m[4]) || prev?.name || "", sec });
      }
      if (out.length >= 5) S.dbs = out;
    } catch { /* 控えの一覧のまま */ }
    if (phoneIdle()) render();
    fillDbNames();
  }
  // 名前のないDBは1つずつ読んで名前を出す（3本ずつ・覚えておく）
  async function fillDbNames() {
    const names = store.get("dbnames") || {};
    const todo = S.dbs.filter((d) => !d.name);
    let timer;
    const later = () => { clearTimeout(timer); timer = setTimeout(() => { if (phoneIdle()) render(); }, 300); };
    const worker = async () => {
      for (let d; (d = todo.shift());) {
        try {
          const res = await call("fetch", { id: `collection://${d.id}` });
          const m = String(res.text || "").match(/The title of this Data Source is:\s*(.+)/);
          d.name = (m ? m[1] : res.title || "").trim() || "（名前なし）";
          names[d.id] = d.name; store.set("dbnames", names);
        } catch { d.name = d.name || "（読めないDB）"; }
        later();
      }
    };
    await Promise.all([worker(), worker(), worker()]);
  }

  async function openDb(id) {

    render();
    if (S.mode === "demo") { S.dbLoading = false; S.dbErr = "見本では中身を読めないの。\nclaude.ai で開くと読めるよ。"; render(); return; }
    try {
      const res = await call("fetch", { id: `collection://${id}` });
      const t = String(res.text || "");
      const m = t.match(/The title of this Data Source is:\s*(.+)/); if (m && !d.name) d.name = m[1].trim();
      let schema = {};
      try { schema = JSON.parse((t.match(/<data-source-state>\s*([\s\S]*?)\s*<\/data-source-state>/) || [])[1] || "{}").schema || {}; } catch { /* 列の型なしで出す */ }
      S.dbSchema = schema;
      const edited = Object.values(schema).find((p) => p.type === "last_edited_time") || Object.values(schema).find((p) => p.type === "created_time");
      let r;
      try { r = await rows(id, { sort: edited ? [{ property: edited.name, direction: "descending" }] : undefined }); }

  function dbColumns() {

    for (const type of ["status", "select", "date", "number", "multi_select", "checkbox", "text"]) for (const p of all) if (p.type === type && p.name !== title && !SECRET.test(p.name) && extra.length < 2) extra.push(p);

  function cell(r, p) {

    if (p.type === "date") return v ? md(String(v).slice(0, 10)) : "";

      : kind === "diag" ? [["期間", x.from ? `${md(x.from)}〜${md(x.to || x.from)}` : ""], ["判定", x.verdict], ["今日やる完了率", `${Math.round(x.rate * 100)}%`], ["完了／流入", `${x.done}／${x.inflow}`], ["次の一手", x.next]]
      : [["イベント", x.event], ["日時", x.at ? `${md(jst(Date.parse(x.at)))} ${jstTime(Date.parse(x.at))}` : ""], ["内容", x.body]];

      L.raw = a >= 0 && b > a ? t.slice(a + 9, b) : "";

        <dt>次の一歩</dt><dd class="hi">${esc(t.next || "—")}</dd><dt>実行日</dt><dd>${t.date ? `${md(t.date)}（${WD[dow(t.date)]}）` : "—"}</dd><dt>枠</dt><dd>${esc(t.waku || "—")}</dd>

      g = { el, key: el.dataset.swipe, pages: +el.dataset.pages || 1, x: e.clientX, y: e.clientY, t: performance.now(), on: false, id: e.pointerId };
    }
    function move(e) {
      if (!g || e.pointerId !== g.id) return;
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (!g.on) { if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { g = null; return; } if (Math.abs(dx) < 10) return; g.on = true; }
      const p = cur(g.key); const can = dx < 0 ? p < g.pages - 1 : p > 0;
      const el = target(g); if (!el) return;
      el.style.transition = "none";
      el.style.transform = `translateX(${dx * (can ? 0.6 : 0.15)}px)`;
      el.style.opacity = String(1 - Math.min(0.5, Math.abs(dx) / 500));
    }
    function up(e) {
      if (!g || e.pointerId !== g.id) return;
      const G = g; g = null;
      if (!G.on) return;
      suppress = true; setTimeout(() => { suppress = false; }, 300);
      const dx = e.clientX - G.x; const p = cur(G.key); const dir = dx < 0 ? 1 : -1;
      const fast = Math.abs(dx) / Math.max(1, performance.now() - G.t) > 0.4;
      if ((Math.abs(dx) > 50 || (fast && Math.abs(dx) > 20)) && p + dir >= 0 && p + dir < G.pages) return go(G.key, dir);
      const el = target(G); if (!el) return;
      el.style.transition = "transform .25s, opacity .25s"; el.style.transform = ""; el.style.opacity = "";
    }
    function go(key, dir) {
      if (key === "leaf") { S.leaf.pg += dir; drawLeaf(dir); return; }
      S.page[key] = (S.page[key] || 0) + dir; S.slide = { key, dir }; render();
    }
    return { down, move, up, go, get suppress() { return suppress; } };
  })();
