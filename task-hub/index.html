<style>

:root {

  --line: #ffffff;
  --text: #ffffff;

  --hi: #ffd84a;

}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--f); font-size: 13px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
input, textarea { font: inherit; color: var(--text); }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px dashed var(--hi); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; max-width: 640px; margin: 0 auto; padding: 6px max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); }

/* ウィンドウ（白い二重の枠） */

.win.tight { padding: 3px 8px; }
.win .ttl { position: absolute; top: -10px; left: 10px; background: #000; padding: 0 5px; font-size: 11px; }
.cur { color: var(--text); }
.cur::before { content: "▶"; display: inline-block; width: 1.1em; color: transparent; }
.cur[aria-pressed="true"]::before, .cur.on::before { color: var(--text); animation: blink .8s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.more { position: absolute; right: 8px; bottom: 1px; font-size: 11px; animation: down .8s steps(2) infinite; }
@keyframes down { 50% { transform: translateY(2px); } }
.dim { color: var(--dim); }
.hi { color: var(--hi); }
.danger { color: var(--danger); }

/* 上のステータス */
.top { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.top b { font-weight: 400; }
.top .clock { margin-left: auto; }
.top .clock .c { animation: blink 1s steps(1) infinite; }

main { min-height: 0; display: flex; flex-direction: column; gap: 8px; position: relative; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 9px; }
.view.fade { animation: fadein .25s steps(4); }

/* まち */
.town { position: relative; flex: none; border: 2px solid var(--line); border-radius: 7px; overflow: hidden; box-shadow: 0 0 0 2px #000, 0 0 0 3px #555; }
.town canvas { display: block; width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; aspect-ratio: 320 / 208; }
.sign { position: absolute; transform: translate(-50%, -100%); background: #000; border: 1.5px solid #fff; border-radius: 4px; font-size: 10px; line-height: 1.25; padding: 1px 4px; white-space: nowrap; pointer-events: none; }
.sign .n { color: var(--hi); }
.sign .n.danger { color: var(--danger); }
.towntap { position: absolute; inset: 0; }
.msg { min-height: 56px; font-size: 13px; }
.msg p { margin: 0; white-space: pre-wrap; }
.places { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 2px 8px; overflow: hidden; }
.places button { display: flex; align-items: baseline; gap: 4px; padding: 3px 0; white-space: nowrap; overflow: hidden; }
.places .n { margin-left: auto; color: var(--hi); }
.places .s { font-size: 10px; }

/* 建物の中・一覧 */
.list { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.li { display: grid; grid-template-columns: 1.1em 1fr auto; align-items: center; gap: 4px; height: 30px; flex: none; width: 100%; white-space: nowrap; animation: appear .2s steps(3) both; animation-delay: calc(var(--i, 0) * 40ms); }

.li .r { font-size: 11px; color: var(--dim); }
.li .r.danger { color: var(--danger); }
.li .r.hi { color: var(--hi); }
.li::before { content: "▶"; color: transparent; }
.li:hover::before, .li:focus-visible::before, .li.on::before { color: var(--text); }
.li.sub { height: 26px; font-size: 12px; padding-left: 1em; }
.pg { font-size: 11px; color: var(--dim); text-align: right; }
.in-l { animation: slidel .22s steps(4); } .in-r { animation: slider .22s steps(4); }
@keyframes slidel { from { transform: translateX(30%); opacity: 0; } }
@keyframes slider { from { transform: translateX(-30%); opacity: 0; } }
.cmds { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
.cmds button { padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row2 { display: flex; gap: 8px; align-items: stretch; }

/* たたかう */
.stage { position: relative; flex: none; height: 168px; border: 2px solid var(--line); border-radius: 7px; overflow: hidden; background: linear-gradient(#000 0 60%, #0b1a0b 60%, #142a14); box-shadow: 0 0 0 2px #000, 0 0 0 3px #555; touch-action: pan-y; }
.mons { position: absolute; inset: 0; display: flex; justify-content: space-evenly; align-items: flex-end; padding-bottom: 18px; }

.legend { font-size: 10px; color: var(--dim); margin: 2px 0 0; }

.notebody, .nb { text-align: left; }

.row2 { margin-top: 4px; }

.fields { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; margin: 0; }
.fields dt { color: var(--dim); white-space: nowrap; }
.fields dd { margin: 0; overflow-wrap: anywhere; }

.nb { display: block; margin: 0 0 3px; overflow-wrap: anywhere; }
.nb.h { color: var(--hi); margin-top: 6px; }
.nb.h::before { content: "◆ "; }
.nb.h3 { color: var(--hi); }
.nb.h3::before { content: "◇ "; }
.nb.todo { display: grid; grid-template-columns: 1.6em 1fr; text-align: left; width: 100%; }
.nb.todo .box::before { content: "□"; }
.nb.todo.done .box::before { content: "■"; color: var(--good); }
.nb.todo.done span:last-child { color: var(--dim); text-decoration: line-through; }
.nb.li { padding-left: 1em; text-indent: -1em; }
.nb.li::before { content: "・"; }
.nb.quote { color: var(--dim); padding-left: 8px; border-left: 2px solid #555; }
.nb.callout { border: 1px dashed #888; padding: 3px 6px; }
.nb.tog { text-align: left; width: 100%; color: var(--mp); }
.nb.tbl { font-size: 11px; line-height: 1.5; border-left: 2px solid #555; padding-left: 6px; }
.nb.tbl span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nb.code { font-size: 10.5px; white-space: pre-wrap; color: #ccc; }
.nb.media, .nb.muted { color: var(--dim); font-size: 11px; }
.write { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.write textarea, .write input { background: #000; border: 1.5px solid #fff; border-radius: 4px; padding: 5px 7px; font-size: 13px; }
.write textarea { flex: 1; min-height: 80px; resize: none; }
.write label, .write .note { font-size: 11px; color: var(--dim); }
.tfoot { display: flex; justify-content: center; gap: 12px; font-size: 12px; color: var(--dim); min-height: 18px; }
.tfoot button:disabled { opacity: .3; }
.secret { color: var(--dim); }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--dim); padding: 10px; }

#say { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100% - 24px)); z-index: 60; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

  // たたかう：光って消える → けいけんち
  async function fight(key) {

      $("#bcmd").innerHTML = `<button type="button" class="cur on" data-fight="research">けんじゃに たのむ（🔍）</button><button type="button" class="cur" data-fight="wait">まってもらう（待ち）</button>

    S.target = null;
    S.battleMsg = key === "done" ? `${short(t.name, 14)}を やっつけた！\n${expOf(t.weight)}ポイントの けいけんちを かくとく！` : ACTIONS[key].msg(short(t.name, 14));

  }

  // ================= つよさ（診断・運用ログ） =================
  function renderStatus(view) {
    const today = TODAY();
    const left = at("today").length, done = S.doneToday.length, late = lateCount(), mine = mineCount();
    const hp = left + done ? Math.round((done / (left + done)) * 100) : 0;
    const exp = S.doneToday.reduce((a, t) => a + expOf(t.weight), 0);
    const d = S.diag.at(-1);
    view.insertAdjacentHTML("beforeend", `<div class="row2"><div class="win" style="flex:1"><span class="ttl">つよさ</span><dl class="stat">
        <dt>たおした</dt><dd>${done} / ${left + done}</dd><dt>のこり</dt><dd>${left}ひき</dd><dt>いかり</dt><dd class="${late ? "danger" : ""}">${late}</dd><dt>けいけんち</dt><dd class="hi">+${exp}</dd><dt>じぶんのばん</dt><dd>${mine}</dd><dt>さかば</dt><dd>${at("inbox").length}にん</dd></dl></div>
      <div class="win" style="flex:1.1"><span class="ttl">HP・MP</span><div style="font-size:12px">HP（きょうの たっせい）<div class="bar"><i data-w="${hp}"></i></div><div style="text-align:right">${hp}%</div>
        MP（じゅもんの のこり）<div class="bar"><i data-w="${Math.max(0, 100 - mine * 20)}" style="background:var(--mp)"></i></div><div style="text-align:right">${Math.max(0, 100 - mine * 20)}%</div></div></div></div>
      <div class="win msg" ${d ? `role="button" tabindex="0" data-diag="${d.id}"` : ""}><span class="ttl">おうさまの おことば</span><p id="kingmsg"></p></div>`);
    type($("#kingmsg"), d ? `「第${d.no}回の しんだん：${d.verdict}。\nつぎは ${d.next}」` : S.extraErr.diag ? `しんだんが とどかない！ ${S.extraErr.diag}` : "「まだ しんだんは ない。」");
    const ds = S.diag.slice(-8);
    if (ds.length) {
      const W = 320, H = 96, pad = 16, bw = Math.min(14, (W - pad * 2) / ds.length / 3);
      const max = Math.max(10, ...ds.map((x) => Math.max(x.done, x.inflow)));
      const xs = ds.map((_, i) => pad + ((i + .5) * (W - pad * 2)) / ds.length);
      const yv = (v) => H - 14 - (v / max) * (H - 26);
      const bars = ds.map((x, i) => `<rect x="${Math.round(xs[i] - bw - 1)}" y="${Math.round(yv(x.inflow))}" width="${Math.round(bw)}" height="${Math.round(H - 14 - yv(x.inflow))}" fill="#555"><animate attributeName="height" from="0" to="${Math.round(H - 14 - yv(x.inflow))}" dur=".6s" fill="freeze"/><animate attributeName="y" from="${H - 14}" to="${Math.round(yv(x.inflow))}" dur=".6s" fill="freeze"/></rect>
        <rect x="${Math.round(xs[i] + 1)}" y="${Math.round(yv(x.done))}" width="${Math.round(bw)}" height="${Math.round(H - 14 - yv(x.done))}" fill="#7cf06a"><animate attributeName="height" from="0" to="${Math.round(H - 14 - yv(x.done))}" dur=".8s" fill="freeze"/><animate attributeName="y" from="${H - 14}" to="${Math.round(yv(x.done))}" dur=".8s" fill="freeze"/></rect>
        <text x="${xs[i]}" y="${H - 3}" text-anchor="middle">${x.no}かいめ</text><text x="${xs[i]}" y="${Math.round(yv(Math.max(x.done, x.inflow))) - 3}" text-anchor="middle" class="pct">${Math.round(x.rate * 100)}%</text>`).join("");
      view.insertAdjacentHTML("beforeend", `<div class="win chart"><span class="ttl">ぼうけんの きろく</span><div class="legend"><i style="background:#555"></i>はいってきた <i style="background:#7cf06a"></i>たおした <b>%</b> きょうやる たっせいりつ</div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="しんだんの すいい">${bars}</svg></div>`);
    }
    view.insertAdjacentHTML("beforeend", `<div class="win" style="flex:1;min-height:0;display:flex;flex-direction:column"><span class="ttl">できごと（運用ログ）</span><div class="list" id="loglist"></div></div>`);
    const box = $("#loglist", view);
    if (!S.logs.length) box.innerHTML = `<div class="empty">${esc(S.extraErr.log || "まだ なにも おきていない。")}</div>`;
    else fill(box, "log", S.logs, 28, (l, i) => `<button type="button" class="li" data-log="${l.id}" style="--i:${i}"><span class="nm">${esc(l.name)}</span><span class="r">${esc(l.event)} ${l.at ? (jst(Date.parse(l.at)) === today ? jstTime(Date.parse(l.at)) : md(jst(Date.parse(l.at)))) : ""}</span></button>`);
    requestAnimationFrame(() => requestAnimationFrame(() => { for (const b of view.querySelectorAll(".bar i")) b.style.width = `calc(${b.dataset.w}% - 2px)`; }));
  }
  function projStats(p) {
    const open = S.tasks.filter((t) => t.projects.includes(p.id) && t.status !== ST.done && t.status !== ST.ref);
    const done = Math.max(0, p.total - open.length);
    return { open, done, pct: p.total ? Math.round((done / p.total) * 100) : 0 };
  }

  // ================= ふくろ（すべてのDB） =================
  function initDbs() {
    const names = store.get("dbnames") || {};
    S.dbs = SECTIONS.flatMap(([sec, items]) => items.map(([id, name]) => ({ id, name: name || names[id] || "", sec })));
  }
  async function refreshDbList() {
    try {
      const res = await call("fetch", { id: DB_PAGE });
      const body = String(res.text || "");
      const out = []; let sec = "その他";
      const re = /<h2[^>]*>\s*([^<]+?)\s*<\/h2>|^##\s+(.+)$|<database url="[^"]+"(?: data-source-url="collection:\/\/([0-9a-f-]+)")?[^>]*>([\s\S]*?)<\/database>/gm;
      for (const m of body.matchAll(re)) {
        if (m[1] || m[2]) { sec = (m[1] || m[2]).trim(); continue; }
        if (!m[3]) continue;
        const prev = S.dbs.find((d) => d.id === m[3]);
        out.push({ id: m[3], name: text(m[4]) || prev?.name || "", sec });
      }
      if (out.length >= 5) S.dbs = out;
    } catch { /* 控えの一覧のまま */ }
    if (S.tab === "bag" && !S.dbOpen && !S.leaf) render();
    fillDbNames();
  }
  // 名前のないDBは1つずつ読んで名前を出す（3本ずつ・覚えておく）
  async function fillDbNames() {
    const names = store.get("dbnames") || {};
    const todo = S.dbs.filter((d) => !d.name);
    let timer;
    const later = () => { clearTimeout(timer); timer = setTimeout(() => { if (S.tab === "bag" && !S.dbOpen && !S.leaf) render(); }, 300); };
    const worker = async () => {
      for (let d; (d = todo.shift());) {
        try {
          const res = await call("fetch", { id: `collection://${d.id}` });
          const m = String(res.text || "").match(/The title of this Data Source is:\s*(.+)/);
          d.name = (m ? m[1] : res.title || "").trim() || "（名前なし）";
          names[d.id] = d.name; store.set("dbnames", names);
        } catch { d.name = d.name || "（読めないDB）"; }
        later();
      }
    };
    await Promise.all([worker(), worker(), worker()]);
  }
  function renderBag(view) {
    if (S.dbOpen) return renderDb(view);
    const secs = [...new Set(S.dbs.map((d) => d.sec))];
    if (!S.bagSec || !secs.includes(S.bagSec)) S.bagSec = secs[0];

      <div class="row2" style="flex:1;min-height:0"><div class="win" style="flex:0 0 38%;display:flex;flex-direction:column"><span class="ttl">しゅるい</span>${secs.map((s) => `<button type="button" class="cur" data-bagsec="${esc(s)}" aria-pressed="${s === S.bagSec}" style="padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.replace(/^\S+\s/, ""))}</button>`).join("")}</div>
      <div class="win" style="flex:1;display:flex;flex-direction:column"><span class="ttl">どうぐ</span><div class="list" id="baglist"></div></div></div>`);
    type($("#bagmsg"), `🗄 データベース ページの ${S.dbs.length}この どうぐが はいっている。\nつかう どうぐを えらんでね。`);
    fill($("#baglist", view), `bag:${S.bagSec}`, S.dbs.filter((d) => d.sec === S.bagSec), 30, (d, i) => `<button type="button" class="li" data-db="${d.id}" style="--i:${i}"><span class="nm">${esc(d.name || "…")}</span><span class="r"></span></button>`);
  }
  async function openDb(id) {
    const d = S.dbs.find((x) => x.id === id); if (!d) return;
    S.dbOpen = d; S.dbRows = []; S.dbSchema = null; S.dbErr = null; S.dbQuery = ""; S.dbLoading = true; S.page.db = 0;
    render();
    if (S.mode === "demo") { S.dbLoading = false; S.dbErr = "みほんでは なかみを よめない。（claude.ai で ひらくと よめる）"; render(); return; }
    try {
      const res = await call("fetch", { id: `collection://${id}` });
      const t = String(res.text || "");
      const m = t.match(/The title of this Data Source is:\s*(.+)/); if (m && !d.name) d.name = m[1].trim();
      let schema = {};
      try { schema = JSON.parse((t.match(/<data-source-state>\s*([\s\S]*?)\s*<\/data-source-state>/) || [])[1] || "{}").schema || {}; } catch { /* 列の型なしで出す */ }
      S.dbSchema = schema;
      const edited = Object.values(schema).find((p) => p.type === "last_edited_time") || Object.values(schema).find((p) => p.type === "created_time");
      let r;
      try { r = await rows(id, { sort: edited ? [{ property: edited.name, direction: "descending" }] : undefined }); }
      catch { r = await rows(id); }
      S.dbRows = r.results; S.dbMore = r.more;
    } catch (err) { S.dbErr = errText(err); }
    S.dbLoading = false;
    if (S.dbOpen === d) render();
  }
  function dbColumns() {
    const all = Object.values(S.dbSchema || {});
    const title = all.find((p) => p.type === "title")?.name || "名前";
    const extra = [];
    for (const type of ["status", "select", "date", "number", "multi_select", "checkbox", "text"]) for (const p of all) if (p.type === type && p.name !== title && !SECRET.test(p.name) && extra.length < 2) extra.push(p);
    return { title, extra };
  }
  function cell(r, p) {
    const k = p.type === "date" ? `date:${p.name}:start` : /^(url|id)$/i.test(p.name) ? `userDefined:${p.name}` : p.name;
    const v = r[k] ?? r[p.name];
    if (p.type === "checkbox") return v === "__YES__" ? "☑" : "☐";
    if (p.type === "date") return v ? md(String(v).slice(0, 10)) : "";
    const l = list(v);
    if (l) return l.every((x) => /^https?:/.test(x)) ? (l.length ? `${l.length}件` : "") : l.join("・");
    return text(v);
  }
  function renderDb(view) {
    const d = S.dbOpen;
    view.insertAdjacentHTML("beforeend", `<div class="win msg"><span class="ttl">${esc(d.name || "どうぐ")}</span><p id="dbmsg"></p></div>`);
    if (S.dbLoading) { type($("#dbmsg"), `${d.name}を しらべている…`); view.insertAdjacentHTML("beforeend", `<div class="win tight"><button type="button" class="cur on" data-dbback="1">もどる</button></div>`); return; }
    if (S.dbErr) { type($("#dbmsg"), S.dbErr); view.insertAdjacentHTML("beforeend", `<div class="win tight"><button type="button" class="cur on" data-dbback="1">もどる</button></div>`); return; }
    const { title, extra } = dbColumns();
    const q = S.dbQuery.trim().toLowerCase();
    const items = S.dbRows.filter((r) => !q || Object.values(r).some((v) => typeof v === "string" && !isRef(v) && text(v).toLowerCase().includes(q)));
    type($("#dbmsg"), `${d.name}の なかに ${items.length}${S.dbMore ? "（あたらしい 100）" : ""}この ものが ある。`);
    view.insertAdjacentHTML("beforeend", `<div class="win tight"><input id="dbq" type="search" placeholder="さがす" value="${esc(S.dbQuery)}" aria-label="さがす" style="width:100%;background:#000;border:0;border-bottom:1px solid #fff"></div>
      <div class="win" style="flex:1;min-height:0;display:flex;flex-direction:column"><div class="list" id="dblist"></div></div>

  }

  function placeOfTask(t) { const lane = laneOf(t); const k = LANE_PLACE[lane]; return k ? PLACES[k] : { name: "しょこ", sub: "REFERENCE" }; }
  function openTask(id) {
    const t = known.get(id); if (!t) return;

  function openDbRow(i) {

  // 目標・診断・運用ログなど、読み込んだ行をそのまま開く

      : kind === "diag" ? [["期間", x.from ? `${md(x.from)}〜${md(x.to || x.from)}` : ""], ["判定", x.verdict], ["今日やる完了率", `${Math.round(x.rate * 100)}%`], ["完了／流入", `${x.done}／${x.inflow}`], ["次の一手", x.next]]
      : [["イベント", x.event], ["日時", x.at ? `${md(jst(Date.parse(x.at)))} ${jstTime(Date.parse(x.at))}` : ""], ["内容", x.body]];

  function closeSheet() { S.leaf = null; const sh = $("#sheet"); sh.hidden = true; sh.innerHTML = ""; delete sh.dataset.id; }
  async function loadBody() {
    const L = S.leaf;
    if (S.mode === "demo") { L.raw = DEMO_BODY; L.body = parseBody(DEMO_BODY); drawLeaf(); return; }
    try {

  function fieldsHtml() {

        <dt>つぎのいって</dt><dd class="hi">${esc(t.next || "—")}</dd><dt>ひづけ</dt><dd>${t.date ? `${md(t.date)}（${WD[dow(t.date)]}）` : "—"}</dd><dt>じかんたい</dt><dd>${esc(t.waku || "—")}</dd>

  function drawLeaf(slide = 0) {

      el.style.opacity = String(1 - Math.min(0.5, Math.abs(dx) / 500));
    }
    function up(e) {
      if (!g || e.pointerId !== g.id) return;
      const G = g; g = null;
      if (!G.on) return;
      suppress = true; setTimeout(() => { suppress = false; }, 300);
      const dx = e.clientX - G.x; const p = cur(G.key); const dir = dx < 0 ? 1 : -1;
      const fast = Math.abs(dx) / Math.max(1, performance.now() - G.t) > 0.4;
      if ((Math.abs(dx) > 50 || (fast && Math.abs(dx) > 20)) && p + dir >= 0 && p + dir < G.pages) return go(G.key, dir);
      const el = target(G); if (!el) return;
      el.style.transition = "transform .25s, opacity .25s"; el.style.transform = ""; el.style.opacity = "";
    }
    function go(key, dir) {
      if (key === "leaf") { S.leaf.pg += dir; drawLeaf(dir); return; }
      S.page[key] = (S.page[key] || 0) + dir; S.slide = { key, dir }; render();
    }
    return { down, move, up, go, get suppress() { return suppress; } };
  })();

  // ================= 操作 =================
  document.addEventListener("click", (e) => { if (swipe.suppress) { e.stopPropagation(); e.preventDefault(); } }, true);

    if (!el) { if (e.target.id === "sheet") closeSheet(); return; }

    const ds = el.dataset;
    if (ds.tab) { S.tab = ds.tab; S.place = null; S.dbOpen = null; S.battleMsg = null; render(); return; }
    if (ds.goto) { goTo(ds.goto); return; }
    if (ds.pick) { S.target = S.target === ds.pick ? null : ds.pick; render(); return; }
    if (ds.leave) { S.place = null; S.target = null; render(); return; }
    if (ds.target) { S.target = ds.target; render(); return; }

    if (ds.church) { S.churchTab = ds.church; S.page.place = 0; render(); return; }
    if (ds.bagsec) { S.bagSec = ds.bagsec; S.page.bagdb = 0; render(); return; }

    if (ds.projOpen) { openProject(ds.projOpen); return; }
    if (ds.goal) { openPage("goal", ds.goal); return; }
    if (ds.diag) { openPage("diag", ds.diag); return; }
    if (ds.log) { openPage("log", ds.log); return; }
    if (ds.close) { closeSheet(); return; }
    if (ds.db) { openDb(ds.db); return; }
    if (ds.dbback) { S.dbOpen = null; render(); return; }
    if (ds.dbrow !== undefined) { openDbRow(+ds.dbrow); return; }
    if (ds.view) { S.leaf.view = ds.view; drawLeaf(); return; }
    if (ds.leafpg) { swipe.go("leaf", +ds.leafpg); return; }
    if (ds.tog) { const o = S.leaf.open; o.has(ds.tog) ? o.delete(ds.tog) : o.add(ds.tog); drawLeaf(); return; }
    if (ds.check !== undefined) { toggleCheck(+ds.check); return; }
    if (ds.wmode) { S.leaf.write = ds.wmode; drawLeaf(); return; }
    if (ds.save) { save(); return; }
    if (ds.where) { S.leaf.where = ds.where; for (const b of document.querySelectorAll("#n-where button")) b.classList.toggle("on", b === el); return; }
    if (ds.create) { createTask(); return; }
    if (ds.open) { openTask(ds.open); return; }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeSheet();
    if (e.key === "Enter" && e.target.matches("[data-open], [data-dbrow], [data-db], [data-proj-open], [data-goal], [data-diag], [data-log]") && e.target.tagName !== "BUTTON") { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id !== "dbq") return;
    S.dbQuery = e.target.value; S.page.db = 0;
    const pos = e.target.selectionStart; render(); const i = $("#dbq"); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
  });
  addEventListener("pointerdown", swipe.down);

  addEventListener("pointerup", swipe.up);
  addEventListener("pointercancel", (e) => swipe.up(e));
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (!document.activeElement?.matches("textarea, input")) { render(); if (S.leaf && S.leaf.kind !== "new") drawLeaf(); } }, 150); });

  // 時計（日本時間）
  function tick() {

  // ================= 起動 =================

  }
  const DEMO_BODY = "<table-of-contents />\n## ☑️ ToDo\n- [x] 候補を3つに絞る\n- [ ] 寸法を測る\n- [ ] 色を決める\n\n郵便受けに雨が入るので対策を考えたい\n\n## 🔍 調査結果（10/22 13:52）\n<callout icon=\"⭐\" color=\"yellow_bg\">\n**これにしておけばいい**：（例）ひさし付きのタイプに替える\n</callout>\n| 案 | 良い点 | 弱み |\n| --- | --- | --- |\n| ⭐ ひさしを足す | 安い | 見た目 |\n| 本体を替える | 確実 | 工事 |\n<toggle>\n10/20 1回目 🔍 ─ 前回の調べもの\n- 前回の要点（例）\n</toggle>\n## メモ\n（例）次の打ち合わせで聞く";

      { id: P1, url: "https://www.notion.so/" + P1, name: "（例）書斎を仕上げる", status: "🔥 進行中", step: "デスク天板から画面上端までの高さを測る", now: "", total: 6, edited: new Date().toISOString() },

      { id: P3, url: "https://www.notion.so/" + P3, name: "（例）タスクアプリ", status: "⏸ 保留", step: "UI案から3つ選ぶ", now: "", total: 4, edited: new Date().toISOString() },

    S.logs = [["定期実行", "（例）ジャーナル作成", "終わった12件"], ["NEXT", "（例）ボトルを選んで買う", ""], ["仕組み変更", "（例）共通設定を更新", ""], ["ステータス", "（例）歯医者の予約", ""], ["定期実行", "（例）AIリサーチ定時処理", "対象なし"], ["作成", "（例）常夜灯の材料を買う", ""]].map(([event, name, body], i) => ({ id: `lg${i}`, url: "https://www.notion.so/", event, name, body, at: new Date(Date.now() - i * 3600e3 * 3).toISOString() }));

      { id: "g1", url: "https://www.notion.so/", name: "（例）タスク管理が効率的に回っている", status: "🔥 挑戦中", kind: "🎯 GOAL", area: "LEARN", due: null, why: "", goalBy: "", projects: [P3, P1] },

  }

  initDbs();
  const snap = store.get("snap");
  if (snap?.tasks?.length) {
    Object.assign(S, { tasks: snap.tasks, projects: snap.projects || [], doneToday: Array.isArray(snap.doneToday) ? snap.doneToday : [], inboxMore: !!snap.inboxMore, diag: snap.diag || [], logs: snap.logs || [], goals: snap.goals || [], loadedAt: snap.at });

  try { const h = location.hash.slice(1); if (["town", "battle", "status", "bag"].includes(h)) S.tab = h; } catch { /* なし */ }

  load();
  window.__imadoko = { parseBody, laneOf, lastTodoOfSection }; // 確認用
})();
