<title>今どこボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* システム手帳：革のカバーの上に方眼のリフィル。上にインデックスの見出し（今どこ6区分）、下にしおり。リフィル1枚に収め、続きはページをめくる */
:root {
  --cover: #4a3428;
  --cover-2: #3a281f;
  --stitch: rgba(236, 214, 182, .55);
  --paper: #fbf9f3;
  --paper-2: #f3efe4;
  --ink: #23283a;
  --pencil: #6b6f7c;
  --rule: #cfdbe6;
  --dot: #d7dde3;
  --margin: #e3a7a0;
  --ink-blue: #2b4c8c;
  --stamp: #c23a2b;
  --sticky: #fbeaa0;
  --sticky-2: #f6d6c8;
  --card: #fffdf8;
  --hole: #3a281f;
  --today: #d27a1e;
  --plan: #3b72c4;
  --next: #c8452f;
  --inbox: #7d8593;
  --wait: #b08c12;
  --proj: #7a52b4;
  --ai: #23887a;
  --good: #3a8a50;
  --f-hand: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-ui: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --cover: #2a1f19; --cover-2: #1c1410; --stitch: rgba(214, 190, 150, .4); --paper: #20242c; --paper-2: #282d36; --ink: #e8e4da; --pencil: #a3a7b2;
    --rule: #333c4a; --dot: #353d49; --margin: #7d4a46; --ink-blue: #8fb0ee; --stamp: #f0806e; --sticky: #4b4426; --sticky-2: #4a3530; --card: #262b34; --hole: #120d0a;
    --today: #eda55a; --plan: #7eaaee; --next: #ef8270; --inbox: #a2aab7; --wait: #dcc055; --proj: #b796ea; --ai: #63c8b7; --good: #74c690;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --cover: #2a1f19; --cover-2: #1c1410; --stitch: rgba(214, 190, 150, .4); --paper: #20242c; --paper-2: #282d36; --ink: #e8e4da; --pencil: #a3a7b2;
  --rule: #333c4a; --dot: #353d49; --margin: #7d4a46; --ink-blue: #8fb0ee; --stamp: #f0806e; --sticky: #4b4426; --sticky-2: #4a3530; --card: #262b34; --hole: #120d0a;
  --today: #eda55a; --plan: #7eaaee; --next: #ef8270; --inbox: #a2aab7; --wait: #dcc055; --proj: #b796ea; --ai: #63c8b7; --good: #74c690;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: radial-gradient(120% 80% at 30% 10%, rgba(255, 255, 255, .06), transparent 60%), radial-gradient(90% 70% at 80% 90%, rgba(0, 0, 0, .25), transparent 70%), var(--cover);
  color: var(--ink); font-family: var(--f-ui); font-size: 12px; line-height: 1.35; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: var(--ink); }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ink-blue); outline-offset: 1px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.hand { font-family: var(--f-hand); }

#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; max-width: 720px; margin: 0 auto; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-block: 4px 0; }
@media (min-width: 420px) { #app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

/* インデックス見出し（今どこ6区分）：リフィルの上に飛び出したタブ */
#lanes { grid-row: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; padding: 0 6px 0 22px; align-items: end; }
#lanes.off { visibility: hidden; height: 6px; overflow: hidden; }
.lane { --c: var(--accent, #888); position: relative; display: grid; justify-items: center; padding: 4px 0 3px; border-radius: 7px 7px 0 0; background: color-mix(in srgb, var(--c) 30%, var(--paper-2)); color: var(--ink); transform: translateY(3px); transition: transform .15s; }
.lane b { font-family: var(--f-hand); font-weight: 600; font-size: 16px; line-height: 1.05; }
.lane span { font-size: 9px; color: var(--pencil); white-space: nowrap; }
.lane[aria-pressed="true"] { background: var(--paper); transform: translateY(1px); box-shadow: 0 -1px 0 color-mix(in srgb, var(--c) 70%, transparent) inset, 0 -2px 4px rgba(0, 0, 0, .18); }
.lane[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; border-radius: 7px 7px 0 0; background: var(--c); }
.lane .ov { position: absolute; top: 1px; right: 3px; font-size: 8.5px; font-family: var(--f-num); color: var(--stamp); }

/* リフィル（紙） */
.paper { grid-row: 2; min-height: 0; display: grid; grid-template-rows: auto 1fr; position: relative; background-color: var(--paper);
  background-image: radial-gradient(var(--dot) .9px, transparent 1.2px); background-size: 12px 12px; background-position: 6px 6px;
  border-radius: 4px 10px 10px 4px; box-shadow: 0 1px 0 var(--paper-2), 0 6px 18px rgba(0, 0, 0, .35); padding: 6px 10px 8px 24px; }
/* 6穴のリング */
.paper::before { content: ""; position: absolute; left: 6px; top: 16px; bottom: 16px; width: 9px;
  background: radial-gradient(circle at 50% 50%, var(--hole) 0 3.4px, transparent 3.8px) 0 0 / 9px calc((100% - 0px) / 6) repeat-y; opacity: .9; }
.paper::after { content: ""; position: absolute; left: 18px; top: 0; bottom: 0; width: 1px; background: var(--margin); opacity: .55; }

header { display: flex; align-items: baseline; gap: 8px; padding-bottom: 4px; border-bottom: 1.5px solid var(--ink); margin-bottom: 6px; }
header .date { font-family: var(--f-hand); font-weight: 600; font-size: 17px; letter-spacing: .02em; }
header .date small { font-size: 11px; color: var(--pencil); margin-left: 2px; }
#stamp { color: var(--pencil); font-size: 9.5px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbtn { font-size: 11px; padding: 2px 7px; border: 1px solid var(--pencil); border-radius: 4px; color: var(--ink); white-space: nowrap; align-self: center; }
.hbtn.pen { border-color: var(--ink-blue); color: var(--ink-blue); }
.loading #reload { animation: wobble 1s ease-in-out infinite; }
@keyframes wobble { 50% { transform: rotate(-8deg); } }

main { min-height: 0; display: flex; flex-direction: column; }
.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.bar { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.bar h2 { font-family: var(--f-hand); font-weight: 600; font-size: 14px; margin: 0; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.bar .hint { color: var(--pencil); font-size: 10px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: flex; gap: 3px; flex-wrap: wrap; flex: none; }
.seg button { font-size: 10.5px; padding: 2px 7px; border-radius: 3px; border: 1px dashed var(--pencil); white-space: nowrap; color: var(--pencil); }
.seg button[aria-pressed="true"] { border-style: solid; border-color: var(--ink); color: var(--ink); background: color-mix(in srgb, var(--sticky) 80%, transparent); }
.seg .n { font-family: var(--f-num); font-size: 9.5px; margin-left: 2px; }

/* 罫線の一覧：1行＝1罫 */
.list { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
  background-image: repeating-linear-gradient(to bottom, transparent 0 35px, var(--rule) 35px 36px); }
.row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 6px; height: 36px; flex: none; text-align: left; width: 100%; padding-right: 2px; }
.row:active { background: color-mix(in srgb, var(--sticky) 45%, transparent); }
.row .tag { font-size: 9px; color: var(--pencil); text-align: center; line-height: 1.1; border-right: 1px solid var(--margin); height: 26px; display: grid; place-items: center; }
.row .txt { min-width: 0; display: grid; }
.row .nm { font-family: var(--f-hand); font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.row .sub { font-size: 9.5px; color: var(--pencil); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .side { display: flex; align-items: center; gap: 4px; }
.row.struck .nm { text-decoration: line-through; text-decoration-color: var(--stamp); text-decoration-thickness: 2px; color: var(--pencil); }

.stamp { font-size: 9px; padding: 0 4px; border: 1.3px solid var(--stamp); color: var(--stamp); border-radius: 3px; transform: rotate(-5deg); white-space: nowrap; font-weight: 700; line-height: 1.5; }
.date-ink { font-family: var(--f-num); font-size: 9.5px; color: var(--ink-blue); white-space: nowrap; }
.w { font-family: var(--f-hand); font-weight: 600; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; border: 1.2px solid var(--pencil); color: var(--pencil); }
.w.S { color: var(--good); border-color: var(--good); } .w.L { color: var(--today); border-color: var(--today); } .w.XL { color: var(--stamp); border-color: var(--stamp); }
.box { width: 20px; height: 20px; border: 1.6px solid var(--ink); border-radius: 2px; display: grid; place-items: center; font-family: var(--f-hand); font-weight: 600; font-size: 16px; line-height: 1; color: transparent; flex: none; }
.box:hover, .box.on { color: var(--stamp); }

.pager { display: flex; align-items: center; justify-content: center; gap: 12px; height: 26px; flex: none; }
.pager button { font-family: var(--f-hand); font-size: 12px; padding: 1px 8px; color: var(--ink-blue); }
.pager button:disabled { opacity: .25; }
.pager .pg { font-family: var(--f-num); font-size: 10px; color: var(--pencil); }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--pencil); font-family: var(--f-hand); font-size: 13px; padding: 12px; }

/* 付箋（いまやる） */
.sticky { position: relative; background: var(--sticky); padding: 12px 10px 8px; display: grid; gap: 5px; transform: rotate(-.7deg); box-shadow: 0 2px 5px rgba(0, 0, 0, .18); flex: none; margin: 4px 2px 2px; }
.sticky::before { content: ""; position: absolute; top: -7px; left: 50%; width: 64px; height: 16px; transform: translateX(-50%) rotate(2deg); background: color-mix(in srgb, var(--paper) 55%, transparent); border: 1px solid color-mix(in srgb, var(--pencil) 25%, transparent); }
.sticky .k { font-size: 9.5px; color: var(--pencil); display: flex; gap: 6px; align-items: center; }
.sticky .t { font-family: var(--f-hand); font-weight: 600; font-size: 15px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sticky .nx { font-size: 11px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.acts { display: flex; gap: 5px; flex-wrap: wrap; }
.acts button, .acts a { font-size: 11px; padding: 4px 9px; border-radius: 3px; border: 1px solid var(--ink); white-space: nowrap; color: var(--ink); text-decoration: none; background: color-mix(in srgb, var(--paper) 60%, transparent); }
.acts .pri { background: var(--ink); color: var(--paper); }
.acts .quiet { border-style: dashed; color: var(--pencil); border-color: var(--pencil); }
.meter { height: 6px; border: 1px solid var(--ink); border-radius: 1px; overflow: hidden; background: var(--paper); }
.meter i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--good) 0 3px, transparent 3px 5px); }

/* 予定：手帳のウィークリー2週 */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1.2px solid var(--ink); border-left: 1px solid var(--rule); flex: none; }
.cal button { height: 38px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); display: grid; grid-template-rows: auto 1fr; padding: 2px 3px; text-align: left; }
.cal .d { font-family: var(--f-hand); font-weight: 600; font-size: 12px; display: flex; justify-content: space-between; align-items: baseline; }
.cal .d small { font-family: var(--f-ui); font-size: 8.5px; color: var(--pencil); font-weight: 400; }
.cal .dots { display: flex; gap: 2px; align-items: end; padding-bottom: 2px; }
.cal .dots i { width: 6px; height: 6px; border-radius: 50%; border: 1.2px solid var(--plan); }
.cal .sun .d small, .cal .sun .d { color: var(--stamp); } .cal .sat .d small { color: var(--plan); }
.cal button[aria-pressed="true"] { background: color-mix(in srgb, var(--sticky) 85%, transparent); }
.cal button[aria-pressed="true"] .dots i { background: var(--plan); }

/* 次にやる：情報カード */
.icard { background: var(--card); padding: 8px 10px 8px; display: grid; gap: 6px; flex: none; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); border-top: 2px solid var(--stamp);
  background-image: repeating-linear-gradient(to bottom, transparent 0 21px, color-mix(in srgb, var(--plan) 22%, transparent) 21px 22px); background-position: 0 6px; touch-action: pan-y; }
.icard .k { display: flex; gap: 6px; align-items: center; font-size: 10px; color: var(--pencil); flex-wrap: wrap; }
.icard .t { font-family: var(--f-hand); font-weight: 600; font-size: 15.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.icard .nx { font-size: 11px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.icard .nx::before { content: "次の一手 ▸ "; color: var(--stamp); font-size: 9.5px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.grid4 button { font-size: 11px; padding: 5px 0; border-radius: 3px; border: 1px solid var(--ink); background: var(--paper); }
.grid4 button.pri { background: var(--ink); color: var(--paper); }
.grid4 button.quiet { border-style: dashed; color: var(--pencil); border-color: var(--pencil); background: none; }

/* 倉庫：貼られた付箋 */
.tiles { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 48px; gap: 6px; align-content: start; padding: 2px; }
.tile { background: color-mix(in srgb, var(--tc, var(--inbox)) 22%, var(--paper)); padding: 5px 7px; text-align: left; display: grid; grid-template-rows: 1fr auto; min-width: 0; box-shadow: 0 1px 2px rgba(0, 0, 0, .18); }
.tile:nth-child(3n+1) { transform: rotate(-.6deg); } .tile:nth-child(3n+2) { transform: rotate(.5deg); }
.tile .nm { font-family: var(--f-hand); font-weight: 600; font-size: 11.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
.tile .mt { font-size: 9px; color: var(--pencil); display: flex; gap: 5px; white-space: nowrap; overflow: hidden; }

/* 待ち */
.age { width: 54px; display: grid; gap: 2px; justify-items: end; }
.age .b { width: 100%; height: 5px; border: 1px solid var(--pencil); border-radius: 1px; overflow: hidden; }
.age .b i { display: block; height: 100%; background: var(--wait); }
.age .v { font-family: var(--f-hand); font-weight: 600; font-size: 11px; }

/* プロジェクト：クリップ留めのメモ */
.cards { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 98px; gap: 8px; align-content: start; padding: 6px 2px 0; }
.card { position: relative; background: var(--card); padding: 8px; text-align: left; display: grid; grid-template-rows: auto auto auto 1fr; gap: 3px; min-width: 0; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
.card::before { content: ""; position: absolute; top: -6px; right: 14px; width: 9px; height: 22px; border: 2px solid var(--pencil); border-radius: 6px; opacity: .8; }
.card .nm { font-family: var(--f-hand); font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px; }
.card .st { display: flex; justify-content: space-between; align-items: center; font-size: 9.5px; color: var(--pencil); }
.card .meter i { background: repeating-linear-gradient(-45deg, var(--proj) 0 3px, transparent 3px 5px); }
.card .stp { font-size: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
.card .stp::before { content: "▸ "; color: var(--proj); }

/* DB：手帳の索引（左に見出しタブ、右に罫線の一覧） */
.index { flex: 1; min-height: 0; display: grid; grid-template-columns: 78px 1fr; gap: 8px; }
.idx-tabs { display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: hidden; }
.idx-tabs button { text-align: left; font-size: 10.5px; padding: 3px 5px; border-left: 4px solid var(--sc); background: color-mix(in srgb, var(--sc) 12%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; max-height: 34px; }
.idx-tabs button[aria-pressed="true"] { background: color-mix(in srgb, var(--sc) 32%, var(--paper)); font-weight: 700; }
.idx-tabs .n { font-family: var(--f-num); font-size: 9px; color: var(--pencil); margin-left: 3px; }
.idx-list { min-width: 0; display: flex; flex-direction: column; }
#dbq { flex: 1; min-width: 0; font-size: 11px; padding: 3px 4px; border: 0; border-bottom: 1px solid var(--ink); background: transparent; }
.back { font-size: 11px; padding: 1px 7px; border: 1px solid var(--pencil); border-radius: 3px; white-space: nowrap; }

/* しおり（下のタブ） */
nav { grid-row: 3; display: flex; justify-content: center; gap: 10px; height: 40px; padding-bottom: 2px; }
nav button { width: 30%; max-width: 150px; display: flex; align-items: flex-start; justify-content: center; gap: 4px; padding-top: 4px; font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, .9);
  background: var(--rib, #7a2b2b); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); transform: translateY(-6px); transition: transform .15s; }
nav button[data-tab="where"] { --rib: #8c3a2e; } nav button[data-tab="ai"] { --rib: #2f6b62; } nav button[data-tab="db"] { --rib: #3d4e7a; }
nav button[aria-pressed="true"] { transform: translateY(0); height: 44px; margin-top: -4px; }
nav .n { font-family: var(--f-num); font-size: 9.5px; font-weight: 500; }

/* ページ（シート）：リフィルを1枚抜き出したもの */
#sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(20, 12, 8, .45); }
#sheet .leaf { width: 100%; max-width: 600px; height: calc(100% - 28px - env(safe-area-inset-top, 0px)); max-height: 760px; background-color: var(--paper);
  background-image: radial-gradient(var(--dot) .9px, transparent 1.2px); background-size: 12px 12px; border-radius: 10px 10px 0 0; box-shadow: 0 -4px 16px rgba(0, 0, 0, .35);
  padding: 12px max(14px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 7px; position: relative; }
#sheet .top { display: flex; gap: 8px; align-items: flex-start; }
#sheet h3 { margin: 0; flex: 1; min-width: 0; font-family: var(--f-hand); font-weight: 600; font-size: 16px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; border-bottom: 1.5px solid var(--ink); padding-bottom: 2px; }
#sheet .x { font-size: 18px; line-height: 1; padding: 2px 4px; color: var(--pencil); }
.fields { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 11px; flex: none; }
.fields dt { color: var(--pencil); white-space: nowrap; }
.fields dd { margin: 0; min-width: 0; overflow-wrap: anywhere; border-bottom: 1px dotted var(--rule); }
.fields dd.hand { font-family: var(--f-hand); font-weight: 600; font-size: 12px; }
.fields a, .notebody a { color: var(--ink-blue); }
.leaf .seg { border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
.notebody { flex: 1; min-height: 0; overflow: hidden; position: relative; font-size: 12px; line-height: 1.6;
  background-image: repeating-linear-gradient(to bottom, transparent 0 22px, var(--rule) 22px 23px); padding-left: 4px; }
.nb { display: block; margin: 0; padding: 1px 0; overflow-wrap: anywhere; }
.nb.h { font-family: var(--f-hand); font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--ink); margin-top: 4px; }
.nb.h3 { font-size: 13px; border-bottom-style: dashed; }
.nb.todo { display: grid; grid-template-columns: 20px 1fr; gap: 6px; align-items: start; text-align: left; width: 100%; font-family: var(--f-hand); font-weight: 600; }
.nb.todo .box { width: 16px; height: 16px; font-size: 14px; margin-top: 2px; }
.nb.todo.done span:last-child { text-decoration: line-through; text-decoration-color: var(--stamp); color: var(--pencil); }
.nb.todo.busy { opacity: .5; }
.nb.li::before { content: "・"; color: var(--pencil); }
.nb.quote { border-left: 3px solid var(--rule); padding-left: 6px; color: var(--pencil); }
.nb.callout { background: color-mix(in srgb, var(--sticky) 70%, transparent); padding: 4px 6px; transform: rotate(-.3deg); }

<script>
(() => {
  // ================= 設定 =================

  const TASK_DS = "21762844-acbe-8075-bbe6-000bcaf22801";

  const DB_PAGE = "3ed62844acbe81438bf3c88092856f8b"; // 🗄 データベース
  const PLAYER = "https://www.notion.so/3e962844acbe81b0843ff78fe19791fa"; // DB_プレイヤー（Satoshi）
  const STORE = "imadoko:v1";

  // 今どこ（DB_タスク管理の計算式）を、ステータスと実行日から同じ規則で出し直す。MCPは計算式の値を返さないため
  const LANES = [

  const SECTIONS = [
