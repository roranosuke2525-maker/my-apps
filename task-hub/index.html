<title>今どこボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho:wght@500;700&display=swap">
<style>
/* 布装の本：1画面＝1頁。左にノド（背）の影、右に頁の小口と6章の爪見出し。上に柱（章題）、下にノンブル。めくって次の頁・次の章へ */
:root {
  --cloth: #2e4a40;
  --cloth-2: #20352d;
  --paper: #f8f5ee;
  --paper-2: #efe9dc;
  --edge: #ddd4c2;
  --ink: #26221d;
  --pencil: #716a5e;
  --rule: #d9d1c1;
  --ink-blue: #2f5a8a;
  --stamp: #b5452f;
  --sticky: #f2e4b6;
  --shade: rgba(40, 28, 12, .22);
  --today: #b8691d;
  --plan: #3a6aa8;
  --next: #b5452f;
  --inbox: #7b7468;
  --wait: #a07f17;
  --proj: #6e4d9e;
  --ai: #2a7c6f;
  --good: #3f7d4d;
  --f-book: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --f-ui: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --cloth: #16231e; --cloth-2: #0f1915; --paper: #201e1b; --paper-2: #29261f; --edge: #36312a; --ink: #ebe5d8; --pencil: #a69e8f; --rule: #3b362e;
    --ink-blue: #8fb3e0; --stamp: #e47a62; --sticky: #4a4127; --shade: rgba(0, 0, 0, .5);
    --today: #e5a35f; --plan: #82abe6; --next: #e47a62; --inbox: #ada597; --wait: #d9bb57; --proj: #b496e6; --ai: #67c5b4; --good: #7cc391;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --cloth: #16231e; --cloth-2: #0f1915; --paper: #201e1b; --paper-2: #29261f; --edge: #36312a; --ink: #ebe5d8; --pencil: #a69e8f; --rule: #3b362e;
  --ink-blue: #8fb3e0; --stamp: #e47a62; --sticky: #4a4127; --shade: rgba(0, 0, 0, .5);
  --today: #e5a35f; --plan: #82abe6; --next: #e47a62; --inbox: #ada597; --wait: #d9bb57; --proj: #b496e6; --ai: #67c5b4; --good: #7cc391;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body { background: repeating-linear-gradient(45deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 4px), var(--cloth); color: var(--ink); font-family: var(--f-ui); font-size: 12px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: var(--ink); }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ink-blue); outline-offset: 1px; }
.num { font-variant-numeric: tabular-nums; }
.book-face { font-family: var(--f-book); }

#app { height: 100%; display: grid; max-width: 720px; margin: 0 auto; padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-block: 6px; }
@media (min-width: 420px) { #app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

/* 頁：ノドの影・小口の重なり */
.page { position: relative; min-height: 0; display: grid; grid-template-rows: auto 1fr auto; background: var(--paper); border-radius: 2px 6px 6px 2px; padding: 8px 14px 6px 22px;
  box-shadow: 1px 0 0 var(--edge), 2px 1px 0 var(--paper), 3px 1px 0 var(--edge), 4px 2px 0 var(--paper), 5px 2px 0 var(--edge), 6px 3px 0 var(--paper-2), 0 8px 22px rgba(0, 0, 0, .35); }
.page::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 22px; border-radius: 2px 0 0 2px; background: linear-gradient(to right, var(--shade), transparent); pointer-events: none; }
.page.thumbs { padding-right: 34px; }

/* 柱（上）とノンブル（下） */
.runhead { display: flex; align-items: baseline; gap: 8px; padding-bottom: 5px; border-bottom: .5px solid var(--ink); }
.runhead .date { font-family: var(--f-book); font-weight: 700; font-size: 13px; letter-spacing: .04em; white-space: nowrap; }
#stamp { color: var(--pencil); font-size: 9.5px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbtn { font-size: 11px; padding: 1px 6px; color: var(--ink-blue); white-space: nowrap; border-bottom: 1px solid currentColor; }
.loading #reload { animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.foot { display: flex; align-items: center; gap: 4px; padding-top: 4px; border-top: .5px solid var(--rule); }
.foot nav { display: flex; gap: 2px; }
.foot nav button { font-family: var(--f-book); font-size: 12px; padding: 3px 7px; color: var(--pencil); border-radius: 2px; }
.foot nav button[aria-pressed="true"] { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--stamp); }
.foot nav .n { font-family: var(--f-ui); font-size: 9.5px; margin-left: 2px; }
.folio { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.folio button { width: 30px; height: 26px; font-size: 15px; color: var(--ink-blue); }
.folio button:disabled { opacity: .2; }
.folio span { font-family: var(--f-book); font-size: 11.5px; min-width: 54px; text-align: center; color: var(--pencil); }

/* 爪見出し（右の小口に6章） */
#thumbs { position: absolute; right: 0; top: 46px; bottom: 54px; width: 26px; display: flex; flex-direction: column; gap: 3px; }
#thumbs[hidden] { display: none; }
.thumb { --c: var(--pencil); flex: 1; max-height: 64px; display: grid; align-content: center; justify-items: center; gap: 1px; border-radius: 4px 0 0 4px; background: color-mix(in srgb, var(--c) 22%, var(--paper-2)); color: var(--ink); transform: translateX(3px); transition: transform .15s; }
.thumb b { font-family: var(--f-book); font-size: 12px; line-height: 1; }
.thumb span { font-size: 9px; color: var(--pencil); font-variant-numeric: tabular-nums; }
.thumb .ov { color: var(--stamp); font-size: 8px; }
.thumb[aria-pressed="true"] { background: var(--c); color: var(--paper); transform: translateX(0); width: 30px; margin-left: -4px; }
.thumb[aria-pressed="true"] span, .thumb[aria-pressed="true"] .ov { color: var(--paper); }

main { min-height: 0; display: flex; flex-direction: column; padding-top: 6px; touch-action: pan-y; }
.pane { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; background: var(--paper); }

/* 章扉の見出し */
.chap { display: flex; align-items: baseline; gap: 8px; flex: none; }
.chap .no { font-family: var(--f-book); font-size: 10.5px; color: var(--stamp); letter-spacing: .1em; white-space: nowrap; }
.chap h2 { font-family: var(--f-book); font-weight: 700; font-size: 17px; margin: 0; letter-spacing: .06em; white-space: nowrap; }
.chap .hint { color: var(--pencil); font-size: 10px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.seg { display: flex; gap: 2px 10px; flex-wrap: wrap; flex: none; }
.seg button { font-size: 10.5px; padding: 1px 0; white-space: nowrap; color: var(--pencil); }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: 700; box-shadow: inset 0 -1.5px 0 var(--stamp); }
.seg .n { font-size: 9.5px; margin-left: 2px; font-variant-numeric: tabular-nums; }

/* 目次のような一覧：名前……日付 */
.list { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 6px; height: 38px; flex: none; text-align: left; width: 100%; border-bottom: .5px solid var(--rule); }
.row:active { background: var(--sticky); }
.row .tag { font-size: 9px; color: var(--pencil); text-align: center; line-height: 1.15; }
.row .txt { min-width: 0; display: grid; }
.row .nm { font-family: var(--f-book); font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
.row .sub { font-size: 9.5px; color: var(--pencil); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .side { display: flex; align-items: center; gap: 5px; }
.row.struck .nm { text-decoration: line-through; text-decoration-color: var(--stamp); text-decoration-thickness: 1.5px; color: var(--pencil); }

.stamp { font-size: 9px; padding: 0 4px; border: 1px solid var(--stamp); color: var(--stamp); white-space: nowrap; line-height: 1.6; }
.date-ink { font-size: 9.5px; color: var(--ink-blue); white-space: nowrap; font-variant-numeric: tabular-nums; }
.w { font-family: var(--f-book); font-weight: 700; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--pencil); color: var(--pencil); }
.w.S { color: var(--good); border-color: var(--good); } .w.L { color: var(--today); border-color: var(--today); } .w.XL { color: var(--stamp); border-color: var(--stamp); }
.box { width: 20px; height: 20px; border: 1.2px solid var(--ink); display: grid; place-items: center; font-family: var(--f-book); font-weight: 700; font-size: 14px; line-height: 1; color: transparent; flex: none; }
.box:hover, .box.on { color: var(--stamp); }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--pencil); font-family: var(--f-book); font-size: 13px; padding: 12px; }
.acts { display: flex; gap: 5px; flex-wrap: wrap; }
.acts button, .acts a { font-size: 11px; padding: 4px 9px; border: .5px solid var(--ink); white-space: nowrap; color: var(--ink); text-decoration: none; background: var(--paper); }
.acts .pri { background: var(--ink); color: var(--paper); }
.acts .quiet { border-color: transparent; color: var(--ink-blue); text-decoration: underline; padding-inline: 4px; }
.meter { height: 3px; background: var(--rule); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); }

/* 今日：いまやる（引用の枠） */
.lead { border-top: 1.5px solid var(--ink); border-bottom: .5px solid var(--ink); padding: 8px 2px 7px; display: grid; gap: 5px; flex: none; }
.lead .k { font-size: 9.5px; color: var(--pencil); display: flex; gap: 6px; align-items: center; letter-spacing: .08em; }
.lead .t { font-family: var(--f-book); font-weight: 700; font-size: 17px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lead .nx { font-family: var(--f-book); font-size: 12px; color: var(--pencil); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 予定：見開きの暦 */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); flex: none; border-top: .5px solid var(--ink); }
.cal button { height: 38px; border-bottom: .5px solid var(--rule); display: grid; grid-template-rows: auto 1fr; justify-items: center; padding-top: 2px; }
.cal .d { font-family: var(--f-book); font-weight: 700; font-size: 13px; line-height: 1.1; }
.cal .d small { font-family: var(--f-ui); font-size: 8.5px; color: var(--pencil); font-weight: 400; margin-left: 1px; }
.cal .dots { display: flex; gap: 2px; align-items: center; }
.cal .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--plan); }
.cal .sun .d { color: var(--stamp); } .cal .sat .d { color: var(--plan); }
.cal button[aria-pressed="true"] { background: var(--sticky); }

/* 次にやる：1頁に1件 */
.leafcard { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
.leafcard .k { display: flex; gap: 8px; align-items: center; font-size: 10px; color: var(--pencil); flex-wrap: wrap; }
.leafcard .t { font-family: var(--f-book); font-weight: 700; font-size: 20px; line-height: 1.5; letter-spacing: .02em; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.leafcard .nx { font-family: var(--f-book); font-size: 13px; line-height: 1.7; padding-left: 10px; border-left: 2px solid var(--stamp); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.leafcard .grid4 { margin-top: auto; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.grid4 button { font-size: 11.5px; padding: 6px 0; border: .5px solid var(--ink); background: var(--paper); }
.grid4 button.pri { background: var(--ink); color: var(--paper); }
.after { flex: none; display: grid; gap: 0; }
.after h3 { margin: 0 0 2px; font-family: var(--f-book); font-size: 11px; color: var(--pencil); font-weight: 500; letter-spacing: .1em; }

/* 倉庫：辞書の見出し語（2段組） */
.tiles { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 46px; column-gap: 14px; align-content: start; position: relative; }
.tiles::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: .5px solid var(--rule); }
.tile { padding: 4px 0; text-align: left; display: grid; grid-template-rows: 1fr auto; min-width: 0; border-bottom: .5px solid var(--rule); }
.tile .nm { font-family: var(--f-book); font-weight: 700; font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
.tile .nm::before { content: "■"; color: var(--tc, var(--inbox)); font-size: 8px; margin-right: 4px; vertical-align: 2px; }
.tile .mt { font-size: 9px; color: var(--pencil); display: flex; gap: 6px; white-space: nowrap; overflow: hidden; }

/* 待ち */
.age { width: 54px; display: grid; gap: 2px; justify-items: end; }
.age .b { width: 100%; height: 3px; background: var(--rule); overflow: hidden; }
.age .b i { display: block; height: 100%; background: var(--wait); }
.age .v { font-family: var(--f-book); font-weight: 700; font-size: 11.5px; }

/* プロジェクト：節の見出し */
.cards { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 92px; gap: 6px 14px; align-content: start; }
.card { padding: 6px 0 4px; text-align: left; display: grid; grid-template-rows: auto auto auto 1fr; gap: 3px; min-width: 0; border-top: 1.5px solid var(--ink); }
.card .nm { font-family: var(--f-book); font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .st { display: flex; justify-content: space-between; align-items: center; font-size: 9.5px; color: var(--pencil); }
.card .meter i { background: var(--proj); }
.card .stp { font-family: var(--f-book); font-size: 11px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.45; }

/* 索引：五十音の見出しのように、左に節、右に目次 */
.index { flex: 1; min-height: 0; display: grid; grid-template-columns: 76px 1fr; gap: 10px; }
.idx-tabs { display: flex; flex-direction: column; gap: 1px; min-height: 0; overflow: hidden; border-right: .5px solid var(--rule); padding-right: 6px; }
.idx-tabs button { text-align: left; font-family: var(--f-book); font-size: 11px; padding: 3px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; max-height: 32px; color: var(--pencil); }
.idx-tabs button[aria-pressed="true"] { color: var(--ink); font-weight: 700; box-shadow: inset 2px 0 0 var(--sc); padding-left: 6px; }
.idx-tabs .n { font-family: var(--f-ui); font-size: 9px; margin-left: 3px; }
.idx-list { min-width: 0; display: flex; flex-direction: column; }
.lead-dots { flex: 1; min-width: 12px; border-bottom: 1px dotted var(--pencil); margin: 0 4px 4px; align-self: end; }
#dbq { flex: 1; min-width: 0; font-size: 11px; padding: 3px 2px; border: 0; border-bottom: .5px solid var(--ink); background: transparent; }
.back { font-size: 11px; color: var(--ink-blue); white-space: nowrap; }

/* めくる頁（3D） */
.flipwrap { position: fixed; z-index: 50; pointer-events: none; perspective: 1400px; }
.flipwrap > .pane, .flipwrap > .leaf { width: 100%; height: 100%; }
.flipleaf { position: absolute; inset: 0; transform-origin: left center; transform-style: preserve-3d; will-change: transform; }
.flipleaf .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; background: var(--paper); }
.flipleaf .face > * { width: 100%; height: 100%; }
.flipleaf .back { transform: rotateY(180deg); background: linear-gradient(to left, var(--shade), transparent 30%), var(--paper-2); }
.flipleaf .shade { position: absolute; inset: 0; background: linear-gradient(to left, rgba(0, 0, 0, .28), transparent 60%); opacity: 0; pointer-events: none; }
.flipleaf .curl { position: absolute; top: 0; bottom: 0; right: 0; width: 26px; background: linear-gradient(to left, rgba(0, 0, 0, .12), transparent); pointer-events: none; }
.under-shadow { position: absolute; inset: 0; background: linear-gradient(to right, rgba(0, 0, 0, .25), transparent 55%); opacity: 0; pointer-events: none; z-index: 1; }
.flipwrap.under > .pane, .flipwrap.under > .leaf { position: absolute; inset: 0; }

/* 開いた頁（シート） */
#sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: stretch; justify-content: center; background: rgba(10, 16, 13, .55);
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); animation: fadein .18s ease-out; }
@keyframes fadein { from { opacity: 0; } }
.leaf { position: relative; width: 100%; max-width: 620px; max-height: 820px; align-self: center; height: 100%; background: var(--paper); border-radius: 2px 6px 6px 2px; padding: 10px 14px 6px 24px; display: flex; flex-direction: column; gap: 7px; touch-action: pan-y;
  box-shadow: 1px 0 0 var(--edge), 2px 1px 0 var(--paper), 3px 1px 0 var(--edge), 4px 2px 0 var(--paper-2), 0 10px 26px rgba(0, 0, 0, .45); }
.leaf::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 24px; background: linear-gradient(to right, var(--shade), transparent); pointer-events: none; }
.leaf .top { display: flex; gap: 8px; align-items: flex-start; }
.leaf h3 { margin: 0; flex: 1; min-width: 0; font-family: var(--f-book); font-weight: 700; font-size: 17px; line-height: 1.45; letter-spacing: .02em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.leaf .x { font-size: 18px; line-height: 1; padding: 2px 4px; color: var(--pencil); }
.leaf .seg { border-bottom: .5px solid var(--ink); padding-bottom: 4px; }
.leaf .lfoot { display: flex; align-items: center; justify-content: center; gap: 4px; border-top: .5px solid var(--rule); padding-top: 3px; flex: none; min-height: 30px; }
.fields { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 11.5px; flex: none; }
.fields dt { color: var(--pencil); white-space: nowrap; font-size: 10.5px; }
.fields dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.fields dd.hand { font-family: var(--f-book); font-weight: 700; font-size: 13px; }
.fields a, .notebody a { color: var(--ink-blue); }
.notebody { flex: 1; min-height: 0; overflow: hidden; position: relative; font-family: var(--f-book); font-size: 13px; line-height: 1.75; }
.nb { display: block; margin: 0 0 3px; overflow-wrap: anywhere; }
.nb.h { font-weight: 700; font-size: 15px; margin-top: 8px; padding-bottom: 1px; border-bottom: .5px solid var(--ink); letter-spacing: .03em; }
.nb.h3 { font-size: 13.5px; border-bottom-style: dotted; }
.nb.todo { display: grid; grid-template-columns: 20px 1fr; gap: 6px; align-items: start; text-align: left; width: 100%; }
.nb.todo .box { width: 15px; height: 15px; font-size: 12px; margin-top: 4px; }
.nb.todo.done span:last-child { text-decoration: line-through; text-decoration-color: var(--stamp); color: var(--pencil); }
.nb.li { padding-left: 1em; text-indent: -1em; }
.nb.li::before { content: "・"; color: var(--pencil); }
.nb.quote { border-left: 2px solid var(--rule); padding-left: 8px; color: var(--pencil); }
.nb.callout { border-top: .5px solid var(--ink); border-bottom: .5px solid var(--ink); padding: 3px 4px; }
.nb.tog { text-align: left; width: 100%; color: var(--ink-blue); }
.nb.tbl { font-family: var(--f-ui); font-size: 10.5px; line-height: 1.5; border-top: .5px solid var(--ink); border-bottom: .5px solid var(--ink); }
.nb.tbl span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: .5px dotted var(--rule); }
.nb.code { font-family: ui-monospace, Menlo, monospace; font-size: 10px; background: var(--paper-2); padding: 3px 5px; white-space: pre-wrap; line-height: 1.5; }
.nb.media, .nb.muted { color: var(--pencil); font-size: 11px; }
.write { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.write textarea { flex: 1; min-height: 80px; resize: none; border: 0; padding: 0 2px; background: transparent; font-family: var(--f-book); font-size: 14px; line-height: 28px;
  background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px); background-attachment: local; }
.write .note { font-size: 10px; color: var(--pencil); }

    ["🏠 暮らし・家", [["53881991-7268-41b5-8954-2bc4b2bf1971"], ["21f62844-acbe-80cc-954c-000b57ae3e36"], ["21c62844-acbe-8069-a125-000b4743c5ee"], ["26662844-acbe-809b-90c7-000b31d5490a"], ["26762844-acbe-80ae-8a01-000b00110193"], ["4c30681e-8563-4044-9fc5-134d695a41eb", "DB_ワードローブ"]]],

    ["📝 記録・趣味", [["f9332496-b396-44cd-af45-e682ff4fcc8c"], ["23362844-acbe-80b5-a2b4-000b59e31cdf"], ["f22b94dd-2a47-419a-95cf-e406837e8e5e"], ["1730d2d3-32fc-45e9-944e-fe9b801909a5", "DB_体組成ログ"], ["22062844-acbe-8035-af00-000b3af97d3f"], ["24162844-acbe-807c-91bf-000b82be8aa2"]]],
    ["☕ コーヒー", [["21162844-acbe-801d-9540-000bac4ca660"], ["25c62844-acbe-8002-9cb0-000b18e69fd9"], ["25c62844-acbe-80c4-9230-000b4ed3899b"], ["599ef279-52ad-48d7-bdb3-f079103046da"], ["25c62844-acbe-8094-abdf-000b0a334597"], ["33062844-acbe-81c5-85d5-000b725a6493"], ["22762844-acbe-805f-a401-000bbd4241e7"]]],
    ["📰 ニュース・日記", [["62ba6b9f-d216-49d8-96b2-cf2ce0e09cdd", "DB_ニュース"], ["2eaf269b-813f-4f1f-a980-e57602b1f99d", "DB_ジャーナル"]]],
  ];
  const SECTION_COLORS = ["--ink-blue", "--proj", "--stamp", "--inbox", "--today", "--wait", "--good", "--next", "--plan", "--ai", "--pencil"];
  const SECRET = /パスワード|password|passwd|pass|PIN|暗証|秘密|secret|token|キー|コード番号/i;
  const TODO_HEAD = /^#{1,3}\s*(?:☑️\s*)?(?:ToDo|やること)\s*$/i;

  // ================= 状態 =================
  const S = {
    mode: "loading", // loading | live | demo
    tab: "where", lane: "today",
    tasks: [], projects: [], doneToday: 0, inboxMore: false, struck: new Set(),
    page: {}, filter: { plan: null, inbox: null, proj: "🔥 進行中", ai: "💭" },
    nextIdx: 0, error: null, loadedAt: null,
    dbs: [], dbSec: null, dbOpen: null, dbRows: [], dbSchema: null, dbQuery: "", dbErr: null, dbLoading: false,
    leaf: null, // 開いているページ { kind, id, url, title, view, body, bodyErr, open:Set, pg, write }
  };
  const known = new Map(); // id → タスク（書き込みは読み込んだ行・開いたページだけ）

  // ================= 小道具 =================
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const jst = (ms = Date.now()) => new Date(ms + 9 * 3600e3).toISOString().slice(0, 10);
  const TODAY = () => jst();
  const addDays = (d, n) => { const x = new Date(`${d}T00:00:00Z`); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  const addMonths = (d, n) => { const x = new Date(`${d}T00:00:00Z`); x.setUTCMonth(x.getUTCMonth() + n); return x.toISOString().slice(0, 10); };
  const dow = (d) => new Date(`${d}T00:00:00Z`).getUTCDay();
  const diffDays = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400e3);
  const WD = "日月火水木金土";
  const md = (d) => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
  const idOf = (url) => (String(url || "").replace(/-/g, "").match(/([0-9a-f]{32})(?:\?|$|#)/i) || [])[1]?.toLowerCase() || "";
  const isRef = (v) => typeof v === "string" && /^(formula|rollup)Result:\/\/|^<omitted/.test(v);
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(`${STORE}:${k}`)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(`${STORE}:${k}`, JSON.stringify(v)); } catch { /* 保存できなくても動く */ } },
  };
  const decode = (s) => s.replace(/&(lt|gt|amp|quot|#39|nbsp);/g, (_, e) => ({ lt: "<", gt: ">", amp: "&", quot: '"', "#39": "'", nbsp: " " })[e]);
  function text(v) {
    if (v == null || isRef(v)) return "";
    if (typeof v !== "string") return String(v);
    return decode(v.replace(/<date start="([^"]+)"[^>]*\/>/g, (_, d) => md(d)).replace(/<mention[^>]*>([^<]*)<\/mention>/g, "$1").replace(/<mention[^>]*\/>/g, "↗").replace(/<br\s*\/?>/g, " ")
      .replace(/<[^>]+>/g, "").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, "$1").replace(/\\([_*[\]|<>])/g, "$1").replace(/\*\*([^*]+)\*\*/g, "$1")).trim();
  }
  // 本文の1行を、太字・リンクだけ残して表示用にする
  function inline(s) {
    let h = esc(decode(String(s).replace(/<date start="([^"]+)"[^>]*\/>/g, (_, d) => md(d)).replace(/<mention[^>]*>([^<]*)<\/mention>/g, "↗$1").replace(/<mention[^>]*\/>/g, "↗")
      .replace(/<br\s*\/?>/g, " ").replace(/<(?!\/?b>)[^>]+>/g, "").replace(/\\([_*[\]|<>])/g, "$1")));
    h = h.replace(/&lt;(\/?)b&gt;/g, "<$1b>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
    return h;
  }
  function list(v) {
    if (Array.isArray(v)) return v;
    if (typeof v === "string" && v.startsWith("[")) { try { const a = JSON.parse(v); if (Array.isArray(a)) return a; } catch { /* 文字のまま */ } }
    return null;
  }
  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
  }

  // ================= MCP =================
  let mcpP = null;
  // 表示直後は window.claude がまだ無いことがあるので少し待つ
  function getMcp() {
    if (!mcpP) mcpP = (async () => {
      for (let i = 0; i < 30 && !window.claude?.use; i++) await sleep(100);
      return window.claude?.use ? window.claude.use("mcp") : null;
    })().catch(() => null);
    return mcpP;
  }
  const TOOL = { fetch: "notion-fetch", query: "notion-query-data-sources", update: "notion-update-page", create: "notion-create-pages" };
  async function call(kind, input, { read = true } = {}) {
    const mcp = await getMcp();
    if (!mcp) throw Object.assign(new Error("no-mcp"), { code: "not_granted" });
    for (let attempt = 0; ; attempt++) {
      try {
        const res = await mcp.callTool(SERVER, TOOL[kind], input, read ? undefined : { cache: false });
        return res.payload ?? res;
      } catch (err) {
        if (read && attempt === 0 && err?.retryable) { await sleep((err.retryAfterMs ?? 800) + Math.random() * 400); continue; }
        throw err;
      }
    }
  }
  function errText(err) {
    return ({
      needs_reauth: "Notion の連携が切れています。claude.ai の 設定 → コネクタ で Notion を再接続してください",
      server_not_connected: "Notion 連携がありません。claude.ai の 設定 → コネクタ で Notion を追加してください",
      selection_required: "Notion 連携が複数あります。表示された確認でどれを使うか選んでください",
      not_in_manifest: "このページで Notion の利用が許可されていません。ページの権限から Notion を許可してください",
      approval_required: "Notion の利用を許可してください（確認が出たら「許可」）",
      consent_required: "Notion の利用を許可してください（確認が出たら「許可」）",
      blocked_by_policy: "組織の設定で Notion 連携が使えません",
      server_unavailable: "Notion の返事がありません。反映されたかもしれないので「更新」で確かめてください",
      rate_limited: "Notion が混み合っています。少し待ってから「更新」してください",
      tool_error: `Notion がエラーを返しました（${String(err?.message || "").slice(0, 70)}）`,
    })[err?.code] || "Notion との通信でエラーが起きました。「更新」でやり直してください";
  }
  const statusFilter = (s) => ({ type: "property", property: "ステータス", propertyType: "status", operator: "status_is", value: { type: "is_option", value: s } });
  async function rows(ds, { filters, sort, limit = 100 } = {}) {
    const data = { mode: "rows", data_source_url: `collection://${ds}`, limit };
    if (filters?.length) data.filter = { type: "group", operator: "and", filters };
    if (sort) data.sort = sort;
    const res = await call("query", { data });
    return { results: res.results || [], more: !!res.has_more };
  }

  // ================= タスク =================
  function toTask(r) {
    const t = {
      id: idOf(r.url), url: r.url, name: text(r["名前"]) || "（無題）", next: text(r.NEXT), status: r["ステータス"] || ST.inbox,

      projects: (list(r["プロジェクト"]) || []).map(idOf).filter(Boolean), link: text(r["userDefined:URL"]),
    };
    known.set(t.id, t);
    return t;
  }
  // 1 今日やる：実行日が今日以前 ／ 2 予定あり：実行日が明日以降 ／ 3 次にやる：NEXT・DOINGで日付なし
  // 4 倉庫：INBOX（とSOMEDAY）で日付なし ／ 5 待ち：WAITING ／ 6 プロジェクト：DB_プロジェクト
  function laneOf(t, today = TODAY()) {
    if (t.status === ST.done || t.status === ST.ref) return null;
    if (t.status === ST.ai) return "ai";
    if (t.status === ST.wait) return "wait";
    if (t.date) return t.date <= today ? "today" : "plan";
    if (t.status === ST.next || t.status === ST.doing) return "next";
    return "inbox";
  }
  const inLane = (k) => S.tasks.filter((t) => laneOf(t) === k);
  const saveSnap = () => store.set("snap", { at: S.loadedAt, tasks: S.tasks, projects: S.projects, doneToday: S.doneToday, inboxMore: S.inboxMore });

  async function loadLive() {
    const sortEdited = [{ property: "最終更新日時", direction: "descending" }];
    const jobs = OPEN_STATUSES.map((s) => rows(TASK_DS, { filters: [statusFilter(s)], sort: sortEdited }));
    jobs.push(rows(TASK_DS, {
      filters: [statusFilter(ST.done), { type: "property", property: "実行日", propertyType: "date", operator: "date_is", value: { type: "relative", value: "today" } }], limit: 50,
    }));
    jobs.push(rows(PROJ_DS, { limit: 100 }));
    const out = await Promise.all(jobs);
    known.clear(); S.struck.clear();
    S.tasks = out.slice(0, OPEN_STATUSES.length).flatMap((o) => o.results.map(toTask));
    S.inboxMore = out[OPEN_STATUSES.indexOf(ST.inbox)].more;

  // ================= 書き込み：プロパティ =================
  const ACTIONS = {
    done: { label: "✓ 完了", props: () => ({ "ステータス": ST.done }), msg: "済みにしました" },

    weekend: { label: "週末", props: () => { const d = TODAY(); return dateProps(addDays(d, (6 - dow(d) + 7) % 7 || 7)); }, msg: "週末（土）に移しました" },
    nodate: { label: "日付を消す", props: () => ({ "date:実行日:start": null }), msg: "日付を消しました" },
    adopt: { label: "次にやるへ", props: () => ({ "ステータス": ST.next }), msg: "NEXTにしました" },
    wait: { label: "待ち", props: () => ({ "ステータス": ST.wait, "date:実行日:start": null }), msg: "待ちにしました（日付は消しました）" },
    someday: { label: "保留", props: () => ({ "ステータス": ST.some, ...dateProps(addMonths(TODAY(), 1)) }), msg: "保留にしました（見直しは1か月後）" },
    ref: { label: "資料へ", props: () => ({ "ステータス": ST.ref }), msg: "REFERENCEにしました" },
    research: { label: "AIに調べて", props: () => ({ "ステータス": ST.ai, "AIアクション": "🔍" }), msg: "AIに預けました（🔍）" },
  };
  function dateProps(d) { return { "date:実行日:start": d, "date:実行日:is_datetime": 0 }; }
  function applyLocal(t, props) {
    if ("ステータス" in props) t.status = props["ステータス"];
    if ("AIアクション" in props) t.ai = props["AIアクション"];
    if ("date:実行日:start" in props) t.date = props["date:実行日:start"];
    if ("NEXT" in props) t.next = props.NEXT;
  }
  async function act(id, key) {
    const t = known.get(id); const a = ACTIONS[key];
    if (!t || !a) return;
    const before = { status: t.status, ai: t.ai, date: t.date };
    const props = a.props();
    const countsToday = key === "done" && before.date && before.date <= TODAY();
    if (key === "done") { S.struck.add(id); render(); await sleep(420); S.struck.delete(id); }
    applyLocal(t, props);
    if (countsToday) S.doneToday++;
    closeSheet(); render();
    if (S.mode === "demo") { toast(`${a.msg}（見本なので Notion は変わりません）`); return; }
    try {
      await call("update", { page_id: id, command: "update_properties", properties: props, allow_async: false }, { read: false });
      toast(a.msg); saveSnap();
    } catch (err) {
      Object.assign(t, before);
      if (countsToday) S.doneToday--;
      render(); toast(errText(err));
    }
  }


  // ================= 頁送り =================
  // 1画面＝1頁。いまの頁を S.ctx に持ち、最後の頁の次は次の章（区分）へ進む
  const KANJI = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二"];
  function pageOf(key, items, per) {
    const pages = Math.max(1, Math.ceil(items.length / per));
    if (S.enterLast) S.page[key] = pages - 1;
    const p = Math.min(S.page[key] || 0, pages - 1);
    S.page[key] = p;
    return { slice: items.slice(p * per, p * per + per), p, pages };
  }
  // 枠の高さから1頁の件数を出して描く
  function paged(pane, key, items, { sel = ".list", unit = 38, gap = 0, cols = 1, draw }) {
    const box = $(sel, pane);
    const per = Math.max(1, Math.floor((box.clientHeight + gap) / (unit + gap))) * cols;
    const { slice, p, pages } = pageOf(key, items, per);
    box.innerHTML = slice.map(draw).join("");
    S.ctx = { p, pages, set: (n) => { S.page[key] = n; } };
  }
  // 章の並び：本編＝6区分、付録＝AIの4つ、索引＝節
  function chapters() {
    if (S.tab === "where") return { list: LANES.map((l) => l.key), cur: S.lane, set: (k) => { S.lane = k; } };
    if (S.tab === "ai") return { list: AI_SEGS.map((s) => s[0]), cur: S.filter.ai, set: (k) => { S.filter.ai = k; } };
    if (S.tab === "db" && !S.dbOpen) { const secs = [...new Set(S.dbs.map((d) => d.sec))]; return { list: secs, cur: S.dbSec, set: (k) => { S.dbSec = k; } }; }
    return null;
  }
  function canGo(d) {
    const c = S.ctx; if (!c) return false;
    if (c.p + d >= 0 && c.p + d < c.pages) return true;
    const ch = chapters(); if (!ch) return false;
    const i = ch.list.indexOf(ch.cur) + d;
    return i >= 0 && i < ch.list.length;
  }
  function go(d) {
    const c = S.ctx;
    if (c.p + d >= 0 && c.p + d < c.pages) { c.set(c.p + d); render(); return; }
    const ch = chapters(); const i = ch.list.indexOf(ch.cur) + d;
    ch.set(ch.list[i]);
    if (d < 0) S.enterLast = true; // 前の章へ戻るときはその章の最後の頁を開く
    render();
  }

  // ================= めくる =================
  // 古い頁の写しを3Dで回す。指に合わせて途中まで回し、離したら最後までめくる（足りなければ戻す）
  const flip = (() => {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const KIND = {
      main: { el: () => $("#main .pane"), can: canGo, go },
      leaf: { el: () => $("#sheet .leaf"), can: (d) => !!S.leaf?.pages && S.leaf.pg + d >= 0 && S.leaf.pg + d < S.leaf.pages, go: (d) => { S.leaf.pg += d; drawLeaf(); } },
    };
    function wrap(r, cls = "") {
      const w = document.createElement("div"); w.className = `flipwrap ${cls}`;
      Object.assign(w.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px` });
      document.body.append(w); return w;
    }
    function copy(el) { const c = el.cloneNode(true); c.removeAttribute("id"); c.querySelectorAll("[id]").forEach((x) => x.removeAttribute("id")); return c; }
    function leafOf(r, node) {
      const w = wrap(r);
      const leaf = document.createElement("div"); leaf.className = "flipleaf";
      const front = document.createElement("div"); front.className = "face front"; front.append(node);
      const shade = document.createElement("div"); shade.className = "shade"; front.append(shade);
      const curl = document.createElement("div"); curl.className = "curl"; front.append(curl);
      const back = document.createElement("div"); back.className = "face back";
      leaf.append(front, back); w.append(leaf);
      return { w, leaf, shade };
    }
    function begin(kind, dir) {
      const K = KIND[kind];
      if (!K.can(dir)) return null;
      const el = K.el(); if (!el) return null;
      const r = el.getBoundingClientRect();
      const old = copy(el);
      K.go(dir);
      if (reduce) return { set() {}, finish() {} };
      const nel = K.el();
      let under = null, us = null, L;
      if (dir > 0) {
        L = leafOf(r, old); // 今の頁を左へめくる。下には次の頁（本物）が見える
        us = document.createElement("div"); us.className = "under-shadow"; nel?.append(us);
      } else {
        under = wrap(r, "under"); under.append(old); // 前の頁が左から戻ってくる。下には今の頁の写し
        us = document.createElement("div"); us.className = "under-shadow"; under.append(us);
        L = leafOf(r, copy(nel));
      }
      let prog = 0;
      const ctl = {
        set(v) {
          prog = Math.max(0, Math.min(1, v));
          const a = dir > 0 ? -180 * prog : -180 * (1 - prog);
          L.leaf.style.transform = `rotateY(${a}deg)`;
          L.shade.style.opacity = String(Math.sin((-a * Math.PI) / 180) * 0.9);
          us.style.opacity = String(dir > 0 ? 1 - prog : prog);
        },
        finish(ok) {
          const ms = Math.round(320 * (ok ? 1 - prog : prog) + 120);
          L.leaf.style.transition = `transform ${ms}ms cubic-bezier(.3,.7,.3,1)`;
          L.shade.style.transition = us.style.transition = `opacity ${ms}ms linear`;
          requestAnimationFrame(() => ctl.set(ok ? 1 : 0));
          setTimeout(() => {
            L.w.remove(); under?.remove(); us.remove();
            if (!ok) { S.enterLast = false; KIND[kind].go(-dir); } // 戻したときは元の頁を描き直す
          }, ms + 30);
        },
      };
      ctl.set(0);
      return ctl;
    }
    function turn(kind, dir) { const c = begin(kind, dir); if (c) requestAnimationFrame(() => c.finish(true)); }

    // 指（マウス）でめくる
    let g = null, suppress = false;
    function down(kind) {
      return (e) => {
        if (e.button > 0 || e.target.closest("input, textarea")) return;
        g = { kind, x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId, ctl: null, w: KIND[kind].el()?.getBoundingClientRect().width || 300, dead: false };
      };
    }
    function move(e) {
      if (!g || e.pointerId !== g.id || g.dead) return;
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (!g.ctl) {
        if (Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx)) { g.dead = true; return; }
        if (Math.abs(dx) < 12) return;
        g.dir = dx < 0 ? 1 : -1;
        g.ctl = begin(g.kind, g.dir);
        if (!g.ctl) { g.dead = true; return; }
        try { e.target.setPointerCapture?.(g.id); } catch { /* なくてもよい */ }
      }
      g.ctl.set((g.dir > 0 ? -dx : dx) / (g.w * 0.85));
      g.last = { x: e.clientX, t: performance.now() };
    }
    function up(e) {
      if (!g || e.pointerId !== g.id) return;
      const c = g.ctl;
      if (c) {
        const dx = e.clientX - g.x; const dt = performance.now() - g.t;
        const prog = (g.dir > 0 ? -dx : dx) / (g.w * 0.85);
        const fast = Math.abs(dx) / Math.max(dt, 1) > 0.45 && Math.sign(-dx) === g.dir;
        c.finish(prog > 0.3 || fast);
        suppress = true; setTimeout(() => { suppress = false; }, 350);
      }
      g = null;
    }
    function cancel() { if (g?.ctl) g.ctl.finish(false); g = null; }
    return { turn, down, move, up, cancel, get suppress() { return suppress; } };
  })();

  // ================= 描画 =================
  const main = $("#main");
  const AI_SEGS = [["💭", "回答待ち", (t) => t.ai === "💭"], ["🔍✅", "判定待ち", (t) => t.ai === "🔍✅"], ["⚙️", "AIの番", (t) => ["🔍", "🔬", "💬"].includes(t.ai)], ["・", "印なし", (t) => !t.ai]];
  function render() {
    const d = TODAY();
    $("#date").textContent = `${+d.slice(5, 7)}月${+d.slice(8)}日（${WD[dow(d)]}）`;
    for (const b of document.querySelectorAll(".foot nav button")) b.setAttribute("aria-pressed", String(b.dataset.tab === S.tab));
    $("#ai-n").textContent = S.mode === "loading" && !S.tasks.length ? "" : String(inLane("ai").length);
    $("#db-n").textContent = S.dbs.length ? String(S.dbs.length) : "";
    document.body.classList.toggle("loading", S.mode === "loading");
    renderThumbs();
    main.innerHTML = "";
    const pane = document.createElement("div");
    pane.className = "pane";
    main.append(pane);
    S.ctx = { p: 0, pages: 1, set() {} };
    if (S.tab === "db") S.dbOpen ? renderDb(pane) : renderIndex(pane);
    else if (S.mode === "loading" && !S.tasks.length) pane.innerHTML = `<div class="empty">Notion から DB_タスク管理 を写しています…</div>`;
    else {
      if (S.error) pane.insertAdjacentHTML("beforeend", `<div class="banner err">${esc(S.error)}</div>`);
      if (S.mode === "demo") pane.insertAdjacentHTML("beforeend", `<div class="banner">見本です（Notion につながっていません）。claude.ai で開くと自分のタスクが出ます</div>`);
      if (S.tab === "ai") renderAi(pane);
      else ({ today: renderToday, plan: renderPlan, next: renderNext, inbox: renderInbox, wait: renderWait, proj: renderProj })[S.lane](pane);
    }
    S.enterLast = false;
    renderFolio();
  }
  function renderFolio() {
    const c = S.ctx;
    const ch = chapters();
    const chapNo = ch ? `${KANJI[ch.list.indexOf(ch.cur)] || ""}章 ` : "";
    $("#folio").textContent = `${S.tab === "db" && !S.dbOpen ? "" : chapNo}${c.p + 1} / ${c.pages}`;
    $("#prev").disabled = !canGo(-1);
    $("#next").disabled = !canGo(1);
  }

  function renderThumbs() {
    const on = S.tab === "where";
    $("#thumbs").hidden = !on; $("#page").classList.toggle("thumbs", on);
    if (!on) return;
    const today = TODAY();
    $("#thumbs").innerHTML = LANES.map((l, i) => {
      const n = S.mode === "loading" && !S.tasks.length ? "–" : l.key === "proj" ? S.projects.filter((p) => p.status.includes("進行中")).length : inLane(l.key).length;
      const late = l.key === "today" ? inLane("today").filter((t) => t.date < today).length : 0;
      return `<button type="button" class="thumb" data-lane="${l.key}" style="--c:var(${l.color})" aria-pressed="${S.lane === l.key}" aria-label="第${KANJI[i]}章 ${l.label} ${n}件">
        <b>${KANJI[i]}</b><span>${n}</span>${late ? `<span class="ov">+${late}</span>` : ""}</button>`;
    }).join("");
  }

  function wakuTag(t) { return `<span class="tag">${esc(WAKU[t.waku] || "—")}</span>`; }
  function weight(t) { return t.weight ? `<span class="w ${t.weight}">${t.weight}</span>` : ""; }
  function dateMark(t, today = TODAY()) {
    if (!t.date) return "";
    const d = diffDays(today, t.date);
    if (d < 0) return `<span class="stamp">${-d}日遅れ</span>`;
    if (d === 0) return `<span class="date-ink">今日</span>`;
    return `<span class="date-ink">${md(t.date)}(${WD[dow(t.date)]})</span>`;
  }
  function projName(t) { const p = S.projects.find((x) => t.projects.includes(x.id)); return p ? `🎯${p.name}` : ""; }
  function subLine(t) { return [t.next, projName(t)].filter(Boolean).join("　"); }
  function taskRow(t, { side = "", lead = wakuTag(t), check = false } = {}) {
    return `<div class="row${S.struck.has(t.id) ? " struck" : ""}" role="button" tabindex="0" data-open="${t.id}">${lead}<span class="txt"><span class="nm">${esc(t.name)}</span><span class="sub">${esc(subLine(t) || t.tag || "")}</span></span>
      <span class="side">${side}${weight(t)}${check ? `<button type="button" class="box${S.struck.has(t.id) ? " on" : ""}" data-act="done" data-id="${t.id}" aria-label="済みにする">✓</button>` : ""}</span></div>`;
  }
  function chap(key, hint = "", extra = "") {
    const i = LANES.findIndex((l) => l.key === key);
    return `<div class="chap"><span class="no">第${KANJI[i]}章</span><h2>${LANES[i].label}</h2><span class="hint">${hint}</span>${extra}</div>`;
  }

  // 第一章 今日やる：いまやる1件を大きく、あとは枠の順
  function renderToday(pane) {
    const today = TODAY();
    const items = inLane("today").sort((a, b) => (a.date < today) - (b.date < today) || WAKU_ORDER.indexOf(a.waku) - WAKU_ORDER.indexOf(b.waku) || (a.date || "").localeCompare(b.date || ""));
    const total = items.length + S.doneToday;
    const pct = total ? Math.round((S.doneToday / total) * 100) : 0;
    const late = items.filter((t) => t.date < today).length;
    pane.insertAdjacentHTML("beforeend", chap("today", `済み ${S.doneToday} / ${total}　${pct}%${late ? `　遅れ ${late}` : ""}`) + `<div class="meter" style="flex:none"><i style="width:${pct}%"></i></div>`);
    if (!items.length) { pane.insertAdjacentHTML("beforeend", `<div class="empty">今日の頁は白紙です。第三章「次にやる」から選んで「今日」にできます</div>`); return; }
    const f = items[0];
    pane.insertAdjacentHTML("beforeend", `<div class="lead"><div class="k">いまやる　${dateMark(f)}${weight(f)}<span>${esc(f.waku || "")}</span></div>
      <div class="t" data-open="${f.id}" role="button" tabindex="0">${esc(f.name)}</div>${f.next ? `<div class="nx">${esc(f.next)}</div>` : ""}
      <div class="acts"><button type="button" class="pri" data-act="done" data-id="${f.id}">✓ 済み</button><button type="button" data-act="tomorrow" data-id="${f.id}">明日へ</button><button type="button" data-act="nodate" data-id="${f.id}">日付を消す</button><button type="button" class="quiet" data-open="${f.id}">開く</button></div></div>
      <div class="list"></div>`);
    paged(pane, "today", items.slice(1), { draw: (t) => taskRow(t, { side: t.date < today ? dateMark(t) : "", check: true }) });
  }

  // 第二章 予定あり：2週間の暦＋日付順
  function renderPlan(pane) {
    const today = TODAY();
    const items = inLane("plan").sort((a, b) => a.date.localeCompare(b.date));
    const days = Array.from({ length: 14 }, (_, i) => addDays(today, i + 1));
    const later = items.filter((t) => t.date > days[13]).length;
    const sel = S.filter.plan;
    pane.insertAdjacentHTML("beforeend", chap("plan", sel ? `${md(sel)}(${WD[dow(sel)]}) の予定` : `明日から2週間${later ? `＋その先 ${later}件` : ""}`, sel ? `<button type="button" class="back" data-planday="">すべて</button>` : "")
      + `<div class="cal">${days.map((d) => {
        const n = items.filter((t) => t.date === d).length;
        return `<button type="button" class="${dow(d) === 0 ? "sun" : dow(d) === 6 ? "sat" : ""}" data-planday="${d}" aria-pressed="${sel === d}" aria-label="${md(d)} ${n}件">
          <span class="d">${+d.slice(8)}<small>${WD[dow(d)]}</small></span><span class="dots">${"<i></i>".repeat(Math.min(n, 4))}</span></button>`;
      }).join("")}</div><div class="list"></div>`);
    const shown = sel ? items.filter((t) => t.date === sel) : items;
    if (!shown.length) { $(".list", pane).outerHTML = `<div class="empty">${sel ? "この日は空いています" : "日付の入った予定はありません"}</div>`; return; }
    paged(pane, `plan:${sel || ""}`, shown, { draw: (t) => taskRow(t, { lead: `<span class="tag"><span>${WD[dow(t.date)]}<br><span class="num">${md(t.date)}</span></span></span>` }) });
  }

  // 第三章 次にやる：1頁に1件。古いものから順にめくって振り分ける
  function renderNext(pane) {
    const items = inLane("next").sort((a, b) => (a.edited || "").localeCompare(b.edited || ""));
    if (!items.length) { pane.insertAdjacentHTML("beforeend", chap("next") + `<div class="empty">次にやるは空です</div>`); return; }
    if (S.enterLast) S.nextIdx = items.length - 1;
    if (S.nextIdx >= items.length) S.nextIdx = items.length - 1;
    const t = items[S.nextIdx];
    const age = t.edited ? diffDays(jst(Date.parse(t.edited)), TODAY()) : null;
    const after = items.slice(S.nextIdx + 1, S.nextIdx + 3);
    pane.insertAdjacentHTML("beforeend", chap("next", "古いものから1件ずつ")
      + `<div class="leafcard"><div class="k"><span>${esc(t.status)}</span><span>${esc(t.waku || "枠なし")}</span>${weight(t)}${age != null ? (age > 14 ? `<span class="stamp">${age}日そのまま</span>` : `<span>${age}日前に更新</span>`) : ""}</div>
        <div class="t" data-open="${t.id}" role="button" tabindex="0">${esc(t.name)}</div>${t.next ? `<div class="nx">${esc(t.next)}</div>` : ""}
        ${projName(t) ? `<div class="k">${esc(projName(t))}</div>` : ""}
        <div class="grid4"><button type="button" class="pri" data-act="today" data-id="${t.id}">今日</button><button type="button" data-act="tomorrow" data-id="${t.id}">明日</button><button type="button" data-act="weekend" data-id="${t.id}">週末</button><button type="button" data-act="done" data-id="${t.id}">✓ 済み</button>
        <button type="button" data-act="wait" data-id="${t.id}">待ち</button><button type="button" data-act="someday" data-id="${t.id}">保留</button><button type="button" data-act="ref" data-id="${t.id}">資料へ</button><button type="button" data-open="${t.id}">開く</button></div></div>
      ${after.length ? `<div class="after"><h3>次の頁から</h3>${after.map((x) => taskRow(x)).join("")}</div>` : ""}`);
    S.ctx = { p: S.nextIdx, pages: items.length, set: (n) => { S.nextIdx = n; } };
  }

  // 第四章 倉庫：辞書の見出し語のような2段組
  function renderInbox(pane) {
    const all = inLane("inbox").sort((a, b) => (b.edited || "").localeCompare(a.edited || ""));
    const counts = {};
    for (const t of all) counts[t.tag || "未分類"] = (counts[t.tag || "未分類"] || 0) + 1;
    const tags = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 9);
    const sel = S.filter.inbox;
    const items = sel ? all.filter((t) => (t.tag || "未分類") === sel) : all;
    pane.insertAdjacentHTML("beforeend", chap("inbox", `INBOX・日付なし　新しい順${S.inboxMore ? "（最近の100件）" : ""}`)
      + `<div class="seg"><button type="button" data-inbox="" aria-pressed="${!sel}">全部<span class="n">${all.length}</span></button>${tags.map(([k, n]) => `<button type="button" data-inbox="${esc(k)}" aria-pressed="${sel === k}">${esc(k)}<span class="n">${n}</span></button>`).join("")}</div>
      <div class="tiles"></div>`);
    if (!items.length) { $(".tiles", pane).outerHTML = `<div class="empty">倉庫は空です</div>`; return; }
    paged(pane, `inbox:${sel || ""}`, items, {
      sel: ".tiles", unit: 46, gap: 0, cols: 2,
      draw: (t) => `<button type="button" class="tile" data-open="${t.id}" style="--tc:var(${TAG_COLOR[t.tag] || "--inbox"})"><span class="nm">${esc(t.name)}</span>
        <span class="mt"><span>${esc(t.tag || "未分類")}</span>${t.weight ? `<span>${t.weight}</span>` : ""}${t.status === ST.some ? "<span>保留</span>" : ""}${t.edited ? `<span class="num">${md(jst(Date.parse(t.edited)))}</span>` : ""}</span></button>`,
    });
  }

  // 第五章 待ち：待っている日数が長い順
  function renderWait(pane) {
    const today = TODAY();
    const items = inLane("wait").map((t) => ({ t, d: t.edited ? diffDays(jst(Date.parse(t.edited)), today) : 0 })).sort((a, b) => b.d - a.d);
    const max = Math.max(14, ...items.map((x) => x.d));
    pane.insertAdjacentHTML("beforeend", chap("wait", "最後に動いてからの日数") + `<div class="list"></div>`);
    if (!items.length) { $(".list", pane).outerHTML = `<div class="empty">待っているものはありません</div>`; return; }
    paged(pane, "wait", items, {
      draw: ({ t, d }) => taskRow(t, { side: `<span class="age"><span class="v">${d}日</span><span class="b"><i style="width:${Math.round((d / max) * 100)}%"></i></span></span>` }),
    });
  }

  // 第六章 プロジェクト
  function projStats(p) {
    const open = S.tasks.filter((t) => t.projects.includes(p.id) && t.status !== ST.done && t.status !== ST.ref);
    const done = Math.max(0, p.total - open.length);
    return { open, done, pct: p.total ? Math.round((done / p.total) * 100) : 0 };
  }
  function renderProj(pane) {
    const groups = ["🔥 進行中", "⏸ 保留", "💡 いつか", "✅ 完了"];
    const counts = Object.fromEntries(groups.map((g) => [g, S.projects.filter((p) => p.status === g).length]));
    const sel = S.filter.proj;
    const items = S.projects.filter((p) => p.status === sel).sort((a, b) => (b.edited || "").localeCompare(a.edited || ""));
    pane.insertAdjacentHTML("beforeend", chap("proj", "DB_プロジェクト")
      + `<div class="seg">${groups.map((g) => `<button type="button" data-proj="${g}" aria-pressed="${sel === g}">${g}<span class="n">${counts[g]}</span></button>`).join("")}</div><div class="cards"></div>`);
    if (!items.length) { $(".cards", pane).outerHTML = `<div class="empty">このステータスのプロジェクトはありません</div>`; return; }
    paged(pane, `proj:${sel}`, items, {
      sel: ".cards", unit: 92, gap: 6, cols: 2,
      draw: (p) => {
        const s = projStats(p);
        const doing = s.open.filter((t) => t.status === ST.doing || t.status === ST.next).length;
        return `<button type="button" class="card" data-proj-open="${p.id}"><span class="nm">${esc(p.name)}</span>
          <span class="st"><span>残り ${s.open.length}${doing ? `・着手 ${doing}` : ""}</span><span class="num">${s.done}/${p.total}</span></span>

  // ================= 索引（すべてのDB） =================
  function initDbs() {
    const names = store.get("dbnames") || {};
    S.dbs = SECTIONS.flatMap(([sec, items], i) => items.map(([id, name]) => ({ id, name: name || names[id] || "", sec, color: SECTION_COLORS[i % SECTION_COLORS.length] })));
  }
  async function refreshDbList() {
    try {
      const res = await call("fetch", { id: DB_PAGE });
      const body = String(res.text || "");
      const out = []; let sec = "その他"; let ci = 0; const colorOf = {};
      const re = /<h2[^>]*>\s*([^<]+?)\s*<\/h2>|^##\s+(.+)$|<database url="[^"]+"(?: data-source-url="collection:\/\/([0-9a-f-]+)")?[^>]*>([\s\S]*?)<\/database>/gm;
      for (const m of body.matchAll(re)) {
        if (m[1] || m[2]) { sec = (m[1] || m[2]).trim(); colorOf[sec] ??= SECTION_COLORS[ci++ % SECTION_COLORS.length]; continue; }
        if (!m[3]) continue;
        const prev = S.dbs.find((d) => d.id === m[3]);
        colorOf[sec] ??= SECTION_COLORS[ci++ % SECTION_COLORS.length];
        out.push({ id: m[3], name: text(m[4]) || prev?.name || "", sec, color: colorOf[sec] });
      }
      if (out.length >= 5) S.dbs = out;
    } catch { /* 控えの一覧のまま */ }
    if (S.tab === "db" && !S.dbOpen && !S.leaf) render();
    fillDbNames();
  }
  // 名前のないDBは1つずつ読んで名前を出す（3本ずつ・覚えておく）
  async function fillDbNames() {
    const names = store.get("dbnames") || {};
    const todo = S.dbs.filter((d) => !d.name);
    let timer;
    const later = () => { clearTimeout(timer); timer = setTimeout(() => { if (S.tab === "db" && !S.dbOpen && !S.leaf) render(); }, 300); };
    const worker = async () => {
      for (let d; (d = todo.shift());) {
        try {
          const res = await call("fetch", { id: `collection://${d.id}` });
          const m = String(res.text || "").match(/The title of this Data Source is:\s*(.+)/);
          d.name = (m ? m[1] : res.title || "").trim() || "（名前なし）";
          names[d.id] = d.name; store.set("dbnames", names);
        } catch { d.name = d.name || "（読めないDB）"; }
        later();
      }
    };
    await Promise.all([worker(), worker(), worker()]);
  }
  function renderIndex(pane) {

      + `<div class="index"><div class="idx-tabs">${secs.map(([s, c]) => `<button type="button" data-sec="${esc(s)}" style="--sc:var(${c})" aria-pressed="${s === S.dbSec}" title="${esc(s)}">${esc(s.replace(/[・（(].*$/, ""))}<span class="n">${S.dbs.filter((d) => d.sec === s).length}</span></button>`).join("")}</div>

  // ================= DB：中身を見る =================
  async function openDb(id) {
    const d = S.dbs.find((x) => x.id === id); if (!d) return;
    S.dbOpen = d; S.dbRows = []; S.dbSchema = null; S.dbErr = null; S.dbQuery = ""; S.dbLoading = true; S.page.db = 0;
    render();
    if (S.mode === "demo") { S.dbLoading = false; S.dbErr = "見本では中身を読めません（claude.ai で開くと読めます）"; render(); return; }
    try {
      const res = await call("fetch", { id: `collection://${id}` });
      const t = String(res.text || "");
      const m = t.match(/The title of this Data Source is:\s*(.+)/); if (m && !d.name) d.name = m[1].trim();
      let schema = {};
      try { schema = JSON.parse((t.match(/<data-source-state>\s*([\s\S]*?)\s*<\/data-source-state>/) || [])[1] || "{}").schema || {}; } catch { /* 列の型なしで出す */ }
      S.dbSchema = schema;
      const edited = Object.values(schema).find((p) => p.type === "last_edited_time") || Object.values(schema).find((p) => p.type === "created_time");
      let r;
      try { r = await rows(id, { sort: edited ? [{ property: edited.name, direction: "descending" }] : undefined }); }
      catch { r = await rows(id); }
      S.dbRows = r.results; S.dbMore = r.more;
    } catch (err) { S.dbErr = errText(err); }
    S.dbLoading = false;
    if (S.dbOpen === d) render();
  }
  function dbColumns() {
    const all = Object.values(S.dbSchema || {});
    const title = all.find((p) => p.type === "title")?.name || "名前";
    const extra = [];
    for (const type of ["status", "select", "date", "number", "multi_select", "checkbox", "text"]) for (const p of all) if (p.type === type && p.name !== title && !SECRET.test(p.name) && extra.length < 2) extra.push(p);
    return { title, extra };
  }
  function cell(r, p) {
    const k = p.type === "date" ? `date:${p.name}:start` : /^(url|id)$/i.test(p.name) ? `userDefined:${p.name}` : p.name;
    const v = r[k] ?? r[p.name];
    if (p.type === "checkbox") return v === "__YES__" ? "☑" : "☐";
    if (p.type === "date") return v ? md(String(v).slice(0, 10)) : "";
    const l = list(v);
    if (l) return l.every((x) => /^https?:/.test(x)) ? (l.length ? `${l.length}件` : "") : l.join("・");
    return text(v);
  }
  function renderDb(pane) {
    const d = S.dbOpen;
    pane.innerHTML = `<div class="chap"><button type="button" class="back" data-dbback="1">‹ 索引</button><h2 style="min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:15px">${esc(d.name || "DB")}</h2><span class="hint">${esc(d.sec)}</span></div>`;
    if (S.dbLoading) { pane.insertAdjacentHTML("beforeend", `<div class="empty">読み込んでいます…</div>`); return; }
    if (S.dbErr) { pane.insertAdjacentHTML("beforeend", `<div class="empty">${esc(S.dbErr)}</div>`); return; }
    const { title, extra } = dbColumns();
    const q = S.dbQuery.trim().toLowerCase();
    const items = S.dbRows.filter((r) => !q || Object.values(r).some((v) => typeof v === "string" && !isRef(v) && text(v).toLowerCase().includes(q)));
    pane.insertAdjacentHTML("beforeend", `<div class="chap"><input id="dbq" type="search" placeholder="この中を探す" value="${esc(S.dbQuery)}" aria-label="絞り込み"><span class="hint" style="flex:none">${items.length}${S.dbMore ? "（最新100件）" : "件"}</span></div><div class="list"></div>`);
    if (!items.length) { $(".list", pane).outerHTML = `<div class="empty">${q ? "当てはまる行はありません" : "行がありません"}</div>`; return; }
    paged(pane, "db", items, {
      draw: (r) => {
        const i = S.dbRows.indexOf(r);
        const sub = extra.map((p) => cell(r, p)).filter(Boolean).join("　");
        return `<div class="row" role="button" tabindex="0" data-dbrow="${i}"><span class="tag num">${i + 1}</span><span class="txt"><span class="nm">${esc(text(r[title]) || "（無題）")}</span><span class="sub">${esc(sub)}</span></span><span class="side"></span></div>`;
      },
    });
  }

  // ================= ページ（シート）：項目・本文・書く =================
  function openTask(id, view = "body") {

  }

    const { title } = dbColumns();
    S.leaf = { kind: "row", id: idOf(r.url), url: r.url, row: r, title: text(r[title]) || "（無題）", view: "body", body: null, bodyErr: null, open: new Set(), pg: 0, write: "memo" };

  function closeSheet() { S.leaf = null; $("#sheet").hidden = true; $("#sheet").innerHTML = ""; }

  async function loadBody() {
    const L = S.leaf;
    if (S.mode === "demo") { L.body = parseBody(DEMO_BODY); L.raw = DEMO_BODY; drawLeaf(); return; }
    try {
      const res = await call("fetch", { id: L.id }, { read: true });
      const t = String(res.text || "");
      const a = t.indexOf("<content>"), b = t.lastIndexOf("</content>");
      L.raw = a >= 0 && b > a ? t.slice(a + 9, b) : "";
      if (/<blank-page>/.test(t) && !L.raw) L.raw = "";
      L.body = parseBody(L.raw);
    } catch (err) { L.bodyErr = errText(err); }
    if (S.leaf === L) drawLeaf();
  }

  // Notion の本文（Markdown＋タグ）を、手帳に書き写す単位（ブロック）に分ける
  function parseBody(src) {
    const lines = String(src || "").split("\n");
    const root = []; const stack = [root]; let tog = 0;
    const push = (b) => stack[stack.length - 1].push(b);
    for (let i = 0; i < lines.length; i++) {
      const raw = lines[i]; const t = raw.trim();
      const depth = (raw.match(/^\t*/) || [""])[0].length;
      if (!t || /^<\/?(columns|column|tabs|tab)\b[^>]*>$/.test(t) || /^<table-of-contents|^<empty-block|^<p\s*\/>$/.test(t)) continue;
      let m;
      if ((m = t.match(/^<(toggle|details)\b[^>]*>(.*)$/))) {
        let label = m[2].replace(/<\/?summary>/g, "").trim();
        while (!label && i + 1 < lines.length) { label = lines[++i].trim().replace(/<\/?summary>/g, ""); }
        const b = { k: "tog", text: label, id: `t${tog++}`, kids: [], depth };
        push(b); stack.push(b.kids); continue;
      }
      if (/^<\/(toggle|details)>$/.test(t)) { if (stack.length > 1) stack.pop(); continue; }
      if (/^<callout\b/.test(t)) {
        const parts = []; while (i + 1 < lines.length && !/^\s*<\/callout>/.test(lines[i + 1])) parts.push(lines[++i].trim()); i++;
        push({ k: "callout", text: parts.filter(Boolean).join(" ") , depth }); continue;
      }
      if (/^<table\b/.test(t)) {
        let chunk = t; while (i + 1 < lines.length && !/<\/table>/.test(chunk)) chunk += "\n" + lines[++i];
        const trs = [...chunk.matchAll(/<tr[^>]*>([\s\S]*?)<\/tr>/g)].map((r) => [...r[1].matchAll(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/g)].map((c) => text(c[1])));
        push({ k: "tbl", rows: trs, depth }); continue;
      }
      if (/^\|/.test(t)) {
        const trs = []; let j = i;
        for (; j < lines.length && /^\s*\|/.test(lines[j]); j++) { const l = lines[j].trim(); if (/^\|[\s:|-]+\|$/.test(l)) continue; trs.push(l.replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => text(c))); }
        i = j - 1; push({ k: "tbl", rows: trs, depth }); continue;
      }
      if (/^```/.test(t)) {
        const fence = t.match(/^`+/)[0]; const code = [];
        while (i + 1 < lines.length && !lines[i + 1].trim().startsWith(fence)) code.push(lines[++i]); i++;
        push({ k: "code", text: code.join("\n"), depth }); continue;
      }
      if ((m = t.match(/^<h([1-4])\b[^>]*>(.*?)(?:<\/h\1>)?$/))) {
        let label = m[2]; while (!label.trim() && i + 1 < lines.length) label = lines[++i].trim();
        if (i + 1 < lines.length && /^<\/h[1-4]>$/.test(lines[i + 1].trim())) i++;
        push({ k: m[1] <= 2 ? "h" : "h3", text: label.replace(/<\/h[1-4]>$/, ""), depth }); continue;
      }
      if (/^<(embed|image|video|file|pdf|audio|bookmark)\b/.test(t) || /^!\[/.test(t)) { push({ k: "media", text: "［画像・埋め込み］", depth }); continue; }
      if ((m = t.match(/^<(page|database)\b[^>]*>(.*?)<\/\1>$/))) { push({ k: "muted", text: `📄 ${text(m[2]) || "ページ"}`, depth }); continue; }
      if (/^<\/?[a-z-]+[^>]*>$/.test(t)) continue; // ほかの単独タグ
      if ((m = t.match(/^(#{1,4})\s+(.*)$/))) { push({ k: m[1].length <= 2 ? "h" : "h3", text: m[2], raw: t, depth }); continue; }
      if ((m = t.match(/^- \[( |x|X)\]\s?(.*)$/))) { push({ k: "todo", done: m[1] !== " ", text: m[2], raw: t, depth }); continue; }
      if ((m = t.match(/^[-*]\s+(.*)$/))) { push({ k: "li", text: m[1], depth }); continue; }
      if ((m = t.match(/^(\d+)\.\s+(.*)$/))) { push({ k: "li", text: `${m[1]}. ${m[2]}`, depth }); continue; }
      if ((m = t.match(/^>\s?(.*)$/))) { push({ k: "quote", text: m[1], depth }); continue; }
      if (/^-{3,}$/.test(t)) { push({ k: "muted", text: "――――", depth }); continue; }
      push({ k: "p", text: t, depth });
    }
    return root;
  }
  function flatten(blocks, open, depth = 0, out = []) {
    for (const b of blocks) {
      out.push({ ...b, d: depth + (b.depth || 0) });
      if (b.k === "tog" && open.has(b.id)) flatten(b.kids, open, depth + 1, out);
    }
    return out;
  }
  function blockHtml(b, i) {
    const pad = b.d ? ` style="padding-left:${Math.min(b.d, 4) * 12}px"` : "";
    switch (b.k) {
      case "h": case "h3": return `<p class="nb ${b.k === "h" ? "h" : "h h3"}" data-b="${i}"${pad}>${inline(b.text)}</p>`;
      case "todo": return `<button type="button" class="nb todo${b.done ? " done" : ""}" data-b="${i}" data-check="${i}"${pad}><span class="box">${b.done ? "✓" : ""}</span><span>${inline(b.text)}</span></button>`;
      case "li": return `<p class="nb li" data-b="${i}"${pad}>${inline(b.text)}</p>`;
      case "quote": return `<p class="nb quote" data-b="${i}"${pad}>${inline(b.text)}</p>`;
      case "callout": return `<p class="nb callout" data-b="${i}"${pad}>${inline(b.text)}</p>`;
      case "tog": return `<button type="button" class="nb tog" data-b="${i}" data-tog="${b.id}"${pad}>${S.leaf.open.has(b.id) ? "▾" : "▸"} ${inline(b.text)}<span class="muted" style="color:var(--pencil);font-size:10px">（${b.kids.length}）</span></button>`;
      case "tbl": return `<div class="nb tbl" data-b="${i}"${pad}>${b.rows.slice(0, 12).map((r) => `<span>${esc(r.join("　／　"))}</span>`).join("")}${b.rows.length > 12 ? `<span style="color:var(--pencil)">…ほか${b.rows.length - 12}行</span>` : ""}</div>`;
      case "code": return `<pre class="nb code" data-b="${i}"${pad}>${esc(b.text.slice(0, 600))}</pre>`;
      case "media": case "muted": return `<p class="nb muted" data-b="${i}"${pad}>${esc(b.text)}</p>`;
      default: return `<p class="nb" data-b="${i}"${pad}>${inline(b.text)}</p>`;
    }
  }

  function fieldsHtml() {
    const L = S.leaf;
    if (L.kind === "task") {
      const t = known.get(L.id); const lane = laneOf(t);
      const p = S.projects.find((x) => t.projects.includes(x.id));
      return `<dl class="fields"><dt>今どこ</dt><dd>${esc(lane === "ai" ? "AI処理" : (LANES.find((l) => l.key === lane) || {}).label || "—")}　<span style="color:var(--pencil)">${esc(t.status)}${t.ai ? ` ${esc(t.ai)}` : ""}</span></dd>
        <dt>次の一手</dt><dd class="hand">${esc(t.next || "—")}</dd><dt>日付</dt><dd>${t.date ? `${md(t.date)}(${WD[dow(t.date)]})` : "—"}　枠 ${esc(t.waku || "—")}　重さ ${esc(t.weight || "—")}　${esc(t.tag || "")}</dd>
        ${p ? `<dt>PJ</dt><dd>${esc(p.name)}</dd>` : ""}${t.link ? `<dt>URL</dt><dd><a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.link.slice(0, 60))}</a></dd>` : ""}</dl>`;
    }
    if (L.kind === "proj") {
      const p = S.projects.find((x) => x.id === L.id); const s = projStats(p);
      const order = [ST.doing, ST.next, ST.wait, ST.ai, ST.some, ST.inbox];
      const kids = s.open.sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status));
      return `<dl class="fields"><dt>ステータス</dt><dd>${esc(p.status)}</dd><dt>進み具合</dt><dd class="num">${s.done} / ${p.total}（${s.pct}%）</dd>
        <dt>今の状態</dt><dd>${esc(p.now || "—")}</dd><dt>次の一歩</dt><dd class="hand">${esc(p.step || "—")}</dd></dl>
        <div class="list" style="flex:1">${kids.length ? kids.slice(0, 12).map((t) => taskRow(t, { lead: `<span class="tag">${esc(t.status.split(" ")[0])}</span>` })).join("") : `<div class="empty">残っている子タスクはありません</div>`}</div>`;
    }
    const r = L.row; const schema = S.dbSchema || {}; const { title } = dbColumns();
    const props = Object.values(schema).filter((p) => p.name !== title && !["button", "formula", "rollup"].includes(p.type));
    const shown = props.map((p) => { const v = cell(r, p); return v ? `<dt>${esc(p.name)}</dt><dd>${SECRET.test(p.name) ? `<span class="secret">••••（伏せています）</span>` : esc(v)}</dd>` : ""; }).join("");
    const formulas = Object.values(schema).filter((p) => p.type === "formula" || p.type === "rollup").length;
    return `<dl class="fields">${shown || "<dt>—</dt><dd>入っている項目はありません</dd>"}</dl>${formulas ? `<div style="font-size:10px;color:var(--pencil)">計算式・ロールアップ ${formulas}列は Notion 連携から読めないので出していません</div>` : ""}`;
  }

  function actionsHtml() {
    const L = S.leaf; if (L.kind !== "task") return "";
    const t = known.get(L.id); const lane = laneOf(t);
    const keys = lane === "today" ? ["done", "tomorrow", "weekend", "nodate", "wait", "someday", "ref", "research"]
      : lane === "plan" ? ["today", "done", "nodate", "tomorrow", "wait", "someday", "ref"]
      : lane === "next" ? ["today", "tomorrow", "weekend", "done", "wait", "someday", "ref", "research"]
      : lane === "inbox" ? ["adopt", "today", "tomorrow", "research", "someday", "ref", "done"]
      : lane === "wait" ? ["adopt", "today", "done", "someday", "ref"]

    return `<div class="acts">${keys.map((k, i) => `<button type="button" data-act="${k}" data-id="${t.id}" class="${i === 0 ? "pri" : ""}">${ACTIONS[k].label}</button>`).join("")}</div>`;
  }

  function drawLeaf() {
    const L = S.leaf; if (!L) return;
    const sh = $("#sheet");
    const views = L.kind === "proj" ? [["fields", "子タスク"], ["body", "本文"], ["write", "書く"]] : [["body", "本文"], ["fields", "項目"], ["write", "書く"]];
    sh.innerHTML = `<div class="leaf" role="dialog" aria-modal="true" aria-label="${esc(L.title)}">
      <div class="top"><h3>${esc(L.title)}</h3><button type="button" class="x" data-close="1" aria-label="閉じる">×</button></div>
      ${actionsHtml()}
      <div class="seg">${views.map(([k, n]) => `<button type="button" data-view="${k}" aria-pressed="${L.view === k}">${n}</button>`).join("")}<a href="${esc(L.url)}" target="_blank" rel="noopener" style="margin-left:auto;font-size:10.5px;color:var(--ink-blue)">Notion で開く ↗</a></div>
      <div class="leafbody" style="flex:1;min-height:0;display:flex;flex-direction:column;gap:6px"></div>
      <div class="lfoot"></div></div>`;
    sh.hidden = false;
    L.pages = 0;
    const box = $(".leafbody", sh);
    const foot = $(".lfoot", sh);
    if (L.view === "fields") { box.innerHTML = fieldsHtml(); return; }
    if (L.view === "write") { box.innerHTML = writeHtml(); return; }

  // ================= 書き込み：本文 =================
  async function toggleCheck(i) {
    const L = S.leaf; const b = L.flat?.[i]; if (!b || b.k !== "todo" || b.busy) return;
    const src = L.flat.filter((x) => x.raw === b.raw).length;
    const next = b.done ? b.raw.replace(/^- \[[xX]\]/, "- [ ]") : b.raw.replace(/^- \[ \]/, "- [x]");
    const orig = findBlock(L.body, b);
    if (!orig) return;
    orig.done = !orig.done; orig.raw = next; drawLeaf();
    if (S.mode === "demo") { toast("見本なので Notion は変わりません"); return; }
    if (src > 1) { orig.done = !orig.done; orig.raw = b.raw; drawLeaf(); toast("同じ文のチェック項目が2つあるので、Notion で直接チェックしてください"); return; }
    try {
      await call("update", { page_id: L.id, command: "update_content", content_updates: [{ old_str: b.raw, new_str: next }], allow_async: false }, { read: false });
      toast(orig.done ? "チェックしました" : "チェックを外しました");
      if (L.kind === "task") { syncNext(L); render(); }
    } catch (err) { orig.done = !orig.done; orig.raw = b.raw; if (S.leaf === L) drawLeaf(); toast(errText(err)); }
  }
  function findBlock(blocks, b) {
    for (const x of blocks) {
      if (x.k === "todo" && x.raw === b.raw && x.text === b.text) return x;
      if (x.kids) { const f = findBlock(x.kids, b); if (f) return f; }
    }
    return null;
  }
  // AIのNEXT同期と同じ考え方：NEXT が ToDo 由来なら、最初の未チェック項目を手元の表示に写す（Notion側は定時処理が直す）
  function syncNext(L) {
    const t = known.get(L.id); if (!t) return;
    const todos = []; const walk = (bs) => bs.forEach((x) => { if (x.k === "todo") todos.push(x); if (x.kids) walk(x.kids); }); walk(L.body);
    if (!todos.some((x) => text(x.text) === t.next)) return;
    t.next = text((todos.find((x) => !x.done) || {}).text || "");
  }

    const L = S.leaf; if (!L) return;

      catch (err) { t.next = before; render(); if (S.leaf === L) drawLeaf(); toast(errText(err)); }
      return;
    }
    const v = $("#w-text").value.replace(/\r/g, "").trim();
    if (!v) { toast("何も書かれていません"); return; }
    const lines = v.split("\n").map((s) => s.trim()).filter(Boolean);
    let op;
    if (L.write === "todo") {
      const items = lines.map((s) => `- [ ] ${s.replace(/^- \[[ xX]\]\s*|^[-・]\s*/, "")}`).join("\n");
      const anchor = lastTodoOfSection(L.raw || "");
      op = anchor
        ? { command: "update_content", content_updates: [{ old_str: anchor, new_str: `${anchor}\n${items}` }] }
        : { command: "insert_content", position: { type: "end" }, content: L.kind === "task" && !/^#{1,3}\s*(?:☑️\s*)?(?:ToDo|やること)/m.test(L.raw || "") ? `## やること\n${items}` : items };
    } else {
      op = { command: "insert_content", position: { type: "end" }, content: v.split("\n").map((s) => s.trimEnd()).join("\n\n").replace(/\n{3,}/g, "\n\n") };
    }
    if (S.mode === "demo") { L.raw = op.content_updates ? L.raw.replace(op.content_updates[0].old_str, op.content_updates[0].new_str) : `${L.raw}\n${op.content}`; L.body = parseBody(L.raw); L.view = "body"; drawLeaf(); toast("見本なので Notion は変わりません"); return; }

  // 「## やること／ToDo」の見出しの下で、いちばん最後のチェック項目の行（その下に足す）
  function lastTodoOfSection(raw) {
    const lines = raw.split("\n"); let inSec = false, last = null, level = 0;
    for (const l of lines) {
      const t = l.trim(); const h = t.match(/^(#{1,4})\s/);
      if (TODO_HEAD.test(t)) { inSec = true; level = h ? h[1].length : 2; last = null; continue; }
      if (inSec && h && h[1].length <= level) break;
      if (inSec && /^- \[[ xX]\]/.test(t) && !/^\t/.test(l)) last = t;
    }
    if (!last) return null;
    return raw.split(last).length === 2 ? last : null; // 同じ行が2つあると場所を決められない
  }
