<style>
/* 落ち着いた夜の配色。面は少しだけ明るさを変えて重ね、色は段の印と大事な所だけに使う。数字は Inter */
:root {
  --bg: #0f1115;
  --card: #171a21;
  --sunk: #1d2129;
  --ink: #e9e7e2;
  --mute: #8c919b;
  --line: rgba(255, 255, 255, .08);
  --accent: #9dbcb0;
  --hi: #e9e7e2;
  --late: #e08578;
  --ok: #93c4a4;
  /* 段の色（くすませた色） */
  --s-inbox: #9aa0aa;
  --s-ai: #ab9fd0;
  --s-next: #8fb0d6;
  --s-plan: #8cc2bc;
  --s-today: #d8b27e;
  --s-wait: #cdbf8c;
  --s-some: #7f8590;
  --s-ref: #c2a68a;
  --s-done: #93c4a4;
  /* Notion の色（夜） */
  --n-gray: #9b9a97; --n-brown: #ba856f; --n-orange: #c77d48; --n-yellow: #ca9849; --n-green: #529e72; --n-blue: #5e87c9; --n-purple: #9d68d3; --n-pink: #d15796; --n-red: #df5452;
  --nb-gray: #24272c; --nb-brown: #2f2824; --nb-orange: #33281f; --nb-yellow: #312c1e; --nb-green: #1d2b23; --nb-blue: #1d2633; --nb-purple: #272233; --nb-pink: #30222a; --nb-red: #322222; --nb-default: #1d2129;
  --shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, .25);
  --f: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-num: "Inter", "Zen Kaku Gothic New", system-ui, sans-serif;
  --f-code: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { touch-action: manipulation; }
body { margin: 0; background: radial-gradient(120% 80% at 50% 0%, #0b1530 0%, var(--bg) 60%); color: var(--ink); font-family: var(--f); font-size: 14px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
input, textarea, select { font: inherit; color: var(--ink); }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.mute { color: var(--mute); }
.late { color: var(--late); }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; max-width: 760px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 10px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.top h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .02em; }
.top .date { color: var(--mute); font-size: 12.5px; }
.sync { margin-left: auto; font-size: 11.5px; color: var(--mute); display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.sync.busy i { background: var(--s-wait); animation: blink 1s infinite; }
.sync.err i { background: var(--late); }
@keyframes blink { 50% { opacity: .3; } }
.iconbtn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); font-size: 18px; flex: none; }
main { min-height: 0; min-width: 0; display: flex; flex-direction: column; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } }
nav.tabs { display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); gap: 4px; }
nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 0 4px; border-radius: 12px; font-size: 11px; color: var(--mute); position: relative; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-pressed="true"] { color: var(--ink); background: var(--card); box-shadow: var(--shadow); font-weight: 700; }
nav.tabs .badge { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 10.5px; display: grid; place-items: center; font-family: var(--f-num); }

.card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); }
.seg { display: flex; gap: 3px; background: var(--sunk); border-radius: 11px; padding: 3px; flex: none; }
.seg button { flex: 1; text-align: center; padding: 5px 4px; border-radius: 8px; font-size: 12.5px; white-space: nowrap; color: var(--mute); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.seg button .n { font-family: var(--f-num); font-size: 11px; margin-left: 3px; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; flex: none; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chip .n { font-family: var(--f-num); font-size: 11px; margin-left: 3px; opacity: .8; }

/* 一覧 */
.list { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; touch-action: pan-y; }
.row { display: flex; align-items: center; gap: 10px; min-height: 50px; flex: none; padding: 6px 12px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.row:last-child { border-bottom: 0; }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 11.5px; color: var(--mute); white-space: nowrap; text-align: right; }
.row .meta.late { color: var(--late); font-weight: 700; }
.row .meta { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 1px; }
.row .meta .upd { font-size: 10px; font-weight: 400; color: var(--mute); opacity: .8; font-family: var(--f-num); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--c, var(--mute)); }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--c, var(--line)); flex: none; display: grid; place-items: center; color: transparent; font-size: 13px; transition: .2s; }
.check:hover { background: color-mix(in srgb, var(--c) 15%, transparent); }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.row.gone { animation: gone .35s ease-in forwards; }
@keyframes gone { to { transform: translateX(30%); opacity: 0; } }
.pager { display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 11.5px; color: var(--mute); padding: 4px 0 6px; flex: none; min-height: 26px; }
.pager button { padding: 0 8px; font-size: 14px; }
.pager button:disabled { opacity: .3; }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--mute); padding: 16px; font-size: 13px; white-space: pre-wrap; }
.in-l { animation: inl .22s ease-out; } .in-r { animation: inr .22s ease-out; }
@keyframes inl { from { transform: translateX(14%); opacity: 0; } }
@keyframes inr { from { transform: translateX(-14%); opacity: 0; } }
.tag { font-size: 10.5px; padding: 0 6px; border-radius: 5px; background: var(--sunk); color: var(--mute); white-space: nowrap; }
.ai-mark { font-size: 12px; }

/* 流れ（GTD） */
.flow { flex: none; position: relative; padding: 4px 0 0; }
.flow svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.flow .edge { fill: none; stroke: var(--mute); stroke-opacity: .35; stroke-width: 1.6; stroke-dasharray: 3 3; }
.flow .pt { fill: var(--c); opacity: .85; }
.nodes { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(4, auto); gap: 14px 8px; }
.node { --c: var(--mute); position: relative; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 6px 8px 5px; border-top: 3px solid var(--c); min-width: 0; text-align: left; transition: transform .15s; }
.node:active { transform: scale(.97); }
.node[aria-pressed="true"] { outline: 2px solid var(--c); outline-offset: 1px; }
.node .k { font-size: 11.5px; font-weight: 700; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.node .n { font-family: var(--f-num); font-size: 20px; line-height: 1.1; display: block; }
.node .s { font-size: 10px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.node .s.late { color: var(--late); font-weight: 700; }
.node .flag { position: absolute; top: -8px; right: 6px; font-size: 10px; padding: 0 6px; border-radius: 8px; background: var(--c); color: #fff; font-weight: 700; }
.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px 6px; flex: none; }
.panel-head b { font-size: 14.5px; }
.panel-head .seg { margin-left: auto; }
.panel-head .seg button { padding: 3px 8px; font-size: 11.5px; }
.board { flex: 1; min-height: 0; display: flex; gap: 8px; overflow-x: auto; padding: 0 10px 10px; scroll-snap-type: x mandatory; }
.col { flex: 0 0 72%; max-width: 240px; scroll-snap-align: start; background: var(--sunk); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 5px; min-height: 0; overflow: hidden; }
.col h4 { margin: 0; font-size: 12px; padding: 2px 4px; display: flex; justify-content: space-between; }
.bcard { background: var(--card); border-radius: 9px; padding: 6px 8px; font-size: 12.5px; box-shadow: var(--shadow); text-align: left; width: 100%; flex: none; }
.bcard .sub { font-size: 11px; color: var(--mute); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tablewrap { flex: 1; min-height: 0; overflow: auto; }
table.grid { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 7px 10px; white-space: nowrap; text-align: left; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
table.grid th { position: sticky; top: 0; background: var(--card); color: var(--mute); font-weight: 500; font-size: 11.5px; z-index: 1; }
table.grid tr.click { cursor: pointer; }
table.grid tr.click:hover td { background: var(--sunk); }

/* AI */
.aihead { display: flex; gap: 8px; flex: none; }
.aihead .card { flex: 1; padding: 8px 10px; min-width: 0; }
.aihead .k { font-size: 11px; color: var(--mute); }
.aihead .n { font-family: var(--f-num); font-size: 22px; line-height: 1.1; }
.aihead .s { font-size: 10.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aihead .mine { border-left: 4px solid var(--accent); }
.aihead .runnow { margin-top: 6px; width: 100%; height: 30px; padding: 0 6px; font-size: 11.5px; }
.aicard { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; flex: none; }
.aicard:last-child { border-bottom: 0; }
.aicard .t { display: flex; gap: 8px; align-items: center; }
.aicard .t b { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aicard .what { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); white-space: nowrap; font-weight: 700; }
.aicard .what.ans { background: color-mix(in srgb, var(--s-today) 16%, transparent); color: var(--s-today); }
.aicard .pv { font-size: 12px; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.aicard .pv b { color: var(--ink); font-weight: 500; }
.clar { display: inline-flex; align-items: center; gap: 5px; }
.clar i { display: inline-block; width: 46px; height: 5px; border-radius: 3px; background: var(--sunk); position: relative; overflow: hidden; }
.clar i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p); background: var(--accent); }
.form { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.form label { font-size: 11.5px; color: var(--mute); }
.form input, .form textarea { width: 100%; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.form textarea { min-height: 70px; resize: none; }
.modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.sel { width: 100%; height: 40px; border-radius: 10px; background: var(--sunk); border: 0; padding: 0 8px; }
.modes button { border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 8px; font-size: 12px; text-align: left; }
.modes button b { display: block; font-size: 13px; }
.modes button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.btn { height: 38px; border-radius: 10px; padding: 0 14px; background: var(--sunk); font-weight: 500; text-align: center; white-space: nowrap; }
.btn.pri { background: var(--accent); color: #fff; }
.btn.danger { color: var(--late); background: color-mix(in srgb, var(--late) 10%, transparent); }
.btn.danger.arm { background: var(--late); color: #fff; }
.nlens { padding: 2px 12px 6px; display: grid; gap: 6px; flex: none; border-bottom: 1px solid var(--line); }
.nlens .seg button { font-size: 12px; }
.ngroups { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; } .ngroups::-webkit-scrollbar { display: none; }
.ngroups .qc { flex: none; height: 32px; font-size: 12px; } .ngroups .qc small { margin-left: 5px; font-family: var(--f-num); color: var(--mute); } .ngroups .qc.on { background: var(--ink); color: var(--bg); } .ngroups .qc.on small { color: inherit; opacity: .7; }
.nhint { margin: 0; font-size: 11.5px; color: var(--mute); line-height: 1.5; }
.sech .qc.arm { background: var(--late); color: #fff; }
.sech .qc + .qc { margin-left: 4px; }
.delrow { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; font-size: 11.5px; }
/* 節約 */
.savehero { padding: 14px 16px 12px; display: grid; gap: 10px; }
.savehero .ttl2 { display: flex; align-items: baseline; gap: 8px; } .savehero .ttl2 b { font-size: 16px; } .savehero .ttl2 small { color: var(--mute); font-size: 12px; margin-left: auto; font-family: var(--f-num); }
.savenums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.savenums > div { background: var(--sunk); border-radius: 12px; padding: 8px 10px; display: grid; gap: 2px; } .savenums b { font-size: 17px; font-family: var(--f-num); font-weight: 600; } .savenums small { font-size: 10.5px; color: var(--mute); } .savenums .yen { font-size: 11px; color: var(--mute); font-family: var(--f-num); }
.bud { display: grid; gap: 4px; } .bud .lb { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--mute); } .bud .lb b { color: var(--tx); font-family: var(--f-num); font-weight: 600; }
.bud .bar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; } .bud .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; } .bud.over .bar i { background: var(--late); }
.rules { padding: 10px 14px; display: grid; gap: 4px; font-size: 12.5px; color: var(--mute); } .rules b { color: var(--tx); font-size: 12.5px; }
.price { font-family: var(--f-num); font-size: 12px; color: var(--mute); white-space: nowrap; }
.kchip { display: inline-flex; gap: 4px; }
.sealed .nm { color: var(--mute); }
.saveadd { display: flex; gap: 8px; padding: 8px 14px 12px; margin-bottom: 64px; }
.hero { grid-template-columns: 56px minmax(0, 1fr); } .hnext { min-width: 0; }
.saveadd .btn { flex: 1; height: 40px; }
.btn.ok { background: var(--ok); color: #fff; }
.btn:disabled { opacity: .5; }

/* 仕分け */

/* 記録 */
.statrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: none; }
.stat { padding: 8px 10px; }
.stat .k { font-size: 11px; color: var(--mute); }
.stat .n { font-family: var(--f-num); font-size: 20px; line-height: 1.15; }
.stat .s { font-size: 10.5px; color: var(--mute); }
.verdict { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; flex: none; text-align: left; width: 100%; }
.verdict b { font-size: 14px; }
.verdict .nx { font-size: 12.5px; }
.chart svg { display: block; width: 100%; }
.chart text { font-family: var(--f-num); font-size: 9.5px; fill: var(--mute); }
.legend { display: flex; gap: 12px; font-size: 11px; color: var(--mute); padding: 6px 12px 0; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.dayhead { font-size: 11px; color: var(--mute); padding: 6px 12px 2px; flex: none; font-weight: 700; }

/* ページ（詳細） */
#page { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; animation: pagein .25s cubic-bezier(.2, .9, .3, 1); }
@keyframes pagein { from { transform: translateY(16px); opacity: 0; } }
#page[hidden] { display: none; }
.pbar { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); flex: none; }
.pbar .crumb { flex: 1; min-width: 0; font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbar a { font-size: 12px; color: var(--accent); white-space: nowrap; }
.savestate { font-size: 11.5px; color: var(--mute); white-space: nowrap; }
.savestate.err { color: var(--late); }
.pscroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); }
.pinner { max-width: 720px; margin: 0 auto; }
.ptitle { font-size: 26px; font-weight: 700; line-height: 1.3; margin: 6px 0 10px; outline: none; overflow-wrap: anywhere; }
.props { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; font-size: 13px; margin-bottom: 10px; align-items: center; }
.props dt { color: var(--mute); white-space: nowrap; display: flex; gap: 6px; align-items: center; min-height: 30px; }
.props dd { margin: 0; min-width: 0; }
.props select, .props input { background: transparent; border: 0; border-radius: 6px; padding: 4px 6px; font-size: 13px; max-width: 100%; }
.props select:hover, .props input:hover { background: var(--sunk); }
.props input[type="text"] { width: 100%; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 5px; background: var(--sunk); margin: 1px 4px 1px 0; }
.aibar { margin: 0 0 12px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 8%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.aibar .h { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.aibar .h b { color: var(--accent); }
.aibar .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.aibar .acts .btn { height: 34px; font-size: 12.5px; }
.aibar textarea { width: 100%; min-height: 56px; resize: vertical; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 13.5px; }
.qa { display: flex; flex-direction: column; gap: 12px; }
.q { background: var(--card); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.q .qt { font-weight: 700; font-size: 13.5px; }
.q .opt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 9px; border: 1.5px solid var(--line); font-size: 13px; text-align: left; width: 100%; }

.mk { flex: none; width: 24px; display: flex; justify-content: center; padding-top: 2px; user-select: none; }

.c-gray { color: var(--n-gray); } .c-brown { color: var(--n-brown); } .c-orange { color: var(--n-orange); } .c-yellow { color: var(--n-yellow); } .c-green { color: var(--n-green); } .c-blue { color: var(--n-blue); } .c-purple { color: var(--n-purple); } .c-pink { color: var(--n-pink); } .c-red { color: var(--n-red); }
.bg-gray { background: var(--nb-gray); } .bg-brown { background: var(--nb-brown); } .bg-orange { background: var(--nb-orange); } .bg-yellow { background: var(--nb-yellow); } .bg-green { background: var(--nb-green); } .bg-blue { background: var(--nb-blue); } .bg-purple { background: var(--nb-purple); } .bg-pink { background: var(--nb-pink); } .bg-red { background: var(--nb-red); }
.menu { position: fixed; z-index: 60; background: var(--card); border-radius: 10px; box-shadow: 0 8px 30px rgba(0, 0, 0, .2); padding: 4px; min-width: 200px; max-height: 320px; overflow-y: auto; font-size: 13.5px; }

#toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 12px; font-size: 13px; z-index: 80; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0, 0, 0, .2); animation: fade .2s; display: flex; gap: 12px; align-items: center; }

/* iPhone は16px未満の入力欄を押すと画面を拡大するので、入力欄は16px以上にする */

.panel-head .ttl { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }

.crow { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.cname { flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; font-size: 13px; }

/* AIからの提案 */

/* ===== 運用：使い方（図解）と診断 ===== */
.guide, .diagall { padding: 4px 14px 24px; }

.g-roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  function parseMd(raw) {
    const lines = raw.split("\n");

    for (const b of blocks) { b.start = starts[b.from]; b.end = starts[b.to] + lines[b.to].length; b.src = raw.slice(b.start, b.end); }

        b = mk("code", { lang: fm[2].trim(), text: L.slice(i + 1, j).join("\n") }); i = Math.min(j, L.length - 1) + 1;

  // ================= 流れ（GTD） =================

  const FLOW_MAIN = ["inbox", "next", "plan", "today", "done"];

  // ================= AI =================
  function conclusionOf(raw) {
    const L = raw.split("\n");
    let h = L.findIndex((l) => /^##\s.*(調査結果|徹底調査結果).*最新/.test(l)); if (h < 0) h = L.findIndex((l) => /^##\s.*(調査結果|徹底調査結果)/.test(l));
    if (h < 0) return "";
    for (let i = h + 1; i < L.length && !/^##\s/.test(L[i]); i++) {
      if (/^<callout/.test(L[i].trim())) { const out = []; for (let j = i + 1; j < L.length && !/^<\/callout>/.test(L[j].trim()); j++) if (L[j].trim()) out.push(L[j]); return text(out.join(" ")).slice(0, 160); }
      if (L[i].trim() && !/^#{3,4}\s/.test(L[i]) && !/^</.test(L[i].trim())) return text(L[i]).slice(0, 160);
    }
    return "";
  }
  // 💬 の最新の質問票を読む（質問・選択肢・コメント欄・明確度・決めることリスト）
  function qaParse(raw) {
    const L = raw.split("\n");
    let h = -1;
    L.forEach((l, i) => { if (/^##\s/.test(l) && /💬/.test(l)) { if (/最新/.test(l)) h = i; else if (h < 0 || !/最新/.test(L[h])) h = i; } });
    if (h < 0) return null;
    let end = h + 1; while (end < L.length && !/^##\s/.test(L[end]) && !/^###\s*🗂/.test(L[end])) end++;
    const sec = L.slice(h, end);
    const qa = { h, end, sec, qs: [], decide: [], clarity: null };
    const cl = sec.join("\n").match(/明確度\s*([0-9]+)\s*\/\s*([0-9]+)/); if (cl) qa.clarity = [+cl[1], +cl[2]];
    let mode = null; let cur = null;
    sec.forEach((l, i) => {
      if (/^#{3,4}\s.*決めること/.test(l)) { mode = "decide"; return; }
      const qm = l.match(/^(?:#{3,4}\s*)?(?:\*\*|<b>)?\s*(?:❓\s*)?(Q\s*\d+[\s\S]*)$/);
      if (qm && !/^\s*[-*+]\s/.test(l)) { mode = "q"; cur = { title: text(qm[1].replace(/(\*\*|<\/?b>)/g, "")), opts: [], comment: null, line: i }; qa.qs.push(cur); return; }
      if (/^#{3,4}\s/.test(l)) { mode = null; return; }
      const om = l.match(/^(\s*)[-*]\s+\[( |x|X)\]\s+(.*)$/);
      if (om && mode === "decide") { qa.decide.push({ text: text(om[3]), checked: om[2] !== " " }); return; }
      if (om && mode === "q" && cur) { cur.opts.push({ i, text: text(om[3]), checked: om[2] !== " ", was: om[2] !== " " }); return; }
      const cm = l.match(/^(\s*(?:[-*]\s+)?(?:<b>|\*\*)?\s*(?:💬\s*コメント|回答)\s*(?:<\/b>|\*\*)?\s*[:：]\s*)(.*)$/);
      if (cm && mode === "q" && cur) { cur.comment = { i, prefix: cm[1], value: text(cm[2]), was: cm[2] }; }
    });
    return qa.qs.length || qa.decide.length ? qa : null;
  }
  function qaWrite(qa) {
    const out = qa.sec.slice(); const inserts = [];
    for (const q of qa.qs) {

      if (q.comment) { if (q.newComment != null) out[q.comment.i] = q.comment.prefix + q.newComment.replace(/\n/g, " "); }
      else if (q.newComment) { const last = q.opts.length ? q.opts.at(-1).i : q.line; inserts.push([last + 1, ["", `💬 コメント：${q.newComment.replace(/\n/g, " ")}`]]); }

  function summaryOf(t) { const b = S.bodies[t.id]; return b && b.edited === t.edited ? b : null; }
  let prefetching = false;
  async function prefetchBodies() {

        : t.ai === "🔍✅" ? (sm ? (sm.conc ? `⭐ <b>${esc(sm.conc)}</b>` : "結論の要約が見つかりません（開いて確認）") : "結論を読みこみ中…")

  };
  const skipped = new Set();
  function renderTriage(view) {

    view.insertAdjacentHTML("beforeend", `<div class="chips">${Object.entries(PILES).map(([k, p]) => `<button type="button" class="chip" data-pile="${k}" aria-pressed="${S.pileKey === k}">${p.name}<span class="n">${p.items().length}</span></button>`).join("")}</div>
      <div class="radial" id="radial">${t ? `<div class="ringwrap" id="ringwrap">

        <div class="orb" id="orb" data-card="${t.id}" style="--c:${P.c}"><span class="otag">${t.tag ? esc(t.tag) : ""}${t.ai && t.status === ST.ai ? ` ${t.ai}` : ""}</span><b class="onm">${esc(t.name)}</b><span class="onx">${t.next ? `次の一歩：${esc(short(t.next, 28))}` : S.pileKey === "judge" ? (summaryOf(t)?.conc ? `⭐ ${esc(short(summaryOf(t).conc, 40))}` : "結論を読みこみ中…") : ""}</span><span class="ometa">${t.date ? esc(metaOf(t).tx) : `${ageOf(t)}日前から`}${t.weight ? `・${t.weight}` : ""}</span></div>

  // 行き先へ送る（丸がその方向へ飛んでから、次の1件が出る）
  function sendTo(key) {
    const orb = $("#orb"); if (!orb) return; const t = known.get(orb.dataset.card); if (!t) return;
    const P = PILES[S.pileKey]; const i = P.dests.indexOf(key); const btn = $(`.dest[data-rdest="${key}"]`);
    btn?.classList.add("hit"); buzz(12);
    if (i >= 0 && !reduce) { const a = (i * 60 - 90) * Math.PI / 180; orb.style.transition = "transform .28s ease-in, opacity .28s"; orb.style.transform = `translate(${Math.cos(a) * 180}px, ${Math.sin(a) * 180}px) scale(.3)`; orb.style.opacity = "0"; }
    setTimeout(() => { if (key === "skip") { skipped.add(t.id); render(); toast(`「${short(t.name)}」はまだ置いておきます`); } else move(t, DEST[key].mv || key); }, reduce ? 0 : 260);
  }
  // 丸を引っぱると、その方向の行き先が光る。離すとそこへ
  function dragOrb(orb, P) {
    let x0, y0, on = false, cur = null;
    const pick = (dx, dy) => { if (Math.hypot(dx, dy) < 40) return null; const deg = ((Math.atan2(dy, dx) * 180 / Math.PI) + 90 + 360 + 30) % 360; return P.dests[Math.floor(deg / 60)]; };
    const mark = (k) => { if (k === cur) return; cur = k; for (const b of document.querySelectorAll(".dest")) b.classList.toggle("near", b.dataset.rdest === k); if (k) buzz(6); };
    orb.addEventListener("pointerdown", (e) => { if (e.button > 0) return; x0 = e.clientX; y0 = e.clientY; on = true; orb.setPointerCapture(e.pointerId); orb.style.transition = "none"; });
    orb.addEventListener("pointermove", (e) => { if (!on) return; const dx = e.clientX - x0, dy = e.clientY - y0; const d = Math.hypot(dx, dy); const k = Math.min(1, 90 / Math.max(90, d)); orb.style.transform = `translate(${dx * k}px,${dy * k}px) scale(${1 - Math.min(.1, d / 900)})`; mark(pick(dx, dy)); });
    const up = (e) => { if (!on) return; on = false; const dx = e.clientX - x0, dy = e.clientY - y0; const k = pick(dx, dy); mark(null);
      if (k && Math.hypot(dx, dy) > 70) { sendTo(k); return; }
      orb.style.transition = ""; orb.style.transform = "";
      if (Math.hypot(dx, dy) < 6) openTask(orb.dataset.card); };
    orb.addEventListener("pointerup", up); orb.addEventListener("pointercancel", () => { on = false; mark(null); orb.style.transition = ""; orb.style.transform = ""; });
  }

  // ================= 記録（診断・運用ログ・目標とプロジェクト） =================
  function renderLog(view) {
    view.insertAdjacentHTML("beforeend", `<div class="seg">${[["guide", "使い方"], ["diag", "診断"], ["log", "運用ログ"], ["goal", "目標・PJ"]].map(([k, n]) => `<button type="button" data-logseg="${k}" aria-pressed="${S.logSeg === k}">${n}</button>`).join("")}</div>`);

  }
  function renderOpsLog(view) {

    paged(box, `log:${S.logEvent}`, items, 52, (l) => { const t = l.at ? Date.parse(l.at) : 0; return `<button type="button" class="row" data-log="${l.id}"><span class="main"><span class="nm">${esc(l.name)}</span><span class="sub">${esc(l.body || "")}</span></span><span class="meta">${esc(l.event)}<br>${t ? `${jst(t) === TODAY() ? "今日" : md(jst(t))} ${jstTime(t)}` : ""}</span></button>`; });
  }
  function projStats(p) {
    const open = S.tasks.filter((t) => t.projects.includes(p.id));
    const done = Math.max(0, p.total - open.length);
    return { open, done, pct: p.total ? Math.round((done / p.total) * 100) : 0 };
  }
  function renderGoals(view) {
    const items = []; const live = S.goals.filter((g) => !/達成|完了|手放/.test(g.status)).sort((a, b) => (/挑戦中/.test(b.status) ? 1 : 0) - (/挑戦中/.test(a.status) ? 1 : 0));
    const used = new Set();
    for (const g of live) { items.push({ k: "g", g }); for (const pid of g.projects) { const pj = S.projects.find((x) => x.id === pid); if (pj && !pj.status.includes("完了")) { items.push({ k: "p", p: pj }); used.add(pj.id); } } }
    const rest = S.projects.filter((x) => !used.has(x.id) && !x.status.includes("完了"));
    if (rest.length) { items.push({ k: "h" }); rest.forEach((x) => items.push({ k: "p", p: x })); }
    view.insertAdjacentHTML("beforeend", `<div class="card panel"><div class="list" id="goallist"></div></div>`);

  // ================= DB（すべてのデータベース） =================
  function initDbs() {
    const names = store.get("dbnames") || {};

  }
  const dbIdle = () => S.tab === "db" && !S.dbOpen && $("#page").hidden;
  async function refreshDbList() {
    try {
      const res = await call("fetch", { id: DB_PAGE });
      const body = String(res.text || ""); const out = []; let sec = "その他";
      const re = /<h2[^>]*>\s*([^<]+?)\s*<\/h2>|^##\s+(.+)$|<database url="[^"]+"(?: data-source-url="collection:\/\/([0-9a-f-]+)")?[^>]*>([\s\S]*?)<\/database>/gm;
      for (const m of body.matchAll(re)) {
        if (m[1] || m[2]) { sec = (m[1] || m[2]).trim(); continue; }
        if (!m[3]) continue;
        const prev = S.dbs.find((d) => d.id === m[3]); out.push({ id: m[3], name: text(m[4]) || prev?.name || "", sec });
      }
      if (out.length >= 5) S.dbs = out;
    } catch { /* 控えの一覧のまま */ }
    if (dbIdle()) render();
    fillDbNames();
  }
  async function fillDbNames() {
    const names = store.get("dbnames") || {}; const todo = S.dbs.filter((d) => !d.name); let timer;
    const later = () => { clearTimeout(timer); timer = setTimeout(() => { if (dbIdle()) render(); }, 300); };
    const worker = async () => {
      for (let d; (d = todo.shift());) {
        try { const res = await call("fetch", { id: `collection://${d.id}` }); const m = String(res.text || "").match(/The title of this Data Source is:\s*(.+)/); d.name = (m ? m[1] : res.title || "").trim() || "（名前なし）"; names[d.id] = d.name; store.set("dbnames", names); }

      <input id="dbq" type="search" placeholder="さがす" value="${esc(S.dbQuery)}" aria-label="さがす" style="flex:none;background:var(--card);border:0;border-radius:10px;padding:8px 12px;box-shadow:var(--shadow)">

  // ================= 今日：片づけることに絞ったホーム（残り・遅れ・枠ごとの一覧・済み・次にやるから足す） =================
  const buzz = (ms = 10) => { try { navigator.vibrate?.(ms); } catch { /* 無ければ何もしない */ } };
  function renderToday(view) {
    const d = TODAY(); const today = stageItems("today"); const late = today.filter((t) => t.date < d); const rest = today.filter((t) => t.date >= d);
    const done = S.doneToday.length; const total = today.length + done; const pct = total ? Math.round((done / total) * 100) : 0;
    const loading = S.mode === "loading" && !S.tasks.length;
    if (S.mode === "error" && !S.tasks.length) { view.insertAdjacentHTML("beforeend", `<div class="card panel"><div class="empty errbox"><b>読み込めませんでした</b><span>${esc(S.error || "")}</span><button type="button" class="btn pri" id="retry">もう一度</button></div></div>`); return; }
    const doing = today.find((t) => t.status === ST.doing); const first = doing || late[0] || rest[0];
    const tip = adviceTop();
    // 進み具合の輪
    const R = 24, C = 2 * Math.PI * R;
    view.insertAdjacentHTML("beforeend", `<div class="hero card">
        <svg class="ring" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="${R}" class="bg"/><circle cx="30" cy="30" r="${R}" class="fg" style="stroke-dasharray:${C};stroke-dashoffset:${C * (1 - pct / 100)}"/><text x="30" y="34" text-anchor="middle">${loading ? "…" : `${pct}%`}</text></svg>
        <div class="ht">${loading ? `<b>読みこみ中…</b>` : today.length ? `<b>のこり ${today.length}件</b><span>${done ? `${done}件 終わった` : "まだ手つかず"}${late.length ? `・<em>遅れ ${late.length}</em>` : ""}</span>` : `<b>今日は全部終わり ✨</b><span>${done ? `${done}件 片づけた` : "何もありません"}</span>`}</div>
        ${first ? `<div class="hnext"><button type="button" class="hopen" data-open="${first.id}"><small>${doing ? "▶ いま やっている" : "まず これ"}</small><span>${esc(first.name)}</span>${first.next ? `<small class="mute">${esc(first.next)}</small>` : ""}</button><button type="button" class="check big" data-done="${first.id}" aria-label="済みにする">✓</button></div>` : ""}
      </div>
      ${S.error && S.tasks.length ? `<button type="button" class="stale" id="retry">⚠ 更新できていません（${S.loadedAt ? jstTime(S.loadedAt) : "前"}のデータを表示）　↻ もう一度</button>` : ""}
      ${tip && tip.pri >= 50 ? `<button type="button" class="tipbar" data-concierge="1"><span class="ic">${tip.icon}</span><span class="tx"><b>提案</b>${esc(tip.title)}</span><i>›</i></button>` : ""}
      <div class="card panel"><div class="scroll swipey" id="todaylist"></div></div>`);
    const box = $("#todaylist");
    const sec = (title, list, extra = "") => (list.length ? `<div class="sech${extra}"><span>${esc(title)}</span><small>${list.length}</small></div>${list.map((t, i) => rowHtml(t, i, { meta: "weight" })).join("")}` : "");
    let html = "";
    if (late.length) html += `<div class="sech late"><span>遅れ</span><small>${late.length}</small><button type="button" class="qc" data-cact="late:today">全部 今日に</button></div>${late.map((t, i) => rowHtml(t, i, { meta: "late" })).join("")}`;

  // ================= 行の操作：スワイプ（右＝済み・左＝明日）と長押し（日付・状態の変更） =================
  (() => {

    const guard = () => { const stop = (ev) => { ev.stopPropagation(); ev.preventDefault(); }; addEventListener("click", stop, { capture: true, once: true }); setTimeout(() => removeEventListener("click", stop, { capture: true }), 350); };

    document.addEventListener("pointerdown", (e) => {
      const row = e.target.closest(".swipey .row[data-id]"); if (!row || e.button > 0 || e.target.closest("a")) return;
      const t = known.get(row.dataset.id); if (!t) return;
      g = { row, t, x: e.clientX, y: e.clientY, id: e.pointerId, dx: 0, moving: false, wrap: row.closest(".rw") };
      row.classList.add("pressing");

      lpTimer = setTimeout(() => { if (!g || g.moving) return; const id = g.t.id; buzz(15); g.row.classList.remove("pressing"); g = null; guard(); openQuick(id); }, 450);
    }, { passive: true });
    document.addEventListener("pointermove", (e) => {
      if (!g || e.pointerId !== g.id) return;
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (!g.moving) { if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; clearTimeout(lpTimer); g.row.classList.remove("pressing"); if (Math.abs(dy) > Math.abs(dx)) { g = null; return; } g.moving = true; g.row.classList.add("swiping"); try { g.row.setPointerCapture(e.pointerId); } catch { /* 無視 */ } }
      const canDone = g.t.status !== ST.done; g.dx = canDone ? dx : Math.min(0, dx);
      g.row.style.transform = `translateX(${g.dx}px)`;
      const w = g.wrap; if (w) { w.classList.toggle("r", g.dx > 0); w.classList.toggle("l", g.dx < 0); w.classList.toggle("ready", Math.abs(g.dx) > THR); }
      if (Math.abs(g.dx) > THR && !g.buzzed) { g.buzzed = true; buzz(8); } if (Math.abs(g.dx) <= THR) g.buzzed = false;

  async function shopFail(t, err) {
    toast(/No matches found/i.test(String(err?.message || "")) ? "Notion 側でリストが変わっていました。読み直します" : `書き込めませんでした：${errText(err)}`);
    setSync("err");
    try { shopRaw[t.id] = { edited: t.edited, raw: await fetchBody(t.id) }; } catch { delete shopRaw[t.id]; }
    if (S.tab === "shop") render();
  }
  function touched(t) { t.edited = new Date().toISOString(); if (shopRaw[t.id]) shopRaw[t.id].edited = t.edited; }

  let shopLoading = false;
  async function loadShopBodies() {
    if (shopLoading || S.mode === "loading" || S.mode === "error") return;
    const todo = shopLists().filter((t) => shopRaw[t.id]?.edited !== t.edited).slice(0, 12);
    if (!todo.length) return;
    shopLoading = true;
    const worker = async () => { for (let t; (t = todo.shift());) { try { shopRaw[t.id] = { edited: t.edited, raw: await fetchBody(t.id) }; } catch { shopRaw[t.id] = { edited: t.edited, raw: "", err: true }; } } };
    await Promise.all([worker(), worker(), worker()]);
    shopLoading = false;
    if (S.tab === "shop" && S.shopSeg === "list" && $("#page").hidden && !document.activeElement?.matches("#shopin")) render();
  }

  function renderShop(view) {
    const lists = shopLists(); const soon = stockSoon().length;
    view.insertAdjacentHTML("beforeend", `<div class="seg">${[["list", "買い物リスト", lists.length], ["stock", "在庫・補充", soon ? `${soon}!` : S.stock.length]].map(([k, n, x]) => `<button type="button" data-shopseg="${k}" aria-pressed="${S.shopSeg === k}">${n}<span class="n">${x}</span></button>`).join("")}</div>`);
    if (S.shopSeg === "stock") return renderStock(view);
    // 足す先：チェックリストのあるリスト（なければ新しく作る）
    const targets = lists.filter((t) => shopRaw[t.id] ? shopParse(shopRaw[t.id].raw).items.length || !shopRaw[t.id].raw.trim() : /BUY|買い物/.test(t.name));
    if (!targets.some((t) => t.id === S.shopTarget)) S.shopTarget = targets[0]?.id || "";
    view.insertAdjacentHTML("beforeend", `<div class="card shopadd"><input id="shopin" type="text" maxlength="120" placeholder="買うものを足す（例：牛乳）" aria-label="買うもの" enterkeyhint="done">
      <select id="shopto" aria-label="足す先">${targets.map((t) => `<option value="${t.id}" ${t.id === S.shopTarget ? "selected" : ""}>${esc(short(t.name, 12))}</option>`).join("")}<option value="" ${S.shopTarget ? "" : "selected"}>＋ 新しいリスト</option></select>
      <button type="button" class="btn pri" data-shopadd="1">足す</button></div>
      <div class="card panel"><div class="panel-head"><b>買うもの</b><span class="mute" style="font-size:12px">BUY のタスク ${lists.length}件</span><div class="seg"><button type="button" data-shophide="1" aria-pressed="${S.shopHide}">買えたものを隠す</button></div></div><div class="shop" id="shopbox"></div></div>`);
    const box = $("#shopbox");
    if (!lists.length) { box.innerHTML = `<div class="empty">買うものはありません。\n上の欄から足すか、在庫・補充から選べます</div>`; return; }
    box.innerHTML = lists.map(shopCard).join(""); keepScroll(box);
    loadShopBodies();
  }
  function shopCard(t) {
    const m = metaOf(t); const got = shopRaw[t.id];
    const link = t.link ? `<a class="buylink" href="${esc(t.link)}" target="_blank" rel="noopener">🛒 開く</a>` : "";
    const head = `<div class="shead"><button type="button" class="sname" data-open="${t.id}">${esc(t.name)}</button>${link}<span class="meta${m.late ? " late" : ""}">${esc(t.date ? m.tx : STAGES[stageOf(t)].name)}</span></div>`;
    if (!got) return `<section class="slist">${head}<div class="mute sline">読みこみ中…</div></section>`;
    const { items } = shopParse(got.raw);
    if (!items.length) {
      // チェックリストのない買い物（1品だけ・ネット注文など）は、タスクごと済みにする
      return `<section class="slist one" style="--c:var(--s-today)"><div class="row"><button type="button" class="check" data-done="${t.id}" aria-label="買えた">✓</button><button type="button" class="main" data-open="${t.id}"><span class="nm">${esc(t.name)}</span><span class="sub">${esc(t.next || (t.refill?.length ? "補充" : ""))}</span></button>${link}<span class="meta${m.late ? " late" : ""}">${esc(t.date ? m.tx : "")}</span></div></section>`;
    }
    const left = items.filter((x) => !x.done).length; let g = null;
    const rowsHtml = items.filter((x) => !(S.shopHide && x.done)).map((x) => {
      const gh = x.group !== g ? ((g = x.group) ? `<div class="sgroup">${esc(g)}</div>` : "") : "";
      return `${gh}<button type="button" class="sitem${x.done ? " on" : ""}" data-shopitem="${t.id}:${x.li}" style="--d:${x.depth}" aria-pressed="${x.done}"><span class="check${x.done ? " on" : ""}" aria-hidden="true">✓</span><span class="tx">${esc(x.text)}</span></button>`;
    }).join("");
    const done = items.length - left;
    return `<section class="slist">${head}<div class="sprog"><i style="--p:${Math.round((done / items.length) * 100)}%"></i><span>${done}/${items.length}</span></div>${rowsHtml || `<div class="mute sline">全部買えました</div>`}
      <div class="sfoot">${done ? `<button type="button" class="btn" data-shopclear="${t.id}">買えた${done}品をリストから消す</button>` : ""}${!left ? `<button type="button" class="btn ok" data-shopdone="${t.id}">買い物を終える（済みにする）</button>` : ""}</div></section>`;
  }

  function toggleItem(id, li) {
    const t = known.get(id); const got = shopRaw[id]; if (!t || !got) return;
    const lines = got.raw.split("\n"); const line = lines[li]; const m = line?.match(TODO_RE); if (!m) return;
    const nl = line.replace(/\[( |x|X)\]/, m[2] === " " ? "[x]" : "[ ]");
    const [a, b] = uniqSpan(lines, li, li, got.raw);
    const old = lines.slice(a, b + 1).join("\n"); lines[li] = nl; const nw = lines.slice(a, b + 1).join("\n");
    got.raw = lines.join("\n"); touched(t); render();
    if (S.mode === "demo") { DEMO_BODIES[id] = got.raw; return; }
    setSync("busy");
    shopWrite(id, async () => {
      try { await call("update", { page_id: id, command: "update_content", content_updates: [{ old_str: old, new_str: nw }], allow_async: false }, { read: false }); setSync("ok"); }
      catch (err) { await shopFail(t, err); }
    });
  }
  async function addItem() {
    const i = $("#shopin"); const name = i.value.trim(); if (!name) { i.focus(); return; }
    const item = `- [ ] ${name.replace(/([\\*_`<>[\]~])/g, "\\$1")}`;
    const t = known.get($("#shopto").value);
    i.value = ""; i.focus();
    if (!t) {
      try { const nt = await createShopTask({ "名前": "買い物リスト", "枠": "🏠 家・外" }, item); shopRaw[nt.id] = { edited: nt.edited, raw: item }; S.shopTarget = nt.id; render(); toast("新しい買い物リストを作りました"); $("#shopin")?.focus(); }
      catch (err) { i.value = name; toast(`作れませんでした：${errText(err)}`); }
      return;
    }
    S.shopTarget = t.id;
    const got = shopRaw[t.id] || { raw: "" }; const lines = got.raw.split("\n");
    // 最後のチェック項目（とその下の入れ子）の後ろに足す。チェック項目がなければ本文の最後へ
    let k = -1; lines.forEach((l, n) => { if (TODO_RE.test(l)) k = n; });
    let job;
    if (k >= 0) {
      let j = k; const ind = lines[k].match(/^\s*/)[0].length; while (j + 1 < lines.length && lines[j + 1].trim() && lines[j + 1].match(/^\s*/)[0].length > ind) j++;
      const [a, b] = uniqSpan(lines, k, j, got.raw);
      const old = lines.slice(a, b + 1).join("\n"); const nwLines = lines.slice(a, b + 1); nwLines.splice(j - a + 1, 0, item);
      const nw = nwLines.join("\n"); lines.splice(j + 1, 0, item);
      job = () => call("update", { page_id: t.id, command: "update_content", content_updates: [{ old_str: old, new_str: nw }], allow_async: false }, { read: false });
    } else {
      if (got.raw.trim()) lines.push(""); lines.push(item);
      job = () => call("update", { page_id: t.id, command: "insert_content", content: item, allow_async: false }, { read: false });
    }
    shopRaw[t.id] = { ...got, raw: lines.join("\n").replace(/^\n+/, "") }; touched(t); render(); $("#shopin")?.focus();
    if (S.mode === "demo") { DEMO_BODIES[t.id] = shopRaw[t.id].raw; return; }
    setSync("busy");
    shopWrite(t.id, async () => { try { await job(); setSync("ok"); } catch (err) { await shopFail(t, err); } });
  }
  // 買えた項目（と、その下の入れ子）を本文から消す
  function clearChecked(id) {
    const t = known.get(id); const got = shopRaw[id]; if (!t || !got) return;
    const lines = got.raw.split("\n"); const chunks = [];
    for (let n = 0; n < lines.length; n++) {
      const m = lines[n].match(TODO_RE); if (!m || m[2] === " ") continue;
      let j = n; const ind = m[1].length; while (j + 1 < lines.length && lines[j + 1].trim() && lines[j + 1].match(/^\s*/)[0].length > ind) j++;
      const last = chunks.at(-1); if (last && last[1] === n - 1) last[1] = j; else chunks.push([n, j]);
      n = j;
    }
    if (!chunks.length) return;
    const keep = lines.filter((_, n) => !chunks.some(([a, b]) => n >= a && n <= b));
    const updates = chunks.map(([s, e]) => {
      let a = s, b = e; // 前後の1行を含めて1か所に決める
      if (a > 0) a--; else if (b < lines.length - 1) b++;
      [a, b] = uniqSpan(lines, a, b, got.raw);
      return { old_str: lines.slice(a, b + 1).join("\n"), new_str: lines.slice(a, b + 1).filter((_, k) => k + a < s || k + a > e).join("\n") };
    });
    const whole = !keep.some((l) => l.trim());
    got.raw = keep.join("\n"); touched(t); render();
    toast(`買えた ${chunks.reduce((n, [a, b]) => n + b - a + 1, 0)}行をリストから消しました`);
    if (S.mode === "demo") { DEMO_BODIES[id] = got.raw; return; }
    setSync("busy");
    shopWrite(id, async () => {
      try {
        if (whole) await call("update", { page_id: id, command: "replace_content", new_str: "", allow_async: false }, { read: false });
        else await call("update", { page_id: id, command: "update_content", content_updates: updates, allow_async: false }, { read: false });
        setSync("ok");
      } catch (err) { await shopFail(t, err); }
    });
  }

  async function createShopTask(props, content) {
    const now = new Date().toISOString();
    const all = { "ステータス": ST.next, "分類タグ": "BUY", "重さ": "S", "プレイヤー": [PLAYER], ...props };
    const local = (u) => toTask({ url: u, 名前: all["名前"], NEXT: all.NEXT || "", ステータス: all["ステータス"], 分類タグ: "BUY", 枠: all["枠"] || null, 重さ: "S", "userDefined:URL": all["userDefined:URL"] || "", 補充対象: JSON.stringify(all["補充対象"] || []), 最終更新日時: now, createdTime: now });
    if (S.mode === "demo") { const t = local(`https://www.notion.so/${"d".repeat(24)}${String(Date.now()).slice(-8)}`); S.tasks.push(t); DEMO_BODIES[t.id] = content || ""; return t; }
    setSync("busy");
    try {
      const res = await call("create", { parent: { type: "data_source_id", data_source_id: DS.task }, pages: [{ properties: all, ...(content ? { content } : {}) }], allow_async: false }, { read: false });
      const pg = (res.pages || [])[0] || {}; const t = local(pg.url || `https://www.notion.so/${String(pg.id || "").replace(/-/g, "")}`); S.tasks.push(t); saveSnap(); setSync("ok"); return t;
    } catch (err) { setSync("err"); throw err; }
  }

  // ---------- 在庫・補充 ----------
  function renderStock(view) {
    if (S.extraErr.stock && !S.stock.length) { view.insertAdjacentHTML("beforeend", `<div class="card panel"><div class="empty">DB_Daily を読めませんでした。\n${esc(S.extraErr.stock)}\n${VIA === "api" ? "Notion のインテグレーションを DB_Daily にも接続してください" : ""}</div></div>`); return; }
    const all = S.stock.map(stockCalc);
    const cats = [...new Set(all.map((x) => x.cat).filter(Boolean))];
    const out = all.filter((x) => x.left != null && x.left <= 0).length, week = all.filter((x) => x.left != null && x.left > 0 && x.left <= 7).length, listed = all.filter((x) => openRefills(x.id).length).length;
    view.insertAdjacentHTML("beforeend", `<div class="aihead"><div class="card"><div class="k">切れている</div><div class="n" style="color:var(--late)">${out}</div><div class="s">予定日を過ぎた</div></div><div class="card"><div class="k">7日以内</div><div class="n" style="color:var(--s-today)">${week}</div><div class="s">そろそろ買う</div></div><div class="card"><div class="k">リスト済み</div><div class="n">${listed}</div><div class="s">補充タスクあり</div></div></div>
      <div class="chips"><button type="button" class="chip" data-stockcat="" aria-pressed="${!S.stockCat}">すべて<span class="n">${all.length}</span></button>${cats.map((c) => `<button type="button" class="chip" data-stockcat="${esc(c)}" aria-pressed="${S.stockCat === c}">${esc(c)}<span class="n">${all.filter((x) => x.cat === c).length}</span></button>`).join("")}</div>
      <div class="card panel"><div class="shop" id="stockbox"></div></div>`);
    const items = all.filter((x) => !S.stockCat || x.cat === S.stockCat).sort((a, b) => (a.left ?? 1e9) - (b.left ?? 1e9) || a.name.localeCompare(b.name, "ja"));
    const box = $("#stockbox");
    if (!items.length) { box.innerHTML = `<div class="empty">${S.mode === "loading" ? "読みこみ中…" : "在庫の登録がありません"}</div>`; return; }
    box.innerHTML = items.map((x) => {
      const open = openRefills(x.id);
      const sub = [x.cat, x.left == null ? (x.use ? "購入日が未入力" : "使う数が未入力") : `${md(x.end)}まで`].filter(Boolean).join("・");
      return `<div class="row stockrow" style="--c:${leftColor(x)}"><span class="dot"></span><button type="button" class="main" data-stock="${x.id}"><span class="nm">${esc(x.name)}</span><span class="sub">${esc(sub)}</span></button><span class="meta${x.left != null && x.left <= 0 ? " late" : ""}">${esc(leftTx(x))}</span>
        ${open.length ? `<button type="button" class="btn ok sm" data-stockdone="${x.id}">補充した</button>` : `<button type="button" class="btn sm" data-stockadd="${x.id}">🛒 リストへ</button>`}</div>`;
    }).join(""); keepScroll(box);
  }
  // DB_Daily の「補充」ボタンと同じ形の補充タスクを作る（補充対象でつなぐと、済みにした日が最終補充日になる）
  async function stockAdd(id, btn) {
    const x = S.stock.find((s) => s.id === id); if (!x || openRefills(id).length) return;
    btn.disabled = true;
    try {
      await createShopTask({ "名前": `補充:${x.name}`, NEXT: x.link ? "リンクから注文する" : "買う", "枠": x.link ? "☼ 朝" : "🏠 家・外", "補充対象": [x.url], ...(x.link ? { "userDefined:URL": x.link } : {}) });
      render(); toast(`「${short(x.name)}」を買い物リストに入れました`);
    } catch (err) { btn.disabled = false; toast(`入れられませんでした：${errText(err)}`); }
  }
  async function stockDone(id) {
    const x = S.stock.find((s) => s.id === id); if (!x) return;
    const prev = S.refillDone[id];
    S.refillDone[id] = TODAY(); stockCalc(x);
    const ok = await Promise.all(openRefills(id).map((t) => setProps(t, { "ステータス": ST.done }, `「${short(x.name)}」を補充しました（${leftTx(x) || "記録"}）`, { undo: false })));
    if (ok.includes(false)) { if (prev) S.refillDone[id] = prev; else delete S.refillDone[id]; stockCalc(x); }
    saveSnap(); render();
  }
  function openStock(id) {
    const x = S.stock.find((s) => s.id === id); if (!x) return; stockCalc(x);
    const per = x.use && x.freq ? `${x.freq} ${x.use}${x.size ? `（1個 ${x.size}）` : ""}` : "";
    const fields = [["カテゴリ", x.cat], ["残り", leftTx(x)], ["切れる予定日", x.end ? `${md(x.end)}（${WD[dow(x.end)]}）` : ""], ["補充した日", x.base ? md(x.base) : ""], ["使い方", per], ["1個で", x.days != null ? `${x.days}日もつ` : ""], ["メモ", x.memo], ["URL", x.link], ["補充タスク", openRefills(id).map((t) => t.name).join("・")]];
    openPage({ kind: "stock", id: x.id, url: x.url, title: x.name, titleProp: "名前", fields, crumb: "DB_Daily ／ 在庫" });
  }

  function onShopClick(d, el) {
    if (d.shopseg) { S.shopSeg = d.shopseg; render(); return true; }
    if (d.shophide) { S.shopHide = !S.shopHide; render(); return true; }
    if (d.shopitem) { const k = d.shopitem.lastIndexOf(":"); toggleItem(d.shopitem.slice(0, k), +d.shopitem.slice(k + 1)); return true; }
    if (d.shopadd) { addItem(); return true; }
    if (d.shopclear) { clearChecked(d.shopclear); return true; }
    if (d.shopdone) { const t = known.get(d.shopdone); if (t) move(t, "done"); return true; }
    if (d.stockcat !== undefined && el.classList.contains("chip")) { S.stockCat = d.stockcat; render(); return true; }
    if (d.stockadd) { stockAdd(d.stockadd, el); return true; }
    if (d.stockdone) { stockDone(d.stockdone); return true; }
    if (d.stock) { openStock(d.stock); return true; }
    return false;
  }
  document.addEventListener("keydown", (e) => { if (e.target.id === "shopin" && e.key === "Enter" && !e.isComposing) { e.preventDefault(); addItem(); } });
  document.addEventListener("change", (e) => { if (e.target.id === "shopto") S.shopTarget = e.target.value; });
  // ================= 読む：書庫（📚 REFERENCE）にしおり（📖 すぐ読む）を挟んだものを集めて、その場で読む =================
  const READ_PROP = "📖 すぐ読む";
  const isRead = (t) => t?.read === "__YES__";
  // しおりのボタン（一覧の左端。資料の行ならどこでも押せる）
  const BM_SVG = (on) => `<svg viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`;
  const bmHtml = (t) => `<button type="button" class="bm${isRead(t) ? " on" : ""}" data-readtoggle="${t.id}" aria-label="${isRead(t) ? "すぐ読むから外す" : "すぐ読むに入れる"}" aria-pressed="${isRead(t)}">${BM_SVG(isRead(t))}</button>`;
  // 行の左端：資料ならしおり、それ以外は段の色の点
  const leadHtml = (t) => (t.status === ST.ref ? bmHtml(t) : `<span class="dot"></span>`);
  // しおりを挟む・外す
  async function setRead(t, on, msg) {
    const ok = await setProps(t, { [READ_PROP]: on ? "__YES__" : "__NO__" }, msg || (on ? `「${short(t.name)}」にしおりを挟みました` : `「${short(t.name)}」を読んだので外しました`));
    syncReadList(t);
    if (PG?.task === t && $("#pprops")) $("#pprops").innerHTML = propsHtml();
    return ok;
  }
  function syncReadList(t) {
    const i = S.readList.indexOf(t);
    if (isRead(t) && i < 0) S.readList.unshift(t);
    if (!isRead(t) && i >= 0) S.readList.splice(i, 1);
  }
  const readItems = () => S.readList.filter(isRead).filter((t) => !S.readTag || t.tag === S.readTag);

  function renderRead(view) {
    const all = S.readList.filter(isRead);
    view.insertAdjacentHTML("beforeend", `<div class="seg">${[["list", "しおり", all.length], ["shelf", "書庫", S.refs.length + (S.refMore ? "+" : "")]].map(([k, n, x]) => `<button type="button" data-readseg="${k}" aria-pressed="${(S.readSeg || "list") === k}">${n}<span class="n">${x}</span></button>`).join("")}</div>`);
    if (S.readSeg === "shelf") return renderShelf(view);
    const tags = [...new Set(all.map((t) => t.tag).filter(Boolean))];
    if (S.readTag && !tags.includes(S.readTag)) S.readTag = "";
    const items = readItems();
    view.insertAdjacentHTML("beforeend", `${tags.length > 1 ? `<div class="chips"><button type="button" class="chip" data-readtag="" aria-pressed="${!S.readTag}">すべて<span class="n">${all.length}</span></button>${tags.map((g) => `<button type="button" class="chip" data-readtag="${esc(g)}" aria-pressed="${S.readTag === g}">${esc(g)}<span class="n">${all.filter((t) => t.tag === g).length}</span></button>`).join("")}</div>` : ""}
      <div class="card panel"><div class="scroll" id="readbox"></div></div>`);
    const box = $("#readbox");
    if (!items.length) { box.innerHTML = `<div class="empty">${S.extraErr.read ? esc(S.extraErr.read) : "しおりを挟んだ資料はありません。\n「書庫」でしおり（📖）を押すと、ここに集まります"}</div>`; return; }
    box.innerHTML = `<div class="rhint mute">押すと読めます。左にスワイプで「読んだ」</div>` + items.map(readCard).join("");
    attachSwipe(box);
    prefetchRead(items);
  }
  function readCard(t) {
    const sm = S.bodies[t.id];
    const pv = sm?.conc ? `⭐ ${esc(short(sm.conc, 80))}` : t.next ? esc(t.next) : "";
