<style>
/* 美少女シミュレーションゲーム風。夜の部屋の背景に、ピンクの縁取りのメッセージ窓。字は丸ゴシック、見出しは金、操作はピンク */
:root {
  --bg: #1c1236;
  --card: rgba(38, 22, 66, .82);
  --sunk: rgba(255, 190, 230, .1);
  --ink: #fff4fb;
  --mute: #c7b4d8;
  --line: rgba(255, 182, 222, .28);
  --accent: #ff7eb6;
  --hi: #ffd86b;
  --late: #ff6b8a;
  --ok: #7be0a8;
  /* 段の色（パステル） */
  --s-inbox: #bdb6dc;
  --s-ai: #c9a2ff;
  --s-next: #7cc8ff;
  --s-plan: #7fe3d4;
  --s-today: #ffb36b;
  --s-wait: #ffe07a;
  --s-some: #a99fc4;
  --s-ref: #e6bd96;
  --s-done: #7be0a8;
  /* Notion の色（夜） */
  --n-gray: #a9a3b8; --n-brown: #c79a85; --n-orange: #e09a63; --n-yellow: #e0b85e; --n-green: #6fc496; --n-blue: #7aa7e6; --n-purple: #b98af0; --n-pink: #f080b8; --n-red: #f07a85;
  --nb-gray: #2c2638; --nb-brown: #3a2b2a; --nb-orange: #42301f; --nb-yellow: #3d3520; --nb-green: #1f3a2c; --nb-blue: #1f2d45; --nb-purple: #33264d; --nb-pink: #42253a; --nb-red: #44242c; --nb-default: #2a2140;
  --shadow: 0 0 0 1.5px rgba(255, 182, 222, .45), inset 0 0 0 1px rgba(255, 255, 255, .08), 0 6px 18px rgba(10, 0, 30, .35);
  --f: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
  --f-num: "M PLUS Rounded 1c", system-ui, sans-serif;
  --f-code: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { touch-action: manipulation; }
body { margin: 0; background: radial-gradient(120% 80% at 50% 0%, #0b1530 0%, var(--bg) 60%); color: var(--ink); font-family: var(--f); font-size: 14px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
input, textarea, select { font: inherit; color: var(--ink); }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.mute { color: var(--mute); }
.late { color: var(--late); }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; max-width: 760px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 10px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.top h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .02em; }
.top .date { color: var(--mute); font-size: 12.5px; }
.sync { margin-left: auto; font-size: 11.5px; color: var(--mute); display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.sync.busy i { background: var(--s-wait); animation: blink 1s infinite; }
.sync.err i { background: var(--late); }
@keyframes blink { 50% { opacity: .3; } }
.iconbtn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); font-size: 18px; flex: none; }
main { min-height: 0; min-width: 0; display: flex; flex-direction: column; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } }
nav.tabs { display: grid; grid-template-columns: repeat(7, 1fr); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); gap: 4px; }
nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 0 4px; border-radius: 12px; font-size: 11px; color: var(--mute); position: relative; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-pressed="true"] { color: var(--ink); background: var(--card); box-shadow: var(--shadow); font-weight: 700; }
nav.tabs .badge { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 10.5px; display: grid; place-items: center; font-family: var(--f-num); }

.card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); }
.seg { display: flex; gap: 3px; background: var(--sunk); border-radius: 11px; padding: 3px; flex: none; }
.seg button { flex: 1; text-align: center; padding: 5px 4px; border-radius: 8px; font-size: 12.5px; white-space: nowrap; color: var(--mute); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.seg button .n { font-family: var(--f-num); font-size: 11px; margin-left: 3px; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; flex: none; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chip .n { font-family: var(--f-num); font-size: 11px; margin-left: 3px; opacity: .8; }

/* 一覧 */
.list { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; touch-action: pan-y; }
.row { display: flex; align-items: center; gap: 10px; min-height: 50px; flex: none; padding: 6px 12px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.row:last-child { border-bottom: 0; }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 11.5px; color: var(--mute); white-space: nowrap; text-align: right; }
.row .meta.late { color: var(--late); font-weight: 700; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--c, var(--mute)); }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--c, var(--line)); flex: none; display: grid; place-items: center; color: transparent; font-size: 13px; transition: .2s; }
.check:hover { background: color-mix(in srgb, var(--c) 15%, transparent); }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.row.gone { animation: gone .35s ease-in forwards; }
@keyframes gone { to { transform: translateX(30%); opacity: 0; } }
.pager { display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 11.5px; color: var(--mute); padding: 4px 0 6px; flex: none; min-height: 26px; }
.pager button { padding: 0 8px; font-size: 14px; }
.pager button:disabled { opacity: .3; }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--mute); padding: 16px; font-size: 13px; white-space: pre-wrap; }
.in-l { animation: inl .22s ease-out; } .in-r { animation: inr .22s ease-out; }
@keyframes inl { from { transform: translateX(14%); opacity: 0; } }
@keyframes inr { from { transform: translateX(-14%); opacity: 0; } }
.tag { font-size: 10.5px; padding: 0 6px; border-radius: 5px; background: var(--sunk); color: var(--mute); white-space: nowrap; }
.ai-mark { font-size: 12px; }

/* 流れ（GTD） */
.flow { flex: none; position: relative; padding: 4px 0 0; }
.flow svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.flow .edge { fill: none; stroke: var(--mute); stroke-opacity: .35; stroke-width: 1.6; stroke-dasharray: 3 3; }
.flow .pt { fill: var(--c); opacity: .85; }
.nodes { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(4, auto); gap: 14px 8px; }
.node { --c: var(--mute); position: relative; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 6px 8px 5px; border-top: 3px solid var(--c); min-width: 0; text-align: left; transition: transform .15s; }
.node:active { transform: scale(.97); }
.node[aria-pressed="true"] { outline: 2px solid var(--c); outline-offset: 1px; }
.node .k { font-size: 11.5px; font-weight: 700; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.node .n { font-family: var(--f-num); font-size: 20px; line-height: 1.1; display: block; }
.node .s { font-size: 10px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.node .s.late { color: var(--late); font-weight: 700; }
.node .flag { position: absolute; top: -8px; right: 6px; font-size: 10px; padding: 0 6px; border-radius: 8px; background: var(--c); color: #fff; font-weight: 700; }
.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px 6px; flex: none; }
.panel-head b { font-size: 14.5px; }
.panel-head .seg { margin-left: auto; }
.panel-head .seg button { padding: 3px 8px; font-size: 11.5px; }
.board { flex: 1; min-height: 0; display: flex; gap: 8px; overflow-x: auto; padding: 0 10px 10px; scroll-snap-type: x mandatory; }
.col { flex: 0 0 72%; max-width: 240px; scroll-snap-align: start; background: var(--sunk); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 5px; min-height: 0; overflow: hidden; }
.col h4 { margin: 0; font-size: 12px; padding: 2px 4px; display: flex; justify-content: space-between; }
.bcard { background: var(--card); border-radius: 9px; padding: 6px 8px; font-size: 12.5px; box-shadow: var(--shadow); text-align: left; width: 100%; flex: none; }
.bcard .sub { font-size: 11px; color: var(--mute); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tablewrap { flex: 1; min-height: 0; overflow: auto; }
table.grid { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 7px 10px; white-space: nowrap; text-align: left; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
table.grid th { position: sticky; top: 0; background: var(--card); color: var(--mute); font-weight: 500; font-size: 11.5px; z-index: 1; }
table.grid tr.click { cursor: pointer; }
table.grid tr.click:hover td { background: var(--sunk); }

/* AI */
.aihead { display: flex; gap: 8px; flex: none; }
.aihead .card { flex: 1; padding: 8px 10px; min-width: 0; }
.aihead .k { font-size: 11px; color: var(--mute); }
.aihead .n { font-family: var(--f-num); font-size: 22px; line-height: 1.1; }
.aihead .s { font-size: 10.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aihead .mine { border-left: 4px solid var(--accent); }
.aicard { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; flex: none; }
.aicard:last-child { border-bottom: 0; }
.aicard .t { display: flex; gap: 8px; align-items: center; }
.aicard .t b { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aicard .what { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); white-space: nowrap; font-weight: 700; }
.aicard .what.ans { background: color-mix(in srgb, var(--s-today) 16%, transparent); color: var(--s-today); }
.aicard .pv { font-size: 12px; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.aicard .pv b { color: var(--ink); font-weight: 500; }
.clar { display: inline-flex; align-items: center; gap: 5px; }
.clar i { display: inline-block; width: 46px; height: 5px; border-radius: 3px; background: var(--sunk); position: relative; overflow: hidden; }
.clar i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p); background: var(--accent); }
.form { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.form label { font-size: 11.5px; color: var(--mute); }
.form input, .form textarea { width: 100%; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.form textarea { min-height: 70px; resize: none; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.modes button { border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 8px; font-size: 12px; text-align: left; }
.modes button b { display: block; font-size: 13px; }
.modes button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.btn { height: 38px; border-radius: 10px; padding: 0 14px; background: var(--sunk); font-weight: 500; text-align: center; white-space: nowrap; }
.btn.pri { background: var(--accent); color: #fff; }
.btn.ok { background: var(--ok); color: #fff; }
.btn:disabled { opacity: .5; }

/* 仕分け */
.pile { flex: 1; min-height: 0; position: relative; }
.tcard { position: absolute; inset: 4px 2px 10px; background: var(--card); border-radius: 18px; box-shadow: 0 6px 20px rgba(20, 25, 35, .12); padding: 16px; display: flex; flex-direction: column; gap: 8px; touch-action: none; transition: transform .3s cubic-bezier(.2, .9, .3, 1), opacity .3s; border-top: 4px solid var(--c); }
.tcard.b1 { transform: translateY(8px) scale(.96); opacity: .6; }
.tcard.b2 { transform: translateY(16px) scale(.92); opacity: .3; }
.tcard h3 { margin: 0; font-size: 19px; line-height: 1.4; }
.tcard .nx { font-size: 13px; color: var(--mute); }
.tcard .nx b { color: var(--ink); font-weight: 500; }
.tcard .pv { font-size: 13px; background: var(--nb-yellow); border-radius: 10px; padding: 8px 10px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; }
.tcard .meta { margin-top: auto; display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--mute); align-items: center; }
.stamp { position: absolute; top: 18px; font-weight: 700; font-size: 15px; padding: 2px 10px; border: 2.5px solid; border-radius: 8px; opacity: 0; pointer-events: none; background: var(--card); }
.stamp.r { left: 16px; color: var(--s-next); transform: rotate(-8deg); } .stamp.l { right: 16px; color: var(--s-some); transform: rotate(8deg); } .stamp.u { left: 50%; top: auto; bottom: 70px; transform: translateX(-50%); color: var(--s-ai); } .stamp.d { left: 50%; transform: translateX(-50%); color: var(--s-ref); }
.dirs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: none; }
.dirs button { height: 48px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25; text-align: center; }
.dirs button b { font-size: 15px; color: var(--c); }
.subacts { display: flex; gap: 6px; flex: none; }
.subacts button { flex: 1; height: 32px; border-radius: 10px; background: var(--sunk); font-size: 12px; text-align: center; }

/* 記録 */
.statrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: none; }
.stat { padding: 8px 10px; }
.stat .k { font-size: 11px; color: var(--mute); }
.stat .n { font-family: var(--f-num); font-size: 20px; line-height: 1.15; }
.stat .s { font-size: 10.5px; color: var(--mute); }
.verdict { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; flex: none; text-align: left; width: 100%; }
.verdict b { font-size: 14px; }
.verdict .nx { font-size: 12.5px; }
.chart svg { display: block; width: 100%; }
.chart text { font-family: var(--f-num); font-size: 9.5px; fill: var(--mute); }
.legend { display: flex; gap: 12px; font-size: 11px; color: var(--mute); padding: 6px 12px 0; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.dayhead { font-size: 11px; color: var(--mute); padding: 6px 12px 2px; flex: none; font-weight: 700; }

/* ページ（詳細） */
#page { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; animation: pagein .25s cubic-bezier(.2, .9, .3, 1); }
@keyframes pagein { from { transform: translateY(16px); opacity: 0; } }
#page[hidden] { display: none; }
.pbar { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); flex: none; }
.pbar .crumb { flex: 1; min-width: 0; font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbar a { font-size: 12px; color: var(--accent); white-space: nowrap; }
.savestate { font-size: 11.5px; color: var(--mute); white-space: nowrap; }
.savestate.err { color: var(--late); }
.pscroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); }
.pinner { max-width: 720px; margin: 0 auto; }
.ptitle { font-size: 26px; font-weight: 700; line-height: 1.3; margin: 6px 0 10px; outline: none; overflow-wrap: anywhere; }
.props { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; font-size: 13px; margin-bottom: 10px; align-items: center; }
.props dt { color: var(--mute); white-space: nowrap; display: flex; gap: 6px; align-items: center; min-height: 30px; }
.props dd { margin: 0; min-width: 0; }
.props select, .props input { background: transparent; border: 0; border-radius: 6px; padding: 4px 6px; font-size: 13px; max-width: 100%; }
.props select:hover, .props input:hover { background: var(--sunk); }
.props input[type="text"] { width: 100%; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 5px; background: var(--sunk); margin: 1px 4px 1px 0; }
.aibar { margin: 0 0 12px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 8%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.aibar .h { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.aibar .h b { color: var(--accent); }
.aibar .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.aibar .acts .btn { height: 34px; font-size: 12.5px; }
.aibar textarea { width: 100%; min-height: 56px; resize: vertical; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 13.5px; }
.qa { display: flex; flex-direction: column; gap: 12px; }
.q { background: var(--card); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.q .qt { font-weight: 700; font-size: 13.5px; }
.q .opt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 9px; border: 1.5px solid var(--line); font-size: 13px; text-align: left; width: 100%; }
.q .opt i { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--mute); flex: none; margin-top: 1px; display: grid; place-items: center; font-style: normal; font-size: 12px; color: transparent; }
.q .opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.q .opt[aria-pressed="true"] i { background: var(--accent); border-color: var(--accent); color: #fff; }
.q input { width: 100%; background: var(--sunk); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; font-size: 13.5px; }
.decide { display: flex; flex-direction: column; gap: 6px; }
.decide .row2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.decide .row2 .btn { height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; font-size: 12px; padding: 0 4px; }
.decide .row2 .btn small { font-size: 10px; opacity: .8; }
.divline { height: 1px; background: var(--line); margin: 10px 0 14px; }

/* エディタ（Notion と同じ書き方） */
.ed { font-size: 15px; line-height: 1.6; padding-bottom: 40px; }
.blk { position: relative; display: flex; align-items: flex-start; gap: 2px; margin: 1px 0; border-radius: 4px; }
.blk > .hdl { position: absolute; left: -24px; top: 3px; width: 20px; height: 22px; border-radius: 4px; color: var(--mute); opacity: 0; font-size: 13px; display: grid; place-items: center; cursor: pointer; }
.blk:hover > .hdl, .blk.focus > .hdl { opacity: .7; }
@media (hover: none) { .blk.focus > .hdl { opacity: .7; left: -22px; } }
.blk > .body { flex: 1; min-width: 0; }
.tx { outline: none; min-height: 1.6em; padding: 2px 2px; white-space: pre-wrap; overflow-wrap: anywhere; caret-color: var(--ink); }
.tx:empty::before { content: attr(data-ph); color: var(--mute); opacity: .55; pointer-events: none; }
.blk:not(.focus) > .body > .tx.para:empty::before { content: ""; }
.tx b, .tx strong { font-weight: 700; }
.tx code { font-family: ui-monospace, monospace; font-size: .86em; background: var(--sunk); color: var(--n-red); padding: 1px 4px; border-radius: 4px; }
.tx a { color: inherit; text-decoration: underline; text-decoration-color: var(--mute); }
.tx .mention, .tx .atom { color: var(--mute); background: var(--sunk); border-radius: 4px; padding: 0 4px; font-size: .92em; white-space: nowrap; }
.tx .mention a { color: inherit; text-decoration: none; }
.h1 .tx { font-size: 1.85em; font-weight: 700; line-height: 1.3; margin-top: .9em; }
.h2 .tx { font-size: 1.45em; font-weight: 700; line-height: 1.3; margin-top: .8em; }
.h3 .tx { font-size: 1.2em; font-weight: 700; line-height: 1.3; margin-top: .6em; }
.h4 .tx { font-size: 1.05em; font-weight: 700; margin-top: .5em; }
.mk { flex: none; width: 24px; display: flex; justify-content: center; padding-top: 2px; user-select: none; }
.bul .mk::before { content: "•"; font-size: 1.3em; line-height: 1.2; }
.kids .kids .bul .mk::before { content: "◦"; }
.kids .kids .kids .bul .mk::before { content: "▪"; font-size: .9em; }
.num .mk { font-variant-numeric: tabular-nums; }
.todo .mk button { width: 16px; height: 16px; border: 1.5px solid var(--ink); border-radius: 3px; margin-top: 4px; display: grid; place-items: center; font-size: 11px; color: #fff; }
.todo.on .mk button { background: var(--n-blue); border-color: var(--n-blue); }
.todo.on > .body > .tx { color: var(--mute); text-decoration: line-through; }
.tog > .mk button { width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; transition: transform .15s; font-size: 11px; }
.tog.open > .mk button { transform: rotate(90deg); }
.tog:not(.open) > .body > .kids { display: none; }
.quote > .body { border-left: 3px solid var(--ink); padding-left: 12px; }
.call > .body { background: var(--cbg, var(--nb-default)); border-radius: 6px; padding: 12px 14px 12px 44px; position: relative; }
.call > .body > .ic { position: absolute; left: 12px; top: 12px; font-size: 18px; line-height: 1.4; cursor: pointer; }
.kids { margin-left: 0; }
.blk.bul > .body > .kids, .blk.num > .body > .kids, .blk.todo > .body > .kids, .blk.para > .body > .kids, .blk.tog > .body > .kids { margin-left: -2px; }
.div > .body hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.code > .body { background: var(--sunk); border-radius: 6px; padding: 10px 12px; position: relative; }
.code .tx { font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.5; white-space: pre; overflow-x: auto; }
.code .lang { position: absolute; right: 8px; top: 4px; font-size: 10.5px; color: var(--mute); }
.tblk > .body { overflow-x: auto; }
.tblk table { border-collapse: collapse; font-size: 13.5px; }
.tblk td, .tblk th { border: 1px solid var(--line); padding: 5px 8px; min-width: 64px; vertical-align: top; text-align: left; }
.tblk th, .tblk tr.hd td { background: var(--sunk); font-weight: 700; }
.tblk .cell { outline: none; white-space: pre-wrap; }
.ro > .body { font-size: 13px; color: var(--mute); background: var(--sunk); border-radius: 6px; padding: 6px 10px; display: flex; gap: 8px; align-items: center; }
.ro > .body a { color: var(--accent); margin-left: auto; white-space: nowrap; }
.toc > .body { font-size: 13.5px; color: var(--mute); display: flex; flex-direction: column; }
.toc a { color: var(--mute); text-decoration: underline; text-decoration-color: var(--line); padding: 1px 0; }
.toc .l3 { padding-left: 16px; } .toc .l4 { padding-left: 32px; }
.c-gray { color: var(--n-gray); } .c-brown { color: var(--n-brown); } .c-orange { color: var(--n-orange); } .c-yellow { color: var(--n-yellow); } .c-green { color: var(--n-green); } .c-blue { color: var(--n-blue); } .c-purple { color: var(--n-purple); } .c-pink { color: var(--n-pink); } .c-red { color: var(--n-red); }
.bg-gray { background: var(--nb-gray); } .bg-brown { background: var(--nb-brown); } .bg-orange { background: var(--nb-orange); } .bg-yellow { background: var(--nb-yellow); } .bg-green { background: var(--nb-green); } .bg-blue { background: var(--nb-blue); } .bg-purple { background: var(--nb-purple); } .bg-pink { background: var(--nb-pink); } .bg-red { background: var(--nb-red); }
.menu { position: fixed; z-index: 60; background: var(--card); border-radius: 10px; box-shadow: 0 8px 30px rgba(0, 0, 0, .2); padding: 4px; min-width: 200px; max-height: 320px; overflow-y: auto; font-size: 13.5px; }
.menu button { display: flex; gap: 10px; align-items: center; width: 100%; padding: 6px 10px; border-radius: 6px; }
.menu button i { font-style: normal; width: 22px; text-align: center; color: var(--mute); }
.menu button[aria-selected="true"], .menu button:hover { background: var(--sunk); }
.menu .lab { font-size: 11px; color: var(--mute); padding: 4px 10px 2px; }
.fmt { position: fixed; z-index: 60; display: flex; gap: 2px; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 3px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
.fmt button { min-width: 30px; height: 30px; border-radius: 6px; text-align: center; font-size: 13px; }
.fmt button:hover { background: rgba(255, 255, 255, .15); }

#toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 12px; font-size: 13px; z-index: 80; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0, 0, 0, .2); animation: fade .2s; display: flex; gap: 12px; align-items: center; }
#toast button { color: var(--accent); font-weight: 700; white-space: nowrap; }
#modal { position: fixed; inset: 0; z-index: 70; background: rgba(15, 18, 24, .4); display: flex; align-items: flex-end; justify-content: center; }
#modal[hidden] { display: none; }
#modal .sheet { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--card); border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .25s cubic-bezier(.2, .9, .3, 1); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
#modal h3 { margin: 0; padding: 14px 14px 0; font-size: 16px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* iPhone は16px未満の入力欄を押すと画面を拡大するので、入力欄は16px以上にする */
input, textarea, select { font-size: 16px !important; }
.ed { font-size: 16px; }
@media (pointer: coarse) { .code .tx, .tblk table, .tx.cell, .cell { font-size: 16px; } }

/* ===== 買う ===== */
.shop { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: 10px; }
.shopadd { display: flex; gap: 6px; padding: 6px; flex: none; align-items: center; }
.shopadd input { flex: 1; min-width: 0; height: 38px; background: var(--sunk); border: 0; border-radius: 10px; padding: 0 10px; color: var(--ink); }
.shopadd select { max-width: 32%; height: 38px; background: var(--sunk); border: 0; border-radius: 10px; color: var(--ink); padding: 0 4px; }
.slist { padding: 4px 12px 10px; border-bottom: 1px solid var(--line); }
.slist:last-child { border-bottom: 0; }
.slist.one { padding: 0; }
.shead { display: flex; align-items: center; gap: 8px; padding: 6px 0 2px; }
.shead .sname { flex: 1; min-width: 0; text-align: left; font-weight: 700; font-size: 15px; color: var(--hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shead .meta { font-size: 11.5px; color: var(--mute); white-space: nowrap; }
.shead .meta.late { color: var(--late); font-weight: 700; }
.buylink { font-size: 12px; color: var(--accent); white-space: nowrap; padding: 4px 6px; }
.sprog { display: flex; align-items: center; gap: 8px; font-family: var(--f-num); font-size: 11px; color: var(--mute); padding: 2px 0 4px; }
.sprog i { flex: 1; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--ok) var(--p), var(--line) var(--p)); box-shadow: 0 0 6px -1px var(--ok); }
.sgroup { font-size: 11px; color: var(--s-next); letter-spacing: .08em; padding: 10px 0 2px; font-weight: 700; }
.sitem { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 46px; text-align: left; padding: 4px 0 4px calc(var(--d, 0) * 24px); font-size: 16px; border-bottom: 1px dashed var(--line); }
.sitem .check { --c: var(--s-today); }
.sitem .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sitem.on .tx { text-decoration: line-through; color: var(--mute); }
.sline { font-size: 12.5px; padding: 8px 0; }
.sfoot { display: flex; gap: 8px; padding-top: 8px; flex-wrap: wrap; }
.sfoot:empty { display: none; }
.sfoot .btn { height: 34px; font-size: 12.5px; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12px; flex: none; }
.stockrow .meta { min-width: 56px; }

/* ===== 流れ（本流のパイプと置き場） ===== */
.pipe { display: flex; align-items: stretch; gap: 0; flex: none; }
.pipe .step { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; align-items: center; padding: 8px 2px 6px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); border-bottom: 2px solid var(--c); text-align: center; transition: transform .15s, box-shadow .2s; }
.pipe .step:active { transform: scale(.96); }
.pipe .step[aria-pressed="true"] { box-shadow: 0 0 0 1.5px var(--c), 0 0 16px -3px var(--c), inset 0 -18px 24px -20px var(--c); }
.pipe .no { position: absolute; top: 4px; left: 6px; font-family: var(--f-num); font-size: 9px; color: var(--c); opacity: .9; }
.pipe .n { font-family: var(--f-num); font-size: 21px; line-height: 1.15; color: var(--ink); text-shadow: 0 0 10px color-mix(in srgb, var(--c) 55%, transparent); }
.pipe .k { font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.pipe .s { font-size: 9.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pipe .s.late { color: var(--late); font-weight: 700; }
.pipe .arr { flex: none; width: 10px; align-self: center; height: 2px; background: linear-gradient(90deg, var(--line), rgba(110, 190, 255, .6)); position: relative; }
.pipe .arr::after { content: ""; position: absolute; right: -1px; top: -3px; border: 4px solid transparent; border-left: 5px solid rgba(110, 190, 255, .7); border-right: 0; }
.park { display: flex; align-items: center; gap: 6px; flex: none; }
.park .lbl { font-size: 10.5px; color: var(--mute); letter-spacing: .1em; flex: none; }
.park .pk { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 11px; background: var(--card); box-shadow: var(--shadow); font-size: 12.5px; white-space: nowrap; }
.park .pk i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); flex: none; }
.park .pk b { margin-left: auto; font-family: var(--f-num); font-size: 13px; font-weight: 500; }
.park .pk[aria-pressed="true"] { box-shadow: 0 0 0 1.5px var(--c), 0 0 12px -3px var(--c); }
.cbubble { display: flex; align-items: center; gap: 10px; flex: none; padding: 6px 10px 6px 6px; border-radius: 16px; background: linear-gradient(90deg, rgba(166, 133, 255, .16), rgba(10, 20, 36, .84)); box-shadow: 0 0 0 1px rgba(166, 133, 255, .35); font-size: 12.5px; }
.face { display: block; border-radius: 50%; background-color: #1a2440; background-repeat: no-repeat; flex: none; }
.cbubble .face { width: 40px; height: 40px; box-shadow: 0 0 0 1.5px var(--accent), 0 0 10px rgba(166, 133, 255, .6); }
.cbubble .tx { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
.cbubble .tx b { color: var(--accent); margin-right: 6px; font-size: 11.5px; }
.cbubble i { font-style: normal; color: var(--mute); font-size: 18px; }
.panel-head .ttl { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.panel-head .ttl small { font-size: 10.5px; color: var(--mute); }
.iconbtn.sm { width: 28px; height: 28px; font-size: 18px; border-radius: 9px; }
.iconbtn:disabled { opacity: .3; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.scroll.in-l { animation: inl .22s ease-out; } .scroll.in-r { animation: inr .22s ease-out; }
@keyframes inl { from { transform: translateX(28px); opacity: 0; } } @keyframes inr { from { transform: translateX(-28px); opacity: 0; } }
.empty small { font-size: 11px; }

/* ===== 行：日付ボタン・URL ===== */
.row .qbtn { display: flex; align-items: center; gap: 3px; padding: 6px 4px 6px 8px; border-radius: 9px; }
.row .qbtn i { font-style: normal; font-size: 9px; opacity: .6; }
.row .qbtn:active { background: var(--sunk); }
.row .lnk { flex: none; font-size: 14px; padding: 6px 2px; text-decoration: none; }
.ulink { color: var(--accent); overflow-wrap: anywhere; }

/* ===== すぐ変える（日付・状態・AI） ===== */
.quick { display: flex; flex-direction: column; gap: 8px; margin: 2px 0 12px; padding: 10px; border-radius: 14px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
.qrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ql { font-size: 10.5px; color: var(--mute); width: 30px; flex: none; letter-spacing: .08em; }
.qc { --c: var(--s-next); display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 11px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); font-size: 12.5px; white-space: nowrap; position: relative; }
.qc small { font-family: var(--f-num); font-size: 9.5px; color: var(--mute); }
.qc:active { transform: scale(.95); }
.qc.on { background: color-mix(in srgb, var(--c) 22%, var(--card)); color: var(--hi); }
.qc.ok { --c: var(--ok); color: var(--ok); }
.qc.ai { --c: var(--s-ai); }
.qc:disabled { opacity: .6; }
.qc.pick input { position: absolute; inset: 0; opacity: 0; width: 100%; }
.qhead { display: flex; align-items: center; gap: 8px; }

/* ===== コンシェルジュ ===== */
#cfab { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 30; width: 54px; height: 54px; border-radius: 50%; padding: 0; box-shadow: 0 0 0 2px var(--accent), 0 0 18px rgba(166, 133, 255, .6); animation: float 4s ease-in-out infinite; }
#cfab .face { width: 54px; height: 54px; }
#cfab .badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--late); color: #fff; font-size: 11px; display: grid; place-items: center; font-family: var(--f-num); padding: 0 4px; }
@keyframes float { 50% { transform: translateY(-4px); } }
@media (min-width: 800px) { #cfab { right: calc(50% - 380px + 14px); } }
.concierge { padding: 0 0 6px; }
.stage { position: relative; display: flex; align-items: flex-end; gap: 4px; padding: 6px 12px 0; min-height: min(58vh, 470px); background: radial-gradient(60% 55% at 32% 80%, rgba(79, 195, 255, .16), transparent 70%), radial-gradient(40% 30% at 30% 98%, rgba(166, 133, 255, .35), transparent 70%); border-bottom: 1px solid var(--line); }
.stage::after { content: ""; position: absolute; left: 6%; width: 52%; bottom: 6px; height: 14px; border-radius: 50%; background: radial-gradient(closest-side, rgba(79, 195, 255, .45), transparent); pointer-events: none; }
.stage canvas { width: 48%; height: min(56vh, 450px); flex: none; cursor: pointer; position: relative; z-index: 1; }
.say { flex: 1; min-width: 0; align-self: center; position: relative; padding: 12px 12px 10px; border-radius: 16px; background: rgba(10, 20, 36, .9); box-shadow: 0 0 0 1px rgba(166, 133, 255, .45), 0 0 18px rgba(166, 133, 255, .18); margin-bottom: 18%; }
.say::before { content: ""; position: absolute; left: -7px; top: 26px; border: 7px solid transparent; border-right-color: rgba(166, 133, 255, .55); border-left: 0; }
.say .cn { font-weight: 700; font-size: 16px; color: var(--hi); display: flex; flex-direction: column; line-height: 1.2; }
.say .cn small { font-size: 10.5px; color: var(--accent); font-weight: 500; }
.say p { margin: 8px 0 8px; font-size: 13.5px; line-height: 1.65; }
.say p.pop { animation: pop .3s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } }
.cswap { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: var(--sunk); }
.wardrobe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 16px 2px; }
.wardrobe button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; background: var(--sunk); text-align: center; }
.wardrobe button[aria-pressed="true"] { box-shadow: 0 0 0 1.5px var(--hi); }
.wardrobe .face { width: 52px; height: 52px; }
.wardrobe .auto { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-num); font-size: 10px; color: var(--hi); background: rgba(255, 232, 31, .1); box-shadow: inset 0 0 0 1px rgba(255, 232, 31, .4); }
.wardrobe b { font-size: 12px; } .wardrobe small { font-size: 9.5px; color: var(--mute); line-height: 1.3; }
.clist { display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 12px; }
.csug { padding: 10px 12px; border-radius: 14px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
.csug h4 { margin: 0 0 2px; font-size: 14px; display: flex; gap: 6px; align-items: baseline; }
.csug p { margin: 0 0 6px; font-size: 12.5px; color: var(--mute); }
.crow { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.cname { flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; font-size: 13px; }
.cname small { font-size: 10.5px; color: var(--mute); }
.cacts { display: flex; gap: 4px; flex-wrap: wrap; }
.cacts .qc { height: 28px; padding: 0 9px; font-size: 11.5px; }

/* ===== ニュース ===== */
.newsdays { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.news { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.news.read { opacity: .55; }
.nh { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.nc { font-family: var(--f-num); font-size: 10px; padding: 1px 7px; border-radius: 8px; background: rgba(255, 232, 31, .14); color: var(--hi); }
.na { font-size: 10.5px; color: var(--s-next); } .nt { font-size: 10.5px; color: var(--mute); }
.ntitle { display: block; font-size: 15.5px; font-weight: 700; line-height: 1.45; color: var(--ink); text-decoration: none; text-align: left; }
.ntitle:active { color: var(--hi); }
.nsum { margin: 4px 0 0; font-size: 12.5px; color: var(--mute); line-height: 1.6; }
.nsrc { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.nsrc a, .nsrc span { font-size: 11.5px; padding: 2px 9px; border-radius: 10px; background: var(--sunk); color: var(--accent); text-decoration: none; }
.nsrc a.r { color: var(--mute); }
.nact { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.nact .qc { height: 28px; font-size: 11.5px; }

/* ===== 洗練：余白・タブ・行 ===== */
nav.tabs button { font-size: 10px; letter-spacing: .02em; }
nav.tabs button svg { width: 21px; height: 21px; }
.row { transition: background .15s; }
.row:active { background: rgba(79, 195, 255, .06); }
.panel-head { padding: 9px 12px 7px; border-bottom: 1px solid var(--line); }
.card.panel { border-radius: 16px; }
#modal .sheet::before { content: ""; display: block; width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }

/* ===== 美少女ゲーム風 ===== */
body { background: #1c1236; }
body::before { content: ""; position: fixed; inset: 0; z-index: 0; background: linear-gradient(rgba(28, 14, 54, .78), rgba(28, 14, 54, .9)), var(--bgimg, none) center / cover no-repeat; pointer-events: none; }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#app { position: relative; z-index: 1; }
.num, .pipe .n, .park .pk b, .aihead .n, .node .n { font-weight: 800; }

  const $ = (s, el = document) => el.querySelector(s);

  const addMonths = (d, n) => { const x = new Date(`${d}T00:00:00Z`); x.setUTCMonth(x.getUTCMonth() + n); return x.toISOString().slice(0, 10); };
  const dow = (d) => new Date(`${d}T00:00:00Z`).getUTCDay();
  const diffDays = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400e3);
  const ageOf = (t) => (t.edited ? diffDays(jst(Date.parse(t.edited)), TODAY()) : 0);

  const idOf = (url) => (String(url || "").replace(/-/g, "").match(/([0-9a-f]{32})(?:\?|$|#)/i) || [])[1]?.toLowerCase() || "";

  };

  // ================= AI =================
  function conclusionOf(raw) {

  // 💬 の最新の質問票を読む（質問・選択肢・コメント欄・明確度・決めることリスト）
  function qaParse(raw) {
    const L = raw.split("\n");
    let h = -1;
    L.forEach((l, i) => { if (/^##\s/.test(l) && /💬/.test(l)) { if (/最新/.test(l)) h = i; else if (h < 0 || !/最新/.test(L[h])) h = i; } });
    if (h < 0) return null;
    let end = h + 1; while (end < L.length && !/^##\s/.test(L[end]) && !/^###\s*🗂/.test(L[end])) end++;
    const sec = L.slice(h, end);
    const qa = { h, end, sec, qs: [], decide: [], clarity: null };
    const cl = sec.join("\n").match(/明確度\s*([0-9]+)\s*\/\s*([0-9]+)/); if (cl) qa.clarity = [+cl[1], +cl[2]];
    let mode = null; let cur = null;
    sec.forEach((l, i) => {
      if (/^#{3,4}\s.*決めること/.test(l)) { mode = "decide"; return; }
      const qm = l.match(/^(?:#{3,4}\s*)?(?:\*\*|<b>)?\s*(?:❓\s*)?(Q\s*\d+[\s\S]*)$/);
      if (qm && !/^\s*[-*+]\s/.test(l)) { mode = "q"; cur = { title: text(qm[1].replace(/(\*\*|<\/?b>)/g, "")), opts: [], comment: null, line: i }; qa.qs.push(cur); return; }
      if (/^#{3,4}\s/.test(l)) { mode = null; return; }
      const om = l.match(/^(\s*)[-*]\s+\[( |x|X)\]\s+(.*)$/);

      if (om && mode === "q" && cur) { cur.opts.push({ i, text: text(om[3]), checked: om[2] !== " ", was: om[2] !== " " }); return; }
      const cm = l.match(/^(\s*(?:[-*]\s+)?(?:<b>|\*\*)?\s*(?:💬\s*コメント|回答)\s*(?:<\/b>|\*\*)?\s*[:：]\s*)(.*)$/);
      if (cm && mode === "q" && cur) { cur.comment = { i, prefix: cm[1], value: text(cm[2]), was: cm[2] }; }
    });

  // 質問票への回答を本文に書く（最新のやり取りの節だけを置き換える）

  // 本文の最後にメモを足す（再調査の指示・いつかの理由）

  async function memoToPage(P, line) {

  function pickForAi() {

  // ================= 買う：買い物リスト（BUYタスクの本文のチェックリスト）と在庫（DB_Daily） =================
  const SHOP_OPEN = [ST.next, ST.doing, ST.inbox, ST.wait];
  const TODO_RE = /^(\s*)[-*+] \[( |x|X)\] ?(.*)$/;
  const shopScroll = {}; // 描き直してもスクロール位置を保つ
  document.addEventListener("scroll", (e) => { if (e.target.id === "shopbox" || e.target.id === "stockbox") shopScroll[e.target.id] = e.target.scrollTop; }, true);
  const keepScroll = (box) => { box.scrollTop = shopScroll[box.id] || 0; };
  const shopRaw = {}; // タスクid → { edited, raw }
  const shopQ = {}; // タスクid → 書き込みの順番待ち
  const shopLists = () => S.tasks.filter((t) => SHOP_OPEN.includes(t.status) && (t.tag === "BUY" || t.refill?.length))
    .sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999") || (b.edited || "").localeCompare(a.edited || ""));
  const openRefills = (id) => S.tasks.filter((t) => t.refill?.includes(id) && t.status !== ST.done);
  const stockSoon = () => S.stock.filter((x) => x.left != null && x.left <= 3 && !openRefills(x.id).length);
  const leftTx = (x) => (x.left == null ? "" : x.left < 0 ? `切れて${-x.left}日` : x.left === 0 ? "今日切れる" : `あと${x.left}日`);
  const leftColor = (x) => (x.left == null ? "var(--s-some)" : x.left <= 0 ? "var(--late)" : x.left <= 7 ? "var(--s-today)" : "var(--ok)");

  function shopParse(raw) {
    const lines = raw.split("\n"); const items = []; let group = "";
    lines.forEach((l, i) => {
      const h = l.match(/^#{1,4}\s+(.+)$/) || l.match(/^<h[1-4][^>]*>(.*)<\/h[1-4]>\s*$/);
      if (h) { group = text(h[1]); return; }
      const m = l.match(TODO_RE);
      if (m) items.push({ li: i, depth: (m[1].match(/\t/g) || []).length + Math.floor(m[1].replace(/\t/g, "").length / 2), done: m[2] !== " ", text: text(m[3]) || "（空）", group });
    });
    return { lines, items };
  }
  // lines[i..j] を、本文の中で1か所だけになるまで前後に広げる
  function uniqSpan(lines, i, j, raw) {
    let a = i, b = j;
    while (raw.split(lines.slice(a, b + 1).join("\n")).length - 1 > 1 && (a > 0 || b < lines.length - 1)) { if (a > 0) a--; else b++; }

  // 1つ前の書き込みが終わってから次を書く（同じページへの書き込みが追い越さないように）

  async function shopFail(t, err) {

  function touched(t) { t.edited = new Date().toISOString(); if (shopRaw[t.id]) shopRaw[t.id].edited = t.edited; }

  let shopLoading = false;
  async function loadShopBodies() {
    if (shopLoading || S.mode === "loading" || S.mode === "error") return;
    const todo = shopLists().filter((t) => shopRaw[t.id]?.edited !== t.edited).slice(0, 12);
    if (!todo.length) return;
    shopLoading = true;
    const worker = async () => { for (let t; (t = todo.shift());) { try { shopRaw[t.id] = { edited: t.edited, raw: await fetchBody(t.id) }; } catch { shopRaw[t.id] = { edited: t.edited, raw: "", err: true }; } } };
    await Promise.all([worker(), worker(), worker()]);

  }

  function renderShop(view) {
    const lists = shopLists(); const soon = stockSoon().length;
    view.insertAdjacentHTML("beforeend", `<div class="seg">${[["list", "買い物リスト", lists.length], ["stock", "在庫・補充", soon ? `${soon}!` : S.stock.length]].map(([k, n, x]) => `<button type="button" data-shopseg="${k}" aria-pressed="${S.shopSeg === k}">${n}<span class="n">${x}</span></button>`).join("")}</div>`);

      <select id="shopto" aria-label="足す先">${targets.map((t) => `<option value="${t.id}" ${t.id === S.shopTarget ? "selected" : ""}>${esc(short(t.name, 12))}</option>`).join("")}<option value="" ${S.shopTarget ? "" : "selected"}>＋ 新しいリスト</option></select>

  function shopCard(t) {
    const m = metaOf(t); const got = shopRaw[t.id];

    const head = `<div class="shead"><button type="button" class="sname" data-open="${t.id}">${esc(t.name)}</button>${link}<span class="meta${m.late ? " late" : ""}">${esc(t.date ? m.tx : STAGES[stageOf(t)].name)}</span></div>`;
    if (!got) return `<section class="slist">${head}<div class="mute sline">読みこみ中…</div></section>`;

      // チェックリストのない買い物（1品だけ・ネット注文など）は、タスクごと済みにする
      return `<section class="slist one" style="--c:var(--s-today)"><div class="row"><button type="button" class="check" data-done="${t.id}" aria-label="買えた">✓</button><button type="button" class="main" data-open="${t.id}"><span class="nm">${esc(t.name)}</span><span class="sub">${esc(t.next || (t.refill?.length ? "補充" : ""))}</span></button>${link}<span class="meta${m.late ? " late" : ""}">${esc(t.date ? m.tx : "")}</span></div></section>`;
    }

    const rowsHtml = items.filter((x) => !(S.shopHide && x.done)).map((x) => {

      return `${gh}<button type="button" class="sitem${x.done ? " on" : ""}" data-shopitem="${t.id}:${x.li}" style="--d:${x.depth}" aria-pressed="${x.done}"><span class="check${x.done ? " on" : ""}" aria-hidden="true">✓</span><span class="tx">${esc(x.text)}</span></button>`;
    }).join("");

    return `<section class="slist">${head}<div class="sprog"><i style="--p:${Math.round((done / items.length) * 100)}%"></i><span>${done}/${items.length}</span></div>${rowsHtml || `<div class="mute sline">全部買えました</div>`}
      <div class="sfoot">${done ? `<button type="button" class="btn" data-shopclear="${t.id}">買えた${done}品をリストから消す</button>` : ""}${!left ? `<button type="button" class="btn ok" data-shopdone="${t.id}">買い物を終える（済みにする）</button>` : ""}</div></section>`;
  }

  function toggleItem(id, li) {
    const t = known.get(id); const got = shopRaw[id]; if (!t || !got) return;
    const lines = got.raw.split("\n"); const line = lines[li]; const m = line?.match(TODO_RE); if (!m) return;
    const nl = line.replace(/\[( |x|X)\]/, m[2] === " " ? "[x]" : "[ ]");
    const [a, b] = uniqSpan(lines, li, li, got.raw);
    const old = lines.slice(a, b + 1).join("\n"); lines[li] = nl; const nw = lines.slice(a, b + 1).join("\n");
    got.raw = lines.join("\n"); touched(t); render();
    if (S.mode === "demo") { DEMO_BODIES[id] = got.raw; return; }

  async function addItem() {
    const i = $("#shopin"); const name = i.value.trim(); if (!name) { i.focus(); return; }
    const item = `- [ ] ${name.replace(/([\\*_`<>[\]~])/g, "\\$1")}`;
    const t = known.get($("#shopto").value);
    i.value = ""; i.focus();
    if (!t) {
      try { const nt = await createShopTask({ "名前": "買い物リスト", "枠": "🏠 家・外" }, item); shopRaw[nt.id] = { edited: nt.edited, raw: item }; S.shopTarget = nt.id; render(); toast("新しい買い物リストを作りました"); $("#shopin")?.focus(); }
      catch (err) { i.value = name; toast(`作れませんでした：${errText(err)}`); }
      return;
    }
    S.shopTarget = t.id;
    const got = shopRaw[t.id] || { raw: "" }; const lines = got.raw.split("\n");
    // 最後のチェック項目（とその下の入れ子）の後ろに足す。チェック項目がなければ本文の最後へ
    let k = -1; lines.forEach((l, n) => { if (TODO_RE.test(l)) k = n; });
    let job;
    if (k >= 0) {
      let j = k; const ind = lines[k].match(/^\s*/)[0].length; while (j + 1 < lines.length && lines[j + 1].trim() && lines[j + 1].match(/^\s*/)[0].length > ind) j++;
      const [a, b] = uniqSpan(lines, k, j, got.raw);
      const old = lines.slice(a, b + 1).join("\n"); const nwLines = lines.slice(a, b + 1); nwLines.splice(j - a + 1, 0, item);
      const nw = nwLines.join("\n"); lines.splice(j + 1, 0, item);
      job = () => call("update", { page_id: t.id, command: "update_content", content_updates: [{ old_str: old, new_str: nw }], allow_async: false }, { read: false });
    } else {
      if (got.raw.trim()) lines.push(""); lines.push(item);
      job = () => call("update", { page_id: t.id, command: "insert_content", content: item, allow_async: false }, { read: false });
    }
    shopRaw[t.id] = { ...got, raw: lines.join("\n").replace(/^\n+/, "") }; touched(t); render(); $("#shopin")?.focus();
    if (S.mode === "demo") { DEMO_BODIES[t.id] = shopRaw[t.id].raw; return; }
    setSync("busy");
    shopWrite(t.id, async () => { try { await job(); setSync("ok"); } catch (err) { await shopFail(t, err); } });
  }
  // 買えた項目（と、その下の入れ子）を本文から消す
  function clearChecked(id) {
    const t = known.get(id); const got = shopRaw[id]; if (!t || !got) return;
    const lines = got.raw.split("\n"); const chunks = [];
    for (let n = 0; n < lines.length; n++) {
      const m = lines[n].match(TODO_RE); if (!m || m[2] === " ") continue;
      let j = n; const ind = m[1].length; while (j + 1 < lines.length && lines[j + 1].trim() && lines[j + 1].match(/^\s*/)[0].length > ind) j++;
      const last = chunks.at(-1); if (last && last[1] === n - 1) last[1] = j; else chunks.push([n, j]);
      n = j;
    }
    if (!chunks.length) return;
    const keep = lines.filter((_, n) => !chunks.some(([a, b]) => n >= a && n <= b));
    const updates = chunks.map(([s, e]) => {
      let a = s, b = e; // 前後の1行を含めて1か所に決める
      if (a > 0) a--; else if (b < lines.length - 1) b++;
      [a, b] = uniqSpan(lines, a, b, got.raw);
      return { old_str: lines.slice(a, b + 1).join("\n"), new_str: lines.slice(a, b + 1).filter((_, k) => k + a < s || k + a > e).join("\n") };
    });
    const whole = !keep.some((l) => l.trim());
    got.raw = keep.join("\n"); touched(t); render();
    toast(`買えた ${chunks.reduce((n, [a, b]) => n + b - a + 1, 0)}行をリストから消しました`);
    if (S.mode === "demo") { DEMO_BODIES[id] = got.raw; return; }
    setSync("busy");
    shopWrite(id, async () => {
      try {
        if (whole) await call("update", { page_id: id, command: "replace_content", new_str: "", allow_async: false }, { read: false });
        else await call("update", { page_id: id, command: "update_content", content_updates: updates, allow_async: false }, { read: false });
        setSync("ok");
      } catch (err) { await shopFail(t, err); }
    });
  }
