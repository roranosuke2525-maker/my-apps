name = "kaimono"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# 15分ごとに動く：買い物の時刻のリマインド（30分前・ちょうど）と、毎時0分台に在庫アラート（時刻を選んだ端末だけ）
[triggers]
crons = ["*/15 * * * *"]

# 通知を受ける端末の登録（宛先・時刻・何日前から）と通知の鍵
[[kv_namespaces]]
binding = "SUBS"
id = "03aa8893821942c0a13fd8f7dba53529"

# 写真から商品を当てる（Cloudflare Workers AI。無料枠の中で使う）
[ai]
binding = "AI"

[vars]
# データソースID（IDだけでは読み書きできない。権限はインテグレーションの接続で決まる）
TASK_DS_ID = "21762844-acbe-8075-bbe6-000bcaf22801"   # DB_タスク管理（買い物リスト＝分類タグ BUY のタスク）
DAILY_DS_ID = "53881991-7268-41b5-8954-2bc4b2bf1971"  # DB_Daily（在庫・補充）
TEMPLATE_DS_ID = "88548654-76ee-40be-a367-74ccaaa466e1"  # DB_買い物テンプレート（よく買う品のひな形）
PLAYER_ID = "3e962844acbe81b0843ff78fe19791fa"        # DB_プレイヤー（作るタスクのプレイヤー。届かなければ付けない）
# 通知（Web Push）の送り主。鍵は Worker がはじめて使うときに作って KV（SUBS の "vapid"）にしまう
VAPID_SUBJECT = "https://kaimono.roranosuke2525.workers.dev"

# 秘密の値は Cloudflare の「変数とシークレット」か wrangler secret put で入れる（このファイルには書かない）
#   NOTION_TOKEN : Notion 内部インテグレーションのシークレット（ntn_...）
#   APP_KEY      : アプリを開くときの合言葉（16文字以上）
#   YAHOO_APPID  : Yahoo!ショッピングAPI の Client ID（バーコードから商品名を引く。なくても動く）
