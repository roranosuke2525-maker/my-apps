<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>しおり</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <h1>しおり</h1>
      <span class="tagline">付箋とハイライトの読書ノート</span>
    </div>
    <button type="button" id="reload" class="icon-btn" aria-label="Notion から読み直す">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
    </button>
  </header>

  <main>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <!-- 本棚 -->
    <section id="view-shelf" class="view">
      <div class="shelf-head">
        <div id="shelf-filter" class="seg" role="tablist" aria-label="ステータスで絞る"></div>
        <button type="button" id="add-book-open" class="btn ghost small">＋ 本を足す</button>
      </div>
      <form id="add-book" class="card form" hidden>
        <label>書籍名<input id="nb-title" required maxlength="200" autocomplete="off" placeholder="例：月と六ペンス"></label>
        <div class="row2">
          <label>著者名<input id="nb-author" list="authors" maxlength="60" autocomplete="off" placeholder="例：サマセット•モーム"></label>
          <label>出版社<input id="nb-publisher" list="publishers" maxlength="60" autocomplete="off" placeholder="例：新潮文庫"></label>
        </div>
        <datalist id="authors"></datalist>
        <datalist id="publishers"></datalist>
        <div class="actions">
          <button type="button" id="add-book-cancel" class="btn ghost">やめる</button>
          <button type="submit" class="btn">読書メモ_DB に足す</button>
        </div>
      </form>
      <ol id="books" class="books"></ol>
    </section>

    <!-- 付箋を撮る -->
    <section id="view-photo" class="view" hidden>
      <label class="pick">本<select id="photo-book"></select></label>
      <label id="photo-drop" class="drop">
        <input id="photo-input" type="file" accept="image/*" multiple>
        <span class="drop-icon" aria-hidden="true"></span>
        <strong>付箋のページを撮る・選ぶ</strong>
        <span>何枚でも。1枚ずつ文字に起こして、大事な所に色を付けます</span>
      </label>
      <p id="photo-off" class="note" hidden></p>
      <div id="pages" class="pages"></div>
      <div id="photo-save-all" class="sticky-actions" hidden>
        <button type="button" id="photo-save" class="btn">選んだハイライトを保存</button>
      </div>
    </section>

    <!-- Kindle -->
    <section id="view-kindle" class="view" hidden>
      <div class="card guide">
        <p>Kindle の「メモとハイライト」（<a href="https://read.amazon.co.jp/notebook" target="_blank" rel="noopener">read.amazon.co.jp/notebook</a>）で本を開き、ページ全体をコピーして下に貼ります。Kindle 端末の「My Clippings.txt」の中身でも読めます。</p>
      </div>
      <label class="pick">本<select id="kindle-book"></select></label>
      <textarea id="kindle-text" rows="7" placeholder="黄色のハイライト | 位置: 1,234&#10;ここにハイライトの文…&#10;メモ: 自分のメモ"></textarea>
      <div class="actions">
        <button type="button" id="kindle-ai" class="btn ghost">AIで読み取る</button>
        <button type="button" id="kindle-parse" class="btn">読み取る</button>
      </div>
      <div id="kindle-result"></div>
    </section>

    <!-- 読み終えた -->
    <section id="view-done" class="view" hidden>
      <label class="pick">本<select id="done-book"></select></label>
      <div id="done-body"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="画面">
    <button type="button" data-view="shelf" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 5l3.5 1-3.5 14-3.4-1z"/></svg>本棚</button>
    <button type="button" data-view="photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>付箋を撮る</button>
    <button type="button" data-view="kindle"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 7h6M9 10h6M9 13h4"/></svg>Kindle</button>
    <button type="button" data-view="done"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>読み終えた</button>
  </nav>
</div>

<!-- 本を開いたとき -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <div class="sheet-titles">
        <h2 id="sheet-title"></h2>
        <p id="sheet-sub"></p>
      </div>
      <button type="button" id="sheet-close" class="icon-btn" aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="parse.js"></script>
<script src="app.js" type="module"></script>
</body>
</html>
